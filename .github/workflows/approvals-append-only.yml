name: approvals-append-only

# S-91: a pull request that drops, changes or moves a row of approvals.tsv / reviews.tsv is red. Only breaks the
# pull request brings count (--base); a known, owner-approved break is excused by append-only-exceptions.tsv on main.
# S-115 F-8 (independent review 2026-11-01): on every push to main, the packs whose approval / review rows the push
# brought are read STRICTLY (`check <paket> --ref HEAD`): a module pull request merged by the wrong person (not listed,
# high = hayır, the row author's other account, an opener who is not the row's author) makes main red at once — the
# human step is measured when the row reaches main, not only at the pack's next revision. Only the touched packs are
# checked (GitHub quota); gh runs with the workflow token.
# Every pull request runs it (no paths filter): append-only is a REQUIRED check, and a required check whose workflow a
# paths filter skips never reports — "Expected — Waiting for status to be reported" blocks every unrelated PR (EES
# 2026-11-11). The history check runs on every pull request (~30-60 s) with no shortcut: a tree diff would miss a row
# deleted in one commit and restored in the next, which history (commit by commit) catches (blind review, 2026-11-11).
# EES MQ-01: merge_group runs the pull request's check on the queue's merge group, against the group's parent commit.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
    paths:
      - "execution/approvals/**"
      - "scripts/pack_approval.py"
      - ".github/workflows/approvals-append-only.yml"

permissions:
  contents: read
  pull-requests: read

# EES CI-ISRAF-01: a new commit on a pull request cancels that pull request's older run of this workflow, whose result
# nobody reads any more. A push to main, a merge group and a manual run each get a group of their own (the run id), so
# they are never cancelled and never wait for another run. A re-run (run_attempt 2 or more) also gets a group of its own:
# re-running an older commit's run can never cancel the newest commit's run (Codex round 1, CI-ISRAF-01).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}-${{ github.event_name != 'pull_request' && github.run_id }}-${{ github.run_attempt != '1' && github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job, one token line, no if: (CiServiceTestsGuardTests): the event is told apart in the shell. A failing command
  # in either branch fails the step.
  append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
      - name: Pull request append-only check, push strict approval check
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          BEFORE_SHA: ${{ github.event.before }}
        # pull_request: new append-only breaks only. push to main: pack_approval.py ci-main reads the packs of the APPROVE
        # rows the push added, strictly at HEAD; exit 1 only for a human-step class refusal; state refusals and an
        # unmeasurable reading (quota) are ::warning:: lines (G-2, G-12); an empty / zero BEFORE_SHA falls back to HEAD^1.
        # merge_group (EES MQ-01): the pull request's history check, its base the group's parent commit (merge_group.base_sha;
        # an empty one is unresolvable: exit 2, red). Any other event is red — never a silent ci-main.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 scripts/pack_approval.py history --ref HEAD --base "$BASE_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            python3 scripts/pack_approval.py history --ref HEAD --base "$GROUP_BASE_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python3 scripts/pack_approval.py ci-main "$BEFORE_SHA" HEAD
          else
            echo "beklenmeyen olay: $GITHUB_EVENT_NAME"
            exit 1
          fi
