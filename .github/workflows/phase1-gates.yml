name: phase1-gates

on:
  push:
    branches: ["**"]
  pull_request:

# WP-CI-SERVICE-TESTS-03 (CT decision): the same rule as service-tests.yml — read-only token, no secret, and every action
# one of the allowed ones pinned to a COMMIT SHA (a tag can be moved). The SHAs are what the floating @v4 tags resolved
# to on 2026-10-10 (git ls-remote: checkout v4 = v4.4.0, setup-dotnet v4 = v4.3.1), so the gates run exactly as before.
permissions:
  contents: read

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      # WP-CI-SERVICE-TESTS-03 (CT decision b): these service test projects are not in their solution, so the gates
      # (dotnet build <solution>) never compile them — e3d3a7331 broke Eventing.Tests and nobody saw it. BUILD only:
      # their tests need RabbitMQ / an owned mongod and run in service-tests.yml. Guard: CiServiceTestsGuardTests.
      - name: Build Platform.Eventing.Tests (not in the solution)
        run: dotnet build services/Diten.Platform/tests/Diten.Platform.Eventing.Tests/Diten.Platform.Eventing.Tests.csproj -c Debug

      - name: Build Platform.BackgroundJobs.Tests (not in the solution)
        run: dotnet build services/Diten.Platform/tests/Diten.Platform.BackgroundJobs.Tests/Diten.Platform.BackgroundJobs.Tests.csproj -c Debug

      - name: Build AuthService.AccountKindAcceptanceHost.Tests (not in the solution)
        run: dotnet build services/Diten.AuthService/tests/Diten.AuthService.AccountKindAcceptanceHost.Tests/Diten.AuthService.AccountKindAcceptanceHost.Tests.csproj -c Debug

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Phase 1 Gates
        run: ./scripts/run_phase1_gates.sh
