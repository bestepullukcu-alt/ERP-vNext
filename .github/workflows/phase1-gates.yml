name: phase1-gates

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  phase1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Phase 1 Gates
        run: ./scripts/run_phase1_gates.sh
