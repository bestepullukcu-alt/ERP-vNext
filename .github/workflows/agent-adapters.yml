name: agent-adapters

# İ5-A — the tool adapters under .claude/, .codex/ and .agents/ are generated from .antigravity/ by
# .antigravity/scripts/sync_adapters.py. This job fails when an adapter no longer matches its source, when an
# adapter was edited by hand, or when an unlisted file sits in a tool discovery folder. It runs on Linux and on
# Windows (the Windows runner checks out with core.autocrlf=true; no symlinks are used). It reads no secret.
# Written to the CiServiceTestsGuardTests rules: one read-only token, actions pinned to a commit, no shell override.

# EES CI-ISRAF-01: like phase1-gates (owner decision 2026-11-02), a pushed branch is checked through its pull request and
# main after every merge; a branch push used to run the same two jobs a second time.
on:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".antigravity/**"
      - ".claude/agents/**"
      - ".claude/skills/**"
      - ".claude/rules/**"
      - ".codex/**"
      - ".agents/**"
      - ".github/workflows/agent-adapters.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".antigravity/**"
      - ".claude/agents/**"
      - ".claude/skills/**"
      - ".claude/rules/**"
      - ".codex/**"
      - ".agents/**"
      - ".github/workflows/agent-adapters.yml"

permissions:
  contents: read

# EES CI-ISRAF-01: a new commit on a pull request cancels that pull request's older run of this workflow, whose result
# nobody reads any more. A push to main, a merge group and a manual run each get a group of their own (the run id), so
# they are never cancelled and never wait for another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}-${{ github.event_name != 'pull_request' && github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  adapters:
    name: adapters match source (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # Evidence only: on Windows the adapters show as w/crlf, on Linux as w/lf; --check must be green on both.
      - name: Line endings of the adapters in this checkout
        run: git ls-files --eol -- .claude/agents .claude/skills .claude/rules .codex .agents

      - name: Adapters match their sources
        run: ${{ matrix.python }} .antigravity/scripts/sync_adapters.py --check
