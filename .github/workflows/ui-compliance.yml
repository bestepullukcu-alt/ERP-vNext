name: ui-compliance

# MOD-0286 DL-3 (pack rev 14 §"Separate CI job", AC-17 / AC-20): the UI compliance selector on the pages a pull request
# touches. Its own job, not a phase1 step: a red phase1 does not stop it and it does not read phase1's result. Same rule as
# phase1-gates.yml — read-only token, no secret, actions pinned to a COMMIT SHA. No .NET, no service.
# Every pull request starts it (owner decision 2026-11-02), so branch protection can require it: a required check whose
# workflow is path-filtered never reports on other PRs and they wait forever. The selector itself picks the touched pages;
# a PR that touches none ends with exit 0 in under a second (measured on 1ae33452d..6b3bf573a).
# EES merge queue (MQ-01): merge_group too, with the group's parent commit as the base (no pull_request payload there).
on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# EES CI-ISRAF-01: a new commit on a pull request cancels that pull request's older run of this workflow, whose result
# nobody reads any more. A push to main, a merge group and a manual run each get a group of their own (the run id), so
# they are never cancelled and never wait for another run. A re-run (run_attempt 2 or more) also gets a group of its own:
# re-running an older commit's run can never cancel the newest commit's run (Codex round 1, CI-ISRAF-01).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}-${{ github.event_name != 'pull_request' && github.run_id }}-${{ github.run_attempt != '1' && github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # <base>...HEAD needs both sides' history

      - name: Changed-page selector
        id: selector
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          start=$(date +%s)
          # The event is told apart in the shell (no if:); an empty base is the selector's tool error (exit 2), red.
          base="$BASE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then base="$GROUP_BASE_SHA"; fi
          if python3 scripts/uic_changed_pages.py --base "$base" > uic-selector-stdout.txt; then code=0; else code=$?; fi
          cat uic-selector-stdout.txt
          echo "SHA-256 (stdout): $(sha256sum uic-selector-stdout.txt | cut -d' ' -f1)"
          echo "Süre: $(( $(date +%s) - start )) s (yalnız değişen sayfalar; CI'da tüm-sayfa kipi yok)"
          echo "Seçici çıkışı: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Keep the selector output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uic-selector-stdout
          path: uic-selector-stdout.txt
          if-no-files-found: error

      - name: Fail on every selector exit except 0
        env:
          CODE: ${{ steps.selector.outputs.code }}
        run: |
          # Only 0 is green: the selector defines 0, 1 and 2; anything else (127 command not found, 137 killed, empty) is red
          # (no "exit 0": CiServiceTestsGuardTests bans it in every workflow; the 0 branch simply ends the step green)
          case "$CODE" in
            0) echo "Seçici çıkışı 0: yeşil (taban dışında kırmızı yok)." ;;
            1) echo "Seçici çıkışı 1: kırmızı (yeni kırmızı)."; exit 1 ;;
            2) echo "Seçici çıkışı 2: kırmızı (araç hatası)."; exit 1 ;;
            *) echo "Seçici çıkışı ${CODE:-boş}: kırmızı (beklenmeyen çıkış)."; exit 1 ;;
          esac
