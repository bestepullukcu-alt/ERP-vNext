name: ui-compliance

# MOD-0286 DL-3 (pack rev 14 §"Separate CI job", AC-17 / AC-20): the UI compliance selector on the pages a pull request
# touches. Its own job, not a phase1 step: a red phase1 does not stop it and it does not read phase1's result. Same rule as
# phase1-gates.yml — read-only token, no secret, actions pinned to a COMMIT SHA. No .NET, no service. A pull request that
# changes only the selector, the baseline or this file still starts the job; deletions and renames match the path filter.
on:
  pull_request:
    paths:
      - 'frontend/Diten.Web/Views/**'
      - 'frontend/Diten.Web/wwwroot/assets/js/**'
      - 'frontend/Diten.Web/Resources/**'
      - 'frontend/Diten.Web/Services/Help/PageHelpCatalog.cs'
      - 'frontend/Diten.Web/wwwroot/assets/json/platform-search.en.json'
      - 'frontend/Diten.Web/wwwroot/assets/json/platform-search.tr.json'
      - 'scripts/uic_changed_pages.py'
      - 'tests/ui-compliance-baseline.tsv'
      - '.github/workflows/ui-compliance.yml'

permissions:
  contents: read

jobs:
  ui-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # <base>...HEAD needs both sides' history

      - name: Changed-page selector
        id: selector
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          start=$(date +%s)
          if python3 scripts/uic_changed_pages.py --base "$BASE_SHA" > uic-selector-stdout.txt; then code=0; else code=$?; fi
          cat uic-selector-stdout.txt
          echo "SHA-256 (stdout): $(sha256sum uic-selector-stdout.txt | cut -d' ' -f1)"
          echo "Süre: $(( $(date +%s) - start )) s (yalnız değişen sayfalar; CI'da tüm-sayfa kipi yok)"
          echo "Seçici çıkışı: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Keep the selector output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uic-selector-stdout
          path: uic-selector-stdout.txt
          if-no-files-found: error

      - name: Fail on every selector exit except 0
        env:
          CODE: ${{ steps.selector.outputs.code }}
        run: |
          # Only 0 is green: the selector defines 0, 1 and 2; anything else (127 command not found, 137 killed, empty) is red
          # (no "exit 0": CiServiceTestsGuardTests bans it in every workflow; the 0 branch simply ends the step green)
          case "$CODE" in
            0) echo "Seçici çıkışı 0: yeşil (taban dışında kırmızı yok)." ;;
            1) echo "Seçici çıkışı 1: kırmızı (yeni kırmızı)."; exit 1 ;;
            2) echo "Seçici çıkışı 2: kırmızı (araç hatası)."; exit 1 ;;
            *) echo "Seçici çıkışı ${CODE:-boş}: kırmızı (beklenmeyen çıkış)."; exit 1 ;;
          esac
