<div style="min-height:100vh;display:flex;flex-direction:column;background:#e6e7ee">
  <div ref="{{ barRef }}" dir="ltr" style="position:sticky;top:0;z-index:200;background:#fff;border-bottom:1px solid #dcdfe6;padding:10px 20px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;font-size:13px;color:#384551">
    <div style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px"><i class="bx bx-edit" style="font-size:20px;color:#0b1a8c"></i>W3 yazım ekranları · mockup</div>
    <label style="display:flex;align-items:center;gap:8px">Ekran
      <sc-raw-select ref="{{ selRef }}" sc-camel-on-change="{{ onPreset }}" style="height:32px;border:1px solid #d9dee3;border-radius:6px;padding:0 10px;font-size:13px;color:#384551;background:#fff;min-width:300px">

    </label>
    <label style="display:flex;align-items:center;gap:8px">Rol
      <sc-raw-select ref="{{ roleRef }}" sc-camel-on-change="{{ onRole }}" style="height:32px;border:1px solid #d9dee3;border-radius:6px;padding:0 10px;font-size:13px;color:#384551;background:#fff">
        <sc-for list="{{ roles }}" as="r"><option value="{{ r.k }}">{{ r.l }}</option></sc-for>
      </sc-raw-select>
    </label>
    <div role="radiogroup" aria-label="Dil" style="display:flex;border:1px solid #d9dee3;border-radius:6px;overflow:hidden">
      <sc-for list="{{ langs }}" as="l" hint-placeholder-count="2"><button sc-camel-on-click="{{ l.go }}" style="border:0;padding:6px 12px;font-size:13px;cursor:pointer;background:{{ l.bg }};color:{{ l.fg }}">{{ l.l }}</button></sc-for>
    </div>
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" checked="{{ failSave }}" sc-camel-on-change="{{ toggleFail }}" style="accent-color:#0b1a8c">Kaydetme hatası (demo)</label>
  </div>

  <sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
  <div dir="{{ dir }}" lang="{{ lang }}" style="flex:1;display:flex;min-height:0;background:var(--bg)">
    <sc-if value="{{ sideFull }}" hint-placeholder-val="{{ true }}">
      <aside style="width:260px;flex:0 0 auto;background:var(--card);box-shadow:var(--sh);display:flex;flex-direction:column;position:sticky;top:{{ barH }}px;height:calc(100vh - {{ barH }}px);z-index:2">
        <div style="height:64px;display:flex;align-items:center;gap:10px;padding:0 24px">
          <div style="width:32px;height:32px;border-radius:8px;background:#0b1a8c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">GM</div>
          <span style="font-size:20px;font-weight:700;color:var(--h);letter-spacing:-.2px">Grand Medical</span>
        </div>
        <nav style="display:flex;flex-direction:column;gap:2px;padding:4px 0 16px;overflow-y:auto">
          <sc-for list="{{ menu }}" as="m" hint-placeholder-count="10">
            <sc-if value="{{ m.head }}"><div style="padding:18px 32px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mu)">{{ m.l }}</div></sc-if>

              <div style="position:relative;padding:0 16px">
                <a href="#" sc-camel-on-click="{{ m.go }}" style="height:40px;display:flex;align-items:center;gap:10px;padding-inline:{{ m.pad }};border-radius:6px;font-size:15px;text-decoration:none;background:{{ m.bg }};color:{{ m.fg }};font-weight:{{ m.fw }}">

                </a>
                <sc-if value="{{ m.on }}"><span style="position:absolute;inset-inline-end:0;top:4px;bottom:4px;width:4px;border-start-start-radius:4px;border-end-start-radius:4px;background:var(--p)"></span></sc-if>
              </div>
            </sc-if>
          </sc-for>
        </nav>
      </aside>
    </sc-if>
    <sc-if value="{{ sideMini }}">
      <aside style="width:72px;flex:0 0 auto;background:var(--card);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;position:sticky;top:{{ barH }}px;height:calc(100vh - {{ barH }}px);z-index:2">
        <div style="height:64px;display:flex;align-items:center"><div style="width:32px;height:32px;border-radius:8px;background:#0b1a8c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">GM</div></div>
        <sc-for list="{{ menuMini }}" as="m">
          <a href="#" sc-camel-on-click="{{ m.go }}" title="{{ m.l }}" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:6px;margin:2px 0;background:{{ m.bg }};color:{{ m.fg }}"><i class="bx {{ m.ic }}" style="font-size:22px"></i></a>
        </sc-for>
      </aside>
    </sc-if>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column">
      <div style="flex:1;padding:24px;min-width:0;max-width:1440px;width:100%;margin:0 auto">
        <sc-if value="{{ unauth }}">
          <div data-screen-label="Yetkiniz yok" style="min-height:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center">
            <div style="font-size:84px;line-height:1;font-weight:600;color:var(--h)">403</div>
            <div style="font-size:22px;font-weight:500;color:var(--h)">{{ L.noAuthT }}</div>
            <div style="font-size:15px;max-width:440px;text-wrap:pretty">{{ L.noAuthD }}</div>
            <div style="font:12px ui-monospace,monospace;color:var(--mu)">UAS-001</div>
            <button sc-camel-on-click="{{ goHome }}" style="height:40px;background:var(--p);color:#fff;border:0;border-radius:6px;padding:0 20px;font-size:15px;font-weight:500;cursor:pointer;box-shadow:0 2px 4px rgba(11,26,140,.35)">{{ L.home }}</button>
          </div>
        </sc-if>
        <sc-if value="{{ showA }}" hint-placeholder-val="{{ true }}">
          <dc-import name="Itirazlar" app="{{ app }}" hint-size="100%,640px"></dc-import>
        </sc-if>
        <sc-if value="{{ showB }}">
          <dc-import name="KPAdim" app="{{ app }}" hint-size="100%,640px"></dc-import>
        </sc-if>
        <sc-if value="{{ showC }}">
          <dc-import name="ZiyaretKanit" app="{{ app }}" hint-size="100%,640px"></dc-import>
        </sc-if>
      </div>
      
    </div>
    <sc-if value="{{ hasToast }}">
      <div role="status" style="position:fixed;top:140px;inset-inline-end:32px;z-index:300;background:var(--card);border-radius:8px;box-shadow:var(--sh2);padding:14px 18px;display:flex;align-items:center;gap:10px;max-width:420px;font-size:14px;color:var(--h)">
        <i class="bx bx-check-circle" style="font-size:22px;color:var(--okc)"></i><span>{{ toast }}</span>
      </div>
    </sc-if>
  </div>
  </sc-if>
</div>

<script type="text/x-dc" data-dc-script="">
const DEF={screen:'itiraz',view:'list',id:null,empty:false,bMode:'tab',bPub:false,step:1,cDlg:false,cDirty:false};
const PRESETS=[
 {k:'a1',l:'A1 · İtiraz kütüphanesi — liste',role:'yazar',n:{}},
 {k:'a1e',l:'A1 · İtiraz kütüphanesi — boş durum',role:'yazar',n:{empty:true}},
 {k:'a2n',l:'A2 · Yeni itiraz yanıtı',role:'yazar',n:{view:'edit',id:null}},
 {k:'a2',l:'A2 · Düzenle — taslak',role:'yazar',n:{view:'edit',id:'o9'}},
 {k:'a3',l:'A3 · Onaylı — salt okunur',role:'yazar',n:{view:'detail',id:'o2'}},
 {k:'a3o',l:'A3 · Onay bekliyor — onaylayıcı onaylar',role:'onay',n:{view:'detail',id:'o3'}},
 {k:'a3s',l:'A3 · Onay bekliyor — kendi taslağı (görev ayrılığı)',role:'onay',n:{view:'detail',id:'o7'}},
 {k:'a3r',l:'A3 · Emekli kayıt',role:'yazar',n:{view:'detail',id:'o8'}},
 {k:'b1',l:'B · Adım düzenleyici — Sunum notları (sekme)',role:'yazar',n:{screen:'kp',bMode:'tab'}},
 {k:'b2',l:'B · Adım düzenleyici — Sunum notları (katlanır kart)',role:'yazar',n:{screen:'kp',bMode:'card'}},
 {k:'b3',l:'B · Yayınlanmış sürüm (salt okunur)',role:'yazar',n:{screen:'kp',bPub:true}},
 {k:'c1',l:'C1 + C2 · Kiracı varsayılanı seçili',role:'admin',n:{screen:'ziyaret'}},
 {k:'c2',l:'C2 · İş birimi seçili (alan bazında miras)',role:'admin',n:{screen:'ziyaret',cScope:'bu1'}},
 {k:'c2d',l:'C2 · İş birimi — kaydet onayı (N temsilci)',role:'admin',n:{screen:'ziyaret',cScope:'bu1',cDirty:true,cDlg:true}},
 {k:'c1l',l:'C1 · Etkin ayar araması (temsilci)',role:'admin',n:{screen:'ziyaret',cLook:'r1'}},
 {k:'c3',l:'C3 · Değişiklik geçmişi',role:'admin',n:{screen:'ziyaret',cScope:'bu1',cPane:'gecmis'}},
 {k:'c4',l:'C4 · Süreli istisnalar — liste',role:'admin',n:{screen:'ziyaret',cTab:'istisna'}},
 {k:'c4n',l:'C4 · Yeni istisna formu',role:'admin',n:{screen:'ziyaret',cTab:'istisna',xNew:true}},
 {k:'c4s',l:'C4 · İstisna onayı — görev ayrılığı',role:'admin',n:{screen:'ziyaret',cTab:'istisna',xOpen:'x5'}},
 {k:'c5',l:'C · Salt okuma yetkisi',role:'salt',n:{screen:'ziyaret',cScope:'bu1'}},
 {k:'r1',l:'AR · A1 liste (sağdan sola)',role:'yazar',lang:'ar',n:{}},
 {k:'r2',l:'AR · C2 iş birimi (sağdan sola)',role:'admin',lang:'ar',n:{screen:'ziyaret',cScope:'bu1'}},
 {k:'x',l:'Yetkisiz kullanıcı (UAS-001)',role:'yetkisiz',n:{}}
];
const ROLES=[['yazar','Yazar (Elif Kaya)'],['onay','Onaylayıcı (Dr. Murat Aydın)'],['salt','Salt okuma (Can Yücel)'],['yetkisiz','Yetkisiz (Okan Tekin)'],['admin','Kiracı yöneticisi (Deniz Er)']];
const PERM={yazar:{itiraz:'edit',kp:'edit',ziyaret:'none'},onay:{itiraz:'approve',kp:'edit',ziyaret:'none'},salt:{itiraz:'read',kp:'read',ziyaret:'read'},yetkisiz:{itiraz:'none',kp:'none',ziyaret:'none'},admin:{itiraz:'read',kp:'read',ziyaret:'edit'}};
const L={
 tr:{search:'Ara (Ctrl+/)',noAuthT:'Yetkiniz yok',noAuthD:'Bu sayfayı görüntüleme yetkiniz bulunmuyor. Erişim için yöneticinize başvurun.',home:'Ana sayfaya dön',
  m:{h1:'Ana menü',dash:'Gösterge paneli',h2:'Content Studio',kp:'Bilgi Yolları',claims:'Claims',itiraz:'İtiraz kütüphanesi',media:'Medya kütüphanesi',h3:'Saha',zca:'Ziyaret Çalışma Alanı',h4:'CRM Ayarlar',ziy:'Ziyaret',ziyaret:'Ziyaret kanıtı',ztur:'Ziyaret türleri',users:'Kullanıcılar ve roller',new:'Yeni'}},
 ar:{search:'بحث (Ctrl+/)',noAuthT:'ليس لديك صلاحية',noAuthD:'ليس لديك صلاحية لعرض هذه الصفحة. يرجى التواصل مع المسؤول للحصول على الوصول.',home:'العودة إلى الرئيسية',
  m:{h1:'القائمة الرئيسية',dash:'لوحة المعلومات',h2:'استوديو المحتوى',kp:'مسارات المعلومات',claims:'الادعاءات',itiraz:'مكتبة الاعتراضات',media:'مكتبة الوسائط',h3:'الميدان',zca:'مساحة عمل الزيارات',h4:'إعدادات CRM',ziy:'الزيارة',ziyaret:'إثبات الزيارة',ztur:'أنواع الزيارات',users:'المستخدمون والأدوار',new:'جديد'}}
};
class Component extends DCLogic {
  barRef=React.createRef();selRef=React.createRef();roleRef=React.createRef();
  syncDom(){const a=this.selRef.current,b=this.roleRef.current;if(a&&a.value!==this.state.preset)a.value=this.state.preset;if(b&&b.value!==this.state.role)b.value=this.state.role;const h=this.barRef.current?this.barRef.current.offsetHeight:53;if(h&&h!==this.state.barH)this.setState({barH:h})}
  state={barH:53,ready:!!window.W3D,preset:'a1',role:'yazar',lang:'tr',failSave:false,nav:{...DEF},obj:window.W3D?window.W3D.OBJ.map(o=>({...o})):[],visit:window.W3D?{...window.W3D.VISIT_SAVED}:null,toast:null,w:window.innerWidth};
  componentDidMount(){
    if(!window.W3D){this._p=setInterval(()=>{if(window.W3D){clearInterval(this._p);this.setState({ready:true,obj:window.W3D.OBJ.map(o=>({...o})),visit:{...window.W3D.VISIT_SAVED}})}},50)}
    this._rs=()=>this.setState({w:window.innerWidth});this.syncDom();window.addEventListener('resize',this._rs);
    try{const s=JSON.parse(localStorage.getItem('w3-shell')||'null');if(s&&s.preset&&PRESETS.find(x=>x.k===s.preset))this.pick(s.preset)}catch(e){}
  }
  componentWillUnmount(){window.removeEventListener('resize',this._rs);clearInterval(this._p)}
  componentDidUpdate(){this.syncDom();try{localStorage.setItem('w3-shell',JSON.stringify({preset:this.state.preset}))}catch(e){}}
  pick(k){const p=PRESETS.find(x=>x.k===k);this.setState({preset:k,role:p.role,lang:p.lang||'tr',nav:{...DEF,...p.n},obj:window.W3D?window.W3D.OBJ.map(o=>({...o})):this.state.obj,visit:window.W3D?{...window.W3D.VISIT_SAVED}:null})}
  toast(t){this.setState({toast:t});clearTimeout(this._t);this._t=setTimeout(()=>this.setState({toast:null}),3200)}
  renderVals(){
    const S=this.state,nav=S.nav,lang=S.lang,T=L[lang],M=T.m;
    const D=window.W3D;const me=D?D.PEOPLE[S.role]:{n:'',r:'',i:''};
    const perm=PERM[S.role][nav.screen];
    const go=(screen,p)=>this.setState(s=>({nav:{...DEF,...p,screen}}));
    const app={stickyTop:S.barH+20,nav,lang,role:S.role,me,perm,failSave:S.failSave,narrow:S.w<1200,obj:S.obj,visit:S.visit,
      set:p=>this.setState(s=>({nav:{...s.nav,...p}})),go,
      updObj:(id,p)=>this.setState(s=>({obj:s.obj.map(o=>o.id===id?{...o,...p}:o)})),
      addObj:o=>{const id='o'+(100+S.obj.length);this.setState(s=>({obj:[{...o,id},...s.obj]}));return id},
      setVisit:v=>this.setState({visit:v}),
      toast:t=>this.toast(t)};
    const items=[['h',M.h1],['i',M.dash,'bx-home-smile','x'],['h',M.h2],['i',M.kp,'bx-slideshow','kp'],['i',M.claims,'bx-check-shield','x'],['i',M.itiraz,'bx-message-square-error','itiraz',M.new],['i',M.media,'bx-images','x'],['h',M.h3],['i',M.zca,'bx-calendar-check','x'],['h',M.h4],['p',M.ziy,'bx-map-pin','grp'],['s',M.ziyaret,null,'ziyaret'],['s',M.ztur,null,'x'],['i',M.users,'bx-user-check','x']];
    const menu=items.map(([t,l,ic,k,badge])=>{const on=k===nav.screen,par=t==='p'&&nav.screen==='ziyaret';return{head:t==='h',item:t!=='h',sub:t==='s',ic:t==='s'?null:ic,l,badge,open:t==='p',on:on&&t!=='p',pad:t==='s'?'22px 14px':'14px',dot:on?'var(--p)':'var(--bd2)',
      bg:on?'var(--pl)':par?'var(--soft)':'transparent',fg:on||par?'var(--pt)':'var(--tx)',fw:on||par?500:400,
      go:e=>{e.preventDefault();if(k==='x'||k==='grp'){if(k==='x')this.toast(l+(lang==='ar'?' خارج نطاق هذا النموذج.':' bu mockup\'ın kapsamı dışında.'));return}go(k)}}});
    const menuMini=items.filter(i=>i[0]==='i'||i[0]==='s').map(([t,l,ic,k])=>{const on=k===nav.screen;return{l,ic:ic||(k==='ziyaret'?'bx-map-pin':'bx-list-check'),bg:on?'var(--pl)':'transparent',fg:on?'var(--pt)':'var(--tx)',go:e=>{e.preventDefault();if(k!=='x')go(k)}}});
    const unauth=perm==='none';
    return{
      ready:S.ready,preset:S.preset,presets:PRESETS,onPreset:e=>this.pick(e.target.value),
      role:S.role,roles:ROLES.map(([k,l])=>({k,l})),onRole:e=>this.setState({role:e.target.value}),
      langs:[['tr','Türkçe'],['ar','العربية']].map(([k,l])=>({l,bg:lang===k?'#0b1a8c':'#fff',fg:lang===k?'#fff':'#384551',go:()=>this.setState({lang:k})})),
      failSave:S.failSave,toggleFail:()=>this.setState(s=>({failSave:!s.failSave})),
      dir:lang==='ar'?'rtl':'ltr',lang,barRef:this.barRef,selRef:this.selRef,roleRef:this.roleRef,barH:S.barH,topH:S.barH+12,L:T,langCode:lang==='ar'?'AR':'TR',me,
      sideFull:false,sideMini:false,menu,menuMini,
      unauth,showA:!unauth&&nav.screen==='itiraz',showB:!unauth&&nav.screen==='kp',showC:!unauth&&nav.screen==='ziyaret',
      goHome:()=>this.toast(lang==='ar'?'الرئيسية خارج نطاق هذا النموذج.':'Ana sayfa bu mockup\'ın kapsamı dışında.'),
      app,hasToast:!!S.toast,toast:S.toast
    };
  }
}
</script>
