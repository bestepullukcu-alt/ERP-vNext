  responses:
    UnknownLot:
      description: Lot bulunamadı
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: UNKNOWN_LOT, message: "lot bulunamadı", correlationId: req-1 }, contractVersion: v1 } } }
    LotConflict:
      description: Aynı Tenant+SKU+LotNumber zaten var (DEC-INV-14 as changed 2026-10-05 — B-1; v1.0.0 said Tenant+Item+LotNumber)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: LOT_ALREADY_EXISTS, message: "bu item+lotNumber zaten var", correlationId: req-2 }, contractVersion: v1 } } }
    UnknownSerial:
      description: v1.1 — serial not found in the caller's tenant
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: UNKNOWN_SERIAL, message: "serial not found", correlationId: req-3 }, contractVersion: v1 } } }
    BadRequest:
      description: v1.1 — malformed request (INVALID_REQUEST or a named shape code)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: v1.1 — the caller lacks the permission for this lot's status (updateLot)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    LotVersionConflict:
      description: v1.1 — If-Match is stale (LOT_CONFLICT)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unprocessable:
      description: v1.1 — a business rule refused the request (see x-error-codes)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    MigrationConflict:
      description: v1.1 — MIGRATION_ALREADY_COMPLETED / MIGRATION_STALE / LOT_ALREADY_EXISTS
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ProductMasterUnavailable:
      description: v1.1 — PRODUCT-MASTER could not answer; nothing was written
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
