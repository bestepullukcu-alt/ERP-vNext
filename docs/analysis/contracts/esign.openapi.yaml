x-subject-provider-contract:
  description: "§6 — consumer side. GET {providerBaseUrl}/esign-subjects/{subjectType}/{subjectId} → 200 SignableSubject · 404 (unknown or not visible to the caller). Called by Platform with the caller's JWT and X-Tenant-Id. providerBaseUrl from Platform operator config ESign:SubjectProviders:{module}:BaseUrl, never from a manifest (WC-D1 Y2); in-process providers for Platform modules use the same shape. The provider owns the field list: a change to it changes the hash of new signatures only, and old signatures verify as changed only if the values changed — keep field names stable and version the list in the provider's own contract."
  operationId: getSignableSubject
  response: { $ref: '#/components/schemas/SignableSubject' }

x-workflow-addendum:
  description: "§5 — MOD-0023, additive only; implemented by E4."
  definitionJson: "step requirements gain optional signatureRequired (bool, absent = false) and signatureMeaning (meaning code, absent = null). Templates already published are unchanged and immutable. Publish validation (additive): when signatureRequired is true, signatureMeaning must be an active tenant meaning, else 400 ESIGN_MEANING_NOT_ALLOWED on publish."
  approveRequest: "POST /api/v1/workflow/tasks/{taskId}/approve — ApproveWorkflowTaskRequest gains trailing optional signatureId (default null)."
  workItemPayload: "POST /api/v1/work-items/{itemId}/actions/approve — WorkItemActionPayloadDto gains trailing signatureId ([JsonIgnore(WhenWritingNull)]); the in-process dispatcher passes it to the same command."
  behaviour:
    - "Steps without signatureRequired: identical to today. signatureId, if sent, is stored on the transition log and not validated."
    - "Steps with signatureRequired: missing → 409 ESIGN_SIGNATURE_REQUIRED; otherwise same tenant, signer.userId == actorId, meaningCode == step.signatureMeaning, context.workflowTaskId == taskId and context.decision == approve, no invalidation, current subject hash == subjectHash, signedAtUtc ≥ task.createdAt, no binding to another task — else 409 ESIGN_SIGNATURE_MISMATCH."
    - "Check order: idempotent replay → task state → assignment → actor → SoD → signature → transition. Existing codes and statuses unchanged."
    - "Response unchanged; history gains a trailing signatureId per transition; the workflow approval work item gains signatureRequired / signatureMeaning."
    - "How a client signs for a task: POST /api/v1/esign/signatures with subject = the instance object (or the workflow-task fallback) and context = { workflowInstanceId, workflowTaskId, stepCode, decision: approve }, then approve with signatureId."

