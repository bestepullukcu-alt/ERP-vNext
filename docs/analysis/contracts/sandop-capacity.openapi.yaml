              correlationId: aaaaaaaa-0000-4000-8000-000000000008
            contractVersion: v1
    CapacityPlanStateConflict:
      description: Capacity plan state does not allow a new scenario
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
