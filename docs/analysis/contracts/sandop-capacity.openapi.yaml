  responses:
    UnknownSandopPlan:
      description: S&OP plan not found in the resolved tenant/legal-entity scope
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNKNOWN_SANDOP_PLAN
              message: S&OP plan not found
              correlationId: aaaaaaaa-0000-4000-8000-000000000001
            contractVersion: v1
    PlanConflict:
      description: An S&OP plan already exists for the requested horizon and demand version
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: SANDOP_PLAN_ALREADY_EXISTS
              message: S&OP plan already exists for this horizon and demand version
              correlationId: aaaaaaaa-0000-4000-8000-000000000002
            contractVersion: v1
    PlanStateConflict:
      description: S&OP plan state does not allow a new snapshot
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: SANDOP_PLAN_STATE_CONFLICT
              message: S&OP plan state does not allow a new snapshot
              correlationId: aaaaaaaa-0000-4000-8000-000000000003
            contractVersion: v1
    InvalidDemandReference:
      description: Referenced DEMAND plan or version is unknown or not published
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_DEMAND_REFERENCE
              message: Referenced DEMAND plan version is unknown or not published
              correlationId: aaaaaaaa-0000-4000-8000-000000000004
            contractVersion: v1
    InvalidSnapshotReference:
      description: Snapshot is unknown or does not belong to the S&OP plan
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_SNAPSHOT_REFERENCE
              message: Snapshot does not belong to the S&OP plan
              correlationId: aaaaaaaa-0000-4000-8000-000000000005
            contractVersion: v1
    SignOffConflict:
      description: Role has already recorded a decision for this snapshot
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: SIGN_OFF_ALREADY_RECORDED
              message: This role already recorded a decision for the snapshot
              correlationId: aaaaaaaa-0000-4000-8000-000000000006
            contractVersion: v1
    UnknownCapacityPlan:
      description: Capacity plan not found in the resolved tenant/legal-entity scope
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNKNOWN_CAPACITY_PLAN
              message: Capacity plan not found
              correlationId: aaaaaaaa-0000-4000-8000-000000000007
            contractVersion: v1
    CapacityPlanConflict:
      description: A capacity plan already exists for the requested horizon and demand version
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
