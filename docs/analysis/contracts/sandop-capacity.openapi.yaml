openapi: 3.1.0
info:
  title: SANDOP-CAPACITY
  description: >
    MOD-0190 S&OP Workflow & Sign-offs and MOD-0192 Capacity Planning owned
    contract — frozen v1. DEMAND (MOD-0188) is consumed as a frozen contract;
    this contract stores only demand-plan references and immutable input-snapshot
    provenance, never a second demand source of record. Tenant and LegalEntity
    scope are resolved from authenticated server context and are never accepted
    in request bodies.
  version: 1.0.0
  x-status: FROZEN
  x-contract-version: v1
  x-owner: [MOD-0190, MOD-0192]
  x-consumes: [DEMAND]
servers:
  - url: /api/supply-chain
security:
  - bearerAuth: []
tags:
  - name: S&OP Plans
  - name: S&OP Snapshots
  - name: S&OP Sign-offs
  - name: Capacity Plans
  - name: Capacity Scenarios
  - name: Capacity Evaluations
paths:
  /sandop-plans:
    post:
      tags: [S&OP Plans]
      operationId: createSandopPlan
      summary: Create an S&OP plan referencing a frozen DEMAND plan version
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandopPlanRequest'
            example:
              name: FY2027 Integrated Plan
              horizonStart: '2027-01-01'
              horizonEnd: '2027-12-31'
              demandPlanId: dp-2027
              demandPlanVersion: '3'
      responses:
        '201':
          description: S&OP plan created
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandopPlan'
              example:
                sandopPlanId: 01900000-0000-4000-8000-000000000001
                name: FY2027 Integrated Plan
                horizonStart: '2027-01-01'
                horizonEnd: '2027-12-31'
                demandPlanId: dp-2027
                demandPlanVersion: '3'
                status: Draft
                currentSnapshotId: null
                createdAt: '2026-09-15T10:00:00Z'
                contractVersion: v1
        '409':
          $ref: '#/components/responses/PlanConflict'
        '422':
          $ref: '#/components/responses/InvalidDemandReference'
  /sandop-plans/{sandopPlanId}:
    get:
      tags: [S&OP Plans]
      operationId: getSandopPlan
      summary: Get an S&OP plan in the authenticated tenant and legal entity scope
      parameters:
        - $ref: '#/components/parameters/SandopPlanId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: S&OP plan
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandopPlan'
              example:
                sandopPlanId: 01900000-0000-4000-8000-000000000001
                name: FY2027 Integrated Plan
                horizonStart: '2027-01-01'
                horizonEnd: '2027-12-31'
                demandPlanId: dp-2027
                demandPlanVersion: '3'
                status: InReview
                currentSnapshotId: 01900000-0000-4000-8000-000000000010
                createdAt: '2026-09-15T10:00:00Z'
                contractVersion: v1
        '404':
          $ref: '#/components/responses/UnknownSandopPlan'
  /sandop-plans/{sandopPlanId}/snapshots:
    post:
      tags: [S&OP Snapshots]
      operationId: captureSandopSnapshot
      summary: Capture immutable provenance for the S&OP review input set
      description: >
        Captures references and provenance only. Demand quantities, forecast
        series, and other DEMAND-owned data are not copied into this service.
      parameters:
        - $ref: '#/components/parameters/SandopPlanId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureSandopSnapshotRequest'
            example:
              demandPlanId: dp-2027
              demandPlanVersion: '3'
              sourceCapturedAt: '2026-09-15T09:45:00Z'
              sourceChecksum: sha256:ee56d4f9a3c8
              supplyInputRefs:
                - source: INVENTORY
                  resourceId: availability-snapshot-20260915
                  resourceVersion: '12'
      responses:
        '201':
          description: Immutable S&OP input snapshot captured
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandopSnapshot'
              example:
                snapshotId: 01900000-0000-4000-8000-000000000010
                sandopPlanId: 01900000-0000-4000-8000-000000000001
                provenance:
                  demandPlanId: dp-2027
                  demandPlanVersion: '3'
                  sourceContract: DEMAND
                  sourceContractVersion: v1
                  sourceCapturedAt: '2026-09-15T09:45:00Z'
                  sourceChecksum: sha256:ee56d4f9a3c8
                supplyInputRefs:
                  - source: INVENTORY
                    resourceId: availability-snapshot-20260915
                    resourceVersion: '12'
                capturedAt: '2026-09-15T10:10:00Z'
                contractVersion: v1
        '404':
          $ref: '#/components/responses/UnknownSandopPlan'
        '409':
          $ref: '#/components/responses/PlanStateConflict'
        '422':
          $ref: '#/components/responses/InvalidDemandReference'
    get:
      tags: [S&OP Snapshots]
      operationId: listSandopSnapshots
      summary: List immutable S&OP input snapshots
      parameters:
        - $ref: '#/components/parameters/SandopPlanId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: S&OP snapshots
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [items, contractVersion]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SandopSnapshot'
                  contractVersion:
                    $ref: '#/components/schemas/ContractVersion'
              example:
                items:
                  - snapshotId: 01900000-0000-4000-8000-000000000010
                    sandopPlanId: 01900000-0000-4000-8000-000000000001
                    provenance:
                      demandPlanId: dp-2027
                      demandPlanVersion: '3'
                      sourceContract: DEMAND
                      sourceContractVersion: v1
                      sourceCapturedAt: '2026-09-15T09:45:00Z'
                      sourceChecksum: sha256:ee56d4f9a3c8
                    supplyInputRefs: []
                    capturedAt: '2026-09-15T10:10:00Z'
                    contractVersion: v1
                contractVersion: v1
        '404':
          $ref: '#/components/responses/UnknownSandopPlan'
  /sandop-plans/{sandopPlanId}/sign-offs:
    post:
      tags: [S&OP Sign-offs]
      operationId: recordSandopSignOff
      summary: Record an approval or rejection against an immutable S&OP snapshot
      parameters:
        - $ref: '#/components/parameters/SandopPlanId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordSignOffRequest'
            example:
              snapshotId: 01900000-0000-4000-8000-000000000010
              role: SupplyPlanning
              decision: Approved
              comment: Capacity scenario C-3 accepted
      responses:
        '201':
          description: Sign-off recorded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignOff'
              example:
                signOffId: 01900000-0000-4000-8000-000000000020
                sandopPlanId: 01900000-0000-4000-8000-000000000001
                snapshotId: 01900000-0000-4000-8000-000000000010
                role: SupplyPlanning
                decision: Approved
                comment: Capacity scenario C-3 accepted
                decidedBy: 90000000-0000-4000-8000-000000000001
                decidedAt: '2026-09-15T11:00:00Z'
                contractVersion: v1
        '404':
          $ref: '#/components/responses/UnknownSandopPlan'
        '409':
          $ref: '#/components/responses/SignOffConflict'
        '422':
          $ref: '#/components/responses/InvalidSnapshotReference'
    get:
      tags: [S&OP Sign-offs]
      operationId: listSandopSignOffs
      summary: List sign-offs for an S&OP plan
      parameters:
        - $ref: '#/components/parameters/SandopPlanId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: S&OP sign-offs
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [items, contractVersion]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SignOff'
                  contractVersion:
                    $ref: '#/components/schemas/ContractVersion'
              example:
                items:
                  - signOffId: 01900000-0000-4000-8000-000000000020
                    sandopPlanId: 01900000-0000-4000-8000-000000000001
                    snapshotId: 01900000-0000-4000-8000-000000000010
                    role: SupplyPlanning
                    decision: Approved
                    comment: Capacity scenario C-3 accepted
                    decidedBy: 90000000-0000-4000-8000-000000000001
                    decidedAt: '2026-09-15T11:00:00Z'
                    contractVersion: v1
                contractVersion: v1
        '404':
          $ref: '#/components/responses/UnknownSandopPlan'
  /capacity-plans:
    post:
      tags: [Capacity Plans]
      operationId: createCapacityPlan
      summary: Create a capacity plan from a frozen DEMAND plan reference
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCapacityPlanRequest'
            example:
              name: FY2027 Capacity Baseline
              horizonStart: '2027-01-01'
              horizonEnd: '2027-12-31'
              demandPlanId: dp-2027
              demandPlanVersion: '3'
              sourceCapturedAt: '2026-09-15T09:45:00Z'
              sourceChecksum: sha256:ee56d4f9a3c8
      responses:
        '201':
          description: Capacity plan created
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityPlan'
              example:
                capacityPlanId: 01920000-0000-4000-8000-000000000001
                name: FY2027 Capacity Baseline
                horizonStart: '2027-01-01'
                horizonEnd: '2027-12-31'
                provenance:
                  demandPlanId: dp-2027
                  demandPlanVersion: '3'
                  sourceContract: DEMAND
                  sourceContractVersion: v1
                  sourceCapturedAt: '2026-09-15T09:45:00Z'
                  sourceChecksum: sha256:ee56d4f9a3c8
                status: Draft
                createdAt: '2026-09-15T10:20:00Z'
                contractVersion: v1
        '409':
          $ref: '#/components/responses/CapacityPlanConflict'
        '422':
          $ref: '#/components/responses/InvalidDemandReference'
  /capacity-plans/{capacityPlanId}:
    get:
      tags: [Capacity Plans]
      operationId: getCapacityPlan
      summary: Get a capacity plan in the authenticated tenant and legal entity scope
      parameters:
        - $ref: '#/components/parameters/CapacityPlanId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Capacity plan
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityPlan'
              example:
                capacityPlanId: 01920000-0000-4000-8000-000000000001
                name: FY2027 Capacity Baseline
                horizonStart: '2027-01-01'
                horizonEnd: '2027-12-31'
                provenance:
                  demandPlanId: dp-2027
                  demandPlanVersion: '3'
                  sourceContract: DEMAND
                  sourceContractVersion: v1
                  sourceCapturedAt: '2026-09-15T09:45:00Z'
                  sourceChecksum: sha256:ee56d4f9a3c8
                status: Evaluating
                createdAt: '2026-09-15T10:20:00Z'
                contractVersion: v1
        '404':
          $ref: '#/components/responses/UnknownCapacityPlan'
  /capacity-plans/{capacityPlanId}/scenarios:
    post:
      tags: [Capacity Scenarios]
      operationId: createCapacityScenario
      summary: Create a capacity scenario without copying DEMAND-owned facts
      parameters:
        - $ref: '#/components/parameters/CapacityPlanId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCapacityScenarioRequest'
            example:
              name: Add weekend shift
              constraintRefs:
                - constraintId: line-4-hours
                  source: SUPPLY-CONSTRAINTS
                  sourceVersion: '8'
              adjustments:
                - resourceRef: line-4
                  period: 2027-W03
                  availableCapacityDelta: '80.000'
                  uomId: HOUR
      responses:
        '201':
          description: Capacity scenario created
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityScenario'
              example:
                scenarioId: 01920000-0000-4000-8000-000000000010
                capacityPlanId: 01920000-0000-4000-8000-000000000001
                name: Add weekend shift
                constraintRefs:
                  - constraintId: line-4-hours
                    source: SUPPLY-CONSTRAINTS
                    sourceVersion: '8'
                adjustments:
                  - resourceRef: line-4
                    period: 2027-W03
                    availableCapacityDelta: '80.000'
                    uomId: HOUR
                status: Draft
                createdAt: '2026-09-15T10:30:00Z'
                contractVersion: v1
        '404':
          $ref: '#/components/responses/UnknownCapacityPlan'
        '409':
          $ref: '#/components/responses/CapacityPlanStateConflict'
  /capacity-plans/{capacityPlanId}/scenarios/{scenarioId}:
    get:
      tags: [Capacity Scenarios]
      operationId: getCapacityScenario
      summary: Get a capacity scenario
      parameters:
        - $ref: '#/components/parameters/CapacityPlanId'
        - $ref: '#/components/parameters/ScenarioId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Capacity scenario
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityScenario'
              example:
                scenarioId: 01920000-0000-4000-8000-000000000010
                capacityPlanId: 01920000-0000-4000-8000-000000000001
                name: Add weekend shift
                constraintRefs: []
                adjustments: []
                status: Draft
                createdAt: '2026-09-15T10:30:00Z'
                contractVersion: v1
        '404':
          $ref: '#/components/responses/UnknownCapacityScenario'
  /capacity-plans/{capacityPlanId}/scenarios/{scenarioId}/evaluations:
    post:
      tags: [Capacity Evaluations]
      operationId: evaluateCapacityScenario
      summary: Evaluate a capacity scenario against its immutable demand provenance
      parameters:
        - $ref: '#/components/parameters/CapacityPlanId'
        - $ref: '#/components/parameters/ScenarioId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateCapacityScenarioRequest'
            example:
              evaluationMode: Finite
              resourceRefs: [line-4, labor-cell-a]
      responses:
        '202':
          description: Capacity evaluation accepted
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityEvaluation'
              example:
                evaluationId: 01920000-0000-4000-8000-000000000020
                capacityPlanId: 01920000-0000-4000-8000-000000000001
                scenarioId: 01920000-0000-4000-8000-000000000010
                evaluationMode: Finite
                status: Accepted
                bottlenecks: []
                submittedAt: '2026-09-15T10:40:00Z'
                completedAt: null
                contractVersion: v1
        '404':
          $ref: '#/components/responses/UnknownCapacityScenario'
        '409':
          $ref: '#/components/responses/EvaluationConflict'
  /capacity-plans/{capacityPlanId}/evaluations/{evaluationId}:
    get:
      tags: [Capacity Evaluations]
      operationId: getCapacityEvaluation
      summary: Get a capacity evaluation and bottleneck result
      parameters:
        - $ref: '#/components/parameters/CapacityPlanId'
        - $ref: '#/components/parameters/EvaluationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Capacity evaluation
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityEvaluation'
              example:
                evaluationId: 01920000-0000-4000-8000-000000000020
                capacityPlanId: 01920000-0000-4000-8000-000000000001
                scenarioId: 01920000-0000-4000-8000-000000000010
                evaluationMode: Finite
                status: Completed
                bottlenecks:
                  - resourceRef: line-4
                    period: 2027-W03
                    requiredCapacity: '520.000'
                    availableCapacity: '480.000'
                    shortfall: '40.000'
                    uomId: HOUR
                submittedAt: '2026-09-15T10:40:00Z'
                completedAt: '2026-09-15T10:42:00Z'
                contractVersion: v1
        '404':
          $ref: '#/components/responses/UnknownCapacityEvaluation'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    SandopPlanId:
      name: sandopPlanId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CapacityPlanId:
      name: capacityPlanId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvaluationId:
      name: evaluationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    CorrelationId:
      description: Correlation identifier echoed from the request
      schema:
        type: string
        format: uuid
  schemas:
    ContractVersion:
      type: string
      const: v1
    Decimal:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
    CreateSandopPlanRequest:
      type: object
      additionalProperties: false
      required: [name, horizonStart, horizonEnd, demandPlanId, demandPlanVersion]
      properties:
        name:
          type: string
          minLength: 1
        horizonStart:
          type: string
          format: date
        horizonEnd:
          type: string
          format: date
        demandPlanId:
          type: string
          description: Reference to DEMAND planId; DEMAND remains the source of record
        demandPlanVersion:
          type: string
          minLength: 1
    SandopPlan:
      type: object
      required:
        - sandopPlanId
        - name
        - horizonStart
        - horizonEnd
        - demandPlanId
        - demandPlanVersion
        - status
        - createdAt
        - contractVersion
      properties:
        sandopPlanId:
          type: string
          format: uuid
        name:
          type: string
        horizonStart:
          type: string
          format: date
        horizonEnd:
          type: string
          format: date
        demandPlanId:
          type: string
        demandPlanVersion:
          type: string
        status:
          type: string
          enum: [Draft, InReview, Approved, Rejected, Archived]
        currentSnapshotId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
        contractVersion:
          $ref: '#/components/schemas/ContractVersion'
    CaptureSandopSnapshotRequest:
      type: object
      additionalProperties: false
      required:
        - demandPlanId
        - demandPlanVersion
        - sourceCapturedAt
        - sourceChecksum
      properties:
        demandPlanId:
          type: string
        demandPlanVersion:
          type: string
        sourceCapturedAt:
          type: string
          format: date-time
        sourceChecksum:
          type: string
        supplyInputRefs:
          type: array
          items:
            $ref: '#/components/schemas/ExternalInputReference'
          default: []
    InputSnapshotProvenance:
      type: object
      required:
        - demandPlanId
        - demandPlanVersion
        - sourceContract
        - sourceContractVersion
        - sourceCapturedAt
        - sourceChecksum
      properties:
        demandPlanId:
          type: string
        demandPlanVersion:
          type: string
        sourceContract:
          type: string
          const: DEMAND
        sourceContractVersion:
          type: string
          const: v1
        sourceCapturedAt:
          type: string
          format: date-time
        sourceChecksum:
          type: string
    ExternalInputReference:
      type: object
      additionalProperties: false
      required: [source, resourceId, resourceVersion]
      properties:
        source:
          type: string
        resourceId:
          type: string
        resourceVersion:
          type: string
    SandopSnapshot:
      type: object
      required:
        - snapshotId
        - sandopPlanId
        - provenance
        - supplyInputRefs
        - capturedAt
        - contractVersion
      properties:
        snapshotId:
          type: string
          format: uuid
        sandopPlanId:
          type: string
          format: uuid
        provenance:
          $ref: '#/components/schemas/InputSnapshotProvenance'
        supplyInputRefs:
          type: array
          items:
            $ref: '#/components/schemas/ExternalInputReference'
        capturedAt:
          type: string
          format: date-time
        contractVersion:
          $ref: '#/components/schemas/ContractVersion'
    RecordSignOffRequest:
      type: object
      additionalProperties: false
      required: [snapshotId, role, decision]
      properties:
        snapshotId:
          type: string
          format: uuid
        role:
          type: string
          enum: [DemandPlanning, SupplyPlanning, Finance, Operations, Executive]
        decision:
          type: string
          enum: [Approved, Rejected]
        comment:
          type: string
          maxLength: 2000
    SignOff:
      type: object
      required:
        - signOffId
        - sandopPlanId
        - snapshotId
        - role
        - decision
        - decidedBy
        - decidedAt
        - contractVersion
      properties:
        signOffId:
          type: string
          format: uuid
        sandopPlanId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
        role:
          type: string
        decision:
          type: string
          enum: [Approved, Rejected]
        comment:
          type: string
        decidedBy:
          type: string
          format: uuid
          description: Resolved from authenticated actor context
        decidedAt:
          type: string
          format: date-time
        contractVersion:
          $ref: '#/components/schemas/ContractVersion'
    CreateCapacityPlanRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - horizonStart
        - horizonEnd
        - demandPlanId
        - demandPlanVersion
        - sourceCapturedAt
        - sourceChecksum
      properties:
        name:
          type: string
          minLength: 1
        horizonStart:
          type: string
          format: date
        horizonEnd:
          type: string
          format: date
        demandPlanId:
          type: string
        demandPlanVersion:
          type: string
        sourceCapturedAt:
          type: string
          format: date-time
        sourceChecksum:
          type: string
    CapacityPlan:
      type: object
      required:
        - capacityPlanId
        - name
        - horizonStart
        - horizonEnd
        - provenance
        - status
        - createdAt
        - contractVersion
      properties:
        capacityPlanId:
          type: string
          format: uuid
        name:
          type: string
        horizonStart:
          type: string
          format: date
        horizonEnd:
          type: string
          format: date
        provenance:
          $ref: '#/components/schemas/InputSnapshotProvenance'
        status:
          type: string
          enum: [Draft, Evaluating, Ready, Approved, Archived]
        createdAt:
          type: string
          format: date-time
        contractVersion:
          $ref: '#/components/schemas/ContractVersion'
    ConstraintReference:
