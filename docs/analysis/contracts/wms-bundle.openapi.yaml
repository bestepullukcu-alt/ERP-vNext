openapi: 3.1.0
info:
  title: WMS-BUNDLE
  description: >-
    MOD-0178 Putaway / Picking / Packing (MVP-5) — the warehouse task contract of Diten.InventoryService. Frozen by the Control
    Tower single-writer step (pack §19.7, AC-60) from the CT-accepted proposal docs/analysis/contracts/drafts/wms-bundle-v1-proposal.md
    (wire shape) and the module pack execution/domains/supply-chain-execution/module-packs/MOD-0178-putaway-picking-packing.md
    (behaviour authority). 1.0.0 = S1 (warehouse task schema: putaway tasks, putaway candidates, location roles) + the frozen
    WAREHOUSE-OUTBOUND 1.0.0 surface, copied unchanged (superset rule, decision Q-06: separate file; warehouse-outbound.openapi.yaml
    stays the MVP-6 subset and is not changed). After the freeze only additive changes (K16).

    RULES (proposal §1).
    (1) Server /api/warehouse (Gateway -> Diten.InventoryService 5067); tenant shell users (actor_type = tenant_user).
    (2) TenantId from the token; the company per W-0173-02 (claim, else X-Legal-Entity-Id + MDM check). 403 CROSS_LE_FORBIDDEN only
    for a header / token / membership mismatch; another company's or tenant's record by id, or an unknown id -> 404. Every read and
    write is tenant + company scoped. tenantId / legalEntityId in a body or query -> 400.
    (3) Envelope: the success body is the schema itself (unwrapped); an error is WmsError = { error { code, message, details?,
    correlationId }, contractVersion: "v1" } (the INVENTORY Error). The WAREHOUSE-OUTBOUND Error (no details) is its subset; the
    outbound endpoints send no details. 401 / 403 from the service-wide auth middleware answer AuthError (code may be absent).
    (4) An empty optional member is NOT written — no JSON null anywhere (OAS 3.1: nullable does not admit null; the MVP-6 reader
    refuses null, FrozenReadSchema.cs:8, GAP-0183-03). No schema of the WMS part allows null. A list never writes nextCursor at its end.
    (5) Every write takes an Idempotency-Key header equal to the body's idempotencyKey (8-100). Same key + same body -> 200 replay
    (the record's current state; a confirmation also carries the request's own confirmationSeq), no write; another body -> 400
    IDEMPOTENCY_KEY_REUSED. The key is kept per requesting user + operation (operationId) + target record and is looked up BEFORE
    If-Match and every business rule. Fingerprint = operation + target + normalised body (headers excluded). Of two concurrent
    identical requests the loser gets the 200 replay, not 409. A bulk replay answers the written rows with their result, the unwritten
    as Conflict (NotFound). A request refused before any write leaves no key. The client makes a new key per user action.
    (6) Mutable records (task, location role) need If-Match W/"<version>" on change: missing -> 400 INVALID_REQUEST, stale -> 409
    WMS_CONFLICT; answers carry ETag W/"<version>". Staleness is judged after the key check of rule 5.
    (7) This contract holds no stock balance and changes no stock: every physical move is an INVENTORY postMovement LOCATION_TRANSFER
    on the same in-process path (sourceModule MOD-0178). GOODS_ISSUE_SALES is not this module's (W-4, MOD-0183).
    (8) Correlation (E-1): X-Correlation-Id is created at the Gateway, read and forwarded by the service; UUID in event payloads.
    (9) Dates (E-6): date = UTC calendar day, date-time = UTC instant.
    (10) Quantities: decimal strings (^-?\d+(\.\d+)?$, at most 6 fraction digits) in the SKU's base unit (baseUomId); different SKUs
    or units are never added up.
    (11) No new stock status and no new movement type.

    Objects of the WMS part are closed (additionalProperties: false; a composed schema closes with unevaluatedProperties: false) and
    every enum is the proposal's list. The two members TaskConfirmation.error.reason and BulkAssignResult.contractVersion /
    BulkDeleteLocationRolesResult.contractVersion are the DL-2 additions proposed for this freeze (pack §8.3; the v1 marker of every
    other S1 body). E-signature: none (M-1) — no signable action and no signature member.

    1.1.0 (S2 / S3, additive — the S2 slices DL-4 / DL-5 and the S3 slice DL-7 CT-accepted; proposal r20 header, §2.3, §6.2, §9, §11).
    Outbound shipments with their allocation (MOD-0173-FU03 reservations, all or nothing), pick tasks (the putaway machine, kind Pick,
    postingKey wms:pck:{taskId}:{seq}; no edit and no own cancel — the outbound's cancel closes them), packages (weights / dimensions by
    hand, Q-MDM-1), release (Packed -> ReadyToShip + OutboundShipmentReady in the same transaction), the user-triggered dispatch sync
    (MVP-6 Dispatched / InTransit / Delivered / Exception / Closed or a stockIssued Cancelled -> Shipped) and the read-only S3 monitor
    (exception box, activity trace, integration status). The frozen WAREHOUSE-OUTBOUND members gain only the proposal §2.3 optional
    members (its single list; Package.contents and SkuLevel Item are "next contract version" there and are NOT added). Internal outbound
    states Allocating / AllocationFailed are never visible (list: absent, detail / S2 reads: 404 UNKNOWN_OUTBOUND). No S3 answer and no
    pick / packing read carries a ship-to (Q-10a). Rule 3 note: an unexpected 500 of the service-wide exception handler has the AuthError
    shape (code may be absent), like the middleware's 401 / 403.

    CT FREEZE OWNER DECISIONS (Beste 2026-11-10). K-1: the listPackages allocation row carries lotId + lotNumber as the service writes
    them (the proposal's lot member is not used). K-2: WMS_PACKAGE_NOT_FOUND (404 of the package paths) and
    WMS_ASSIGNEE_DIRECTORY_UNAVAILABLE (503 of the assignee check, Q-13 A), written by the service but named by neither the proposal
    nor the pack, are in the 1.1.0 error catalogue.

    NAMED EXCEPTION TO RULE 4 (pack §8.23 wins over the proposal rule): in a ShortDispatchUnresolved exception's details,
    stagingDifference = null and differenceDeferredBy = null are written when they do not apply (stagingDifference null = the Staging
    difference was not computed, differenceDeferredBy names why; differenceDeferredBy null = it was computed). These two members of
    WarehouseExceptionDetails are the ONLY places of this contract's WMS part that admit JSON null. They belong to the S3 read-only UI
    endpoint GET /exceptions, which MVP-6 does not consume (the MVP-6 reader's no-null rule, GAP-0183-03, is unaffected).
  version: 1.1.0
  x-status: FROZEN
  x-owner: MOD-0178
  x-owner-service: Diten.InventoryService
  x-authored-by: control-tower
  x-source-proposal: docs/analysis/contracts/drafts/wms-bundle-v1-proposal.md
  x-superset-of: warehouse-outbound.openapi.yaml 1.0.0
  x-consumes: [INVENTORY-BUNDLE, LOCATION, TRACE-BUNDLE, QUARANTINE-BUNDLE, FEFO-BUNDLE, RECALL-BUNDLE, PRODUCT-MASTER]
  x-changelog:
    - "1.0.0 — CT freeze of S1 (MOD-0178 pack §19.7, AC-60): proposal §1 rules, §2 WAREHOUSE-OUTBOUND 1.0.0 paths and schemas unchanged, §3 S1 schemas, §4 S1 operations, §5 S1 error codes, §6.1 state machine. No S1 event is published (pack §8.9; WarehouseTaskCompleted is internal, not a contract). Additions over the proposal: TaskConfirmation.error.reason, BulkAssignResult.contractVersion, BulkDeleteLocationRolesResult.contractVersion."
    - "1.1.0 — additive (MOD-0178 S2 DL-4 / DL-5 + S3 DL-7, CT single-writer step): proposal §2.3 optional members on OutboundShipment (outboundNumber, legalEntityId), OutboundLine (lotId, fromWarehouseId, fromLocationId, stockStatus, reservationId, fefoBypassReason) and OutboundShipmentReadyEvent (eventId, tenantId, legalEntityId, outboundNumber; correlationId a UUID); the frozen list example's outboundId is a UUID (proposal §2 note); §11 S2 operations (outbound create / preview / search / view / update / cancel / release / sync-dispatch / events, packages, pick tasks), §9 S3 reads (GET /exceptions, /activity, /integration/status) with their schemas; WarehouseTaskKind + Pick; WarehouseTask + outbound / allocSeq / reservationId (pick reads); the task number and postingKey patterns admit the pick kind (PCK / wms:pck); §5 S2 error codes; §6.2 state machine. Named exception to rule 4: WarehouseExceptionDetails.stagingDifference / differenceDeferredBy may be null (pack §8.23). No existing path, parameter, property, type, required list, status code or enum value of 1.0.0 changed or was removed."
  x-state-machines:
    putawayTask:
      - "— -> Open: createPutawayTask (§4 rules)"
      - "Open -> InProgress: first Posted confirmation, remaining > 0"
      - "Open / InProgress -> Completed: Posted confirmation with remaining = 0"
      - "Open / InProgress -> Completed: closePutawayTaskShort (>= 1 Posted, no Pending, reason)"
      - "Open / InProgress -> Cancelled: cancelPutawayTask (no Posted, no Pending, reason; with a Posted one only closePutawayTaskShort)"
    confirmation:
      - "— -> Pending: confirmPutawayTask transaction 1 (pre-checks passed; in-flight lock taken)"
      - "Pending -> Posted: transaction 2 (2xx) / retry or reconciler (ledger Committed); AttemptId + Confirmed + q <= Planned"
      - "Pending -> Refused: transaction 2 (4xx) / retry pre-check refusal"
      - "Pending -> IntegrityError: IDEMPOTENCY_KEY_REUSED, or Confirmed + q > Planned (defence), or retry / reconciler finds the holder reversed (HolderReversed)"
      - "Refused -> IntegrityError: 0-row (D) — this attempt got Posted / replay while another attempt wrote Refused (StatusDiverged; resolution -> priorResolution); already IntegrityError -> no write, 409"
      - "Refused (refusalSource PreCheck / Ledger4xx, refusedOnRetry, last 30 min) -> IntegrityError: defensive sweep finds ledger Committed (StatusDiverged)"
      - "Refused -> IntegrityError (+ 409 to the command): new confirmation / markPutawayConfirmationReturned / cancelPutawayTask / closePutawayTaskShort pre-lookup finds Committed (StatusDiverged)"
      - "IntegrityError -> Posted: resolvePutawayIntegrity (a) — the key holder is this confirmation's own movement; ledger values written; deviation event if confirmed > planned"
      - "IntegrityError -> Refused (unresolved): resolvePutawayIntegrity (b) — holder foreign, not committed or reversed; the task stays open"
      - "IntegrityError (task terminal) -> Posted / Refused: resolvePutawayIntegrity — only the confirmation record is corrected; the task is not reopened"
      - "Refused -> Refused + resolution: new Posted confirmation (SupersededByNewConfirmation) / markPutawayConfirmationReturned (ReturnedToSource)"
    outbound:
      - "— -> Allocating (internal): createOutboundShipment transaction A (pre-checks and the allocation plan passed; the plan is stored)"
      - "Allocating -> Allocated: FU03 batch reservation succeeded -> transaction B (request or maintenance service, same keys); version"
      - "Allocating -> AllocationFailed (internal, terminal): FU03 batch refusal (AllocationFailure.kind BatchRefused) or FU03 400 (KeyReused — allocations Pending, the maintenance releases them by key)"
      - "Allocated -> Picked: the last pick task's terminal write; picked > 0 (all 0 -> stays Allocated, only cancel)"
      - "Picked -> Packed: the last closePackage; the whole picked quantity in closed packages"
      - "Packed -> ReadyToShip: releaseOutboundShipment; OutboundShipmentReady into the outbox in the same transaction"
      - "ReadyToShip -> Shipped: syncOutboundDispatch — exactly one source-verified MVP-6 shipment (sourceModule MOD-0178, sourceType WAREHOUSE_OUTBOUND) Dispatched / InTransit / Delivered / Exception / Closed or a stockIssued Cancelled; remaining reservations released; a ShortDispatch putaway task for picked stock not issued, a shortDispatchUnresolved[] row for a SKU that cannot be resolved"
      - "Allocated / Picked / Packed -> Cancelled: cancelOutboundShipment — no Pending pick confirmation, reason; reservations released, a Cancellation putaway task for the stock at Staging"
    pickTask:
      - "The putaway machine (kind Pick, postingKey wms:pck:{taskId}:{seq}); source and target fixed (target = the outbound's Staging node; the confirmation body takes no target), the movement carries reservationId, no edit, no own cancel (the outbound's cancel closes it)"
servers: [{ url: /api/warehouse }]
security: [{ bearerAuth: [] }]
paths:
  # ── §2 WAREHOUSE-OUTBOUND 1.0.0 — copied unchanged (superset rule; equality measured by a contract test) ──
  /outbound-shipments:
    get:
      operationId: listOutboundShipments
      summary: Sevke hazır (veya duruma göre) outbound shipment listesi — event'e alternatif polling
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/OutboundStatus' } }
        - { name: warehouseId, in: query, required: false, schema: { type: string } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Outbound shipment sayfası
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OutboundShipment' } }
                  nextCursor: { type: string, nullable: true }
                  contractVersion: { type: string }
              example:
                items:
                  - outboundId: 9b2f6c1e-5a4d-4e8b-9c3a-7d1e2f3a4b5c
                    outboundNumber: GMG-OUT-000001
                    warehouseId: wh-01
                    orderRef: SO-7788
                    status: ReadyToShip
                    shipTo: { name: "Acme Pharma Depo", country: tr, city: Istanbul, postalCode: "34000", line1: "Org. San. Böl. 5" }
                    lines:
                      - { orderLineId: "1", itemId: b1f2c3d4-0000-0000-0000-000000000001, skuId: c3d4e5f6-0000-0000-0000-000000000002, skuLevel: Lsku, lotNumber: "L2026-0455", quantity: "100.000", uomId: BOX }
                    packages:
                      - { packageId: PKG-1, weightKg: "12.500", dimensionsCm: "40x30x20" }
                    readyAt: "2026-09-15T08:00:00Z"
                nextCursor: null
                contractVersion: v1
    post:
      operationId: createOutboundShipment
      summary: >-
        1.1.0 (S2, pack §8.17) — open an outbound together with its allocation (1-100 lines; the plan is stored in transaction A, an
        unreasoned FEFO deviation is 422 FEFO_BYPASS_REASON_REQUIRED). item.skuId is optional only at skuLevel Item (= itemId, §8.24).
        503 INVENTORY_UNAVAILABLE = allocation outcome unknown (record Allocating, the maintenance completes it).
      x-permission: warehouse.outbound-shipments.create
      x-error-codes: [WMS_ALLOCATION_FAILED, WMS_ALLOCATION_TOO_MANY_LINES, WMS_OUTBOUND_ALLOCATION_IN_PROGRESS, WMS_STAGING_NOT_CONFIGURED, WMS_TARGET_NOT_ALLOWED, WMS_UOM_NOT_BASE, WMS_LOT_NOT_ALLOCATABLE, FEFO_ORDER_VIOLATION, FEFO_BYPASS_REASON_REQUIRED, WMS_ITEM_NOT_RESOLVABLE, WMS_OUTBOUND_LEVEL_MIXED, PRODUCT_MASTER_UNAVAILABLE, WMS_SERIAL_PARTIAL_NOT_SUPPORTED, WMS_COMPANY_CODE_INVALID, WMS_RECORD_CODE_UNAVAILABLE, INVENTORY_UNAVAILABLE, LOT_UNDER_RECALL, LOT_EXPIRED, LOT_BLOCKED, LOT_RETEST_DUE, UNKNOWN_LOCATION, INVALID_REQUEST, IDEMPOTENCY_KEY_REUSED, CROSS_LE_FORBIDDEN]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOutboundShipmentRequest' } } }
      responses:
        '201': { $ref: '#/components/responses/OutboundView' }
        '200': { $ref: '#/components/responses/OutboundView' }
        '400': { $ref: '#/components/responses/WmsError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/WmsError' }
        '409': { $ref: '#/components/responses/WmsError' }
        '422': { $ref: '#/components/responses/WmsError' }
        '503': { $ref: '#/components/responses/WmsError' }
  /outbound-shipments/{outboundId}:
    get:
      operationId: getOutboundShipment
      summary: Tek outbound shipment detayı (0183 Shipment bunu okuyup Shipment yaratır)
      parameters:
        - { name: outboundId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Outbound shipment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboundShipment' }
        '404': { $ref: '#/components/responses/UnknownOutbound' }
    put:
      operationId: updateOutboundShipment
      summary: 1.1.0 (S2) — the header only (orderRef, shipTo, note); the allocation never changes. ReadyToShip and after -> 409 WMS_OUTBOUND_IMMUTABLE.
      x-permission: warehouse.outbound-shipments.update
      x-error-codes: [WMS_OUTBOUND_IMMUTABLE, WMS_CONFLICT, INVALID_REQUEST, IDEMPOTENCY_KEY_REUSED, UNKNOWN_OUTBOUND]
      parameters: [{ $ref: '#/components/parameters/OutboundId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOutboundShipmentRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/OutboundView' }
        '400': { $ref: '#/components/responses/WmsError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/WmsError' }
        '409': { $ref: '#/components/responses/WmsError' }

  # ── §11 S2 operations (1.1.0) — outbound shipments, packages, pick tasks. The literal segments (search, allocation-preview) match before the
  #    frozen {outboundId}; the frozen {outboundId} is a string (a non-UUID gets the frozen 404), the S2 paths' own ids are UUIDs (r23) ──
  /outbound-shipments/allocation-preview:
    post:
      operationId: previewOutboundAllocation
      summary: The create body without a key; nothing is written — the proposed lots per line in FEFO order, fefoRank, allocatable quantity
      x-permission: warehouse.outbound-shipments.create
      x-error-codes: [WMS_ALLOCATION_TOO_MANY_LINES, WMS_STAGING_NOT_CONFIGURED, WMS_TARGET_NOT_ALLOWED, WMS_UOM_NOT_BASE, WMS_LOT_NOT_ALLOCATABLE, WMS_ITEM_NOT_RESOLVABLE, WMS_OUTBOUND_LEVEL_MIXED, PRODUCT_MASTER_UNAVAILABLE, WMS_SERIAL_PARTIAL_NOT_SUPPORTED, INVENTORY_UNAVAILABLE, UNKNOWN_LOCATION, INVALID_REQUEST, CROSS_LE_FORBIDDEN]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PreviewOutboundAllocationRequest' } } }
      responses:
        '200':
          description: The allocation preview
          content: { application/json: { schema: { $ref: '#/components/schemas/OutboundAllocationPreview' } } }
        '400': { $ref: '#/components/responses/WmsError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/WmsError' }
        '422': { $ref: '#/components/responses/WmsError' }
        '503': { $ref: '#/components/responses/WmsError' }
  /outbound-shipments/search:
    get:
      operationId: searchOutboundShipments
      summary: The screen list (not the frozen list). Personal data (ship-to name) — the permission is not given to Viewer by default (pack §14.2 Q-10a).
      x-permission: warehouse.outbound-shipments.read
      x-error-codes: [INVALID_REQUEST]
      parameters:
        - { name: status, in: query, required: false, schema: { type: array, items: { $ref: '#/components/schemas/OutboundStatus' } }, style: form, explode: true }
        - { name: warehouseId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: q, in: query, required: false, description: outbound number or order reference, schema: { type: string } }
        - { name: orderBy, in: query, required: false, schema: { type: string, enum: [createdAt, -createdAt] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Outbound summary page
          content: { application/json: { schema: { $ref: '#/components/schemas/OutboundShipmentPage' } } }
        '400': { $ref: '#/components/responses/WmsError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
  /outbound-shipments/{outboundId}/view:
    get:
      operationId: getOutboundShipmentView
      summary: The outbound with its allocations, pick tasks, packages and reservation release state (+ ETag); the only read that carries the MVP-6 shipment link
      x-permission: warehouse.outbound-shipments.read
      x-error-codes: [UNKNOWN_OUTBOUND]
      parameters: [{ $ref: '#/components/parameters/OutboundId' }]
      responses:
        '200': { $ref: '#/components/responses/OutboundView' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/WmsError' }
  /outbound-shipments/{outboundId}/cancel:
    post:
      operationId: cancelOutboundShipment
      summary: Allocated / Picked / Packed -> Cancelled (no Pending pick confirmation; reservations released per allocation; a Cancellation putaway task for the stock at Staging)
      x-permission: warehouse.outbound-shipments.cancel
      x-error-codes: [WMS_OUTBOUND_CANCEL_NOT_ALLOWED, WMS_CONFIRMATION_PENDING, WMS_POSTING_INTEGRITY_ERROR, WMS_INVALID_TRANSITION, WMS_CONFLICT, REASON_REQUIRED, IDEMPOTENCY_KEY_REUSED]
      parameters: [{ $ref: '#/components/parameters/OutboundId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/OutboundView' }
        '400': { $ref: '#/components/responses/WmsError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/WmsError' }
        '409': { $ref: '#/components/responses/WmsError' }
        '503': { $ref: '#/components/responses/WmsError' }
  /outbound-shipments/{outboundId}/release:
    post:
      operationId: releaseOutboundShipment
      summary: >-
        Packed -> ReadyToShip, readyAt, outbox. Pre-check (r21): recall / lot status; FEFO in every mode (r22: Block -> 422, RequireReason ->
        a reason or 422, Warn -> passes), no write; the reasons are written to the allocations in the same transaction before publishing.
        An allocation picked with 0 and a cancelled package are not published. An Item-level outbound -> 409 WMS_ITEM_LEVEL_NOT_PUBLISHABLE.
      x-permission: warehouse.outbound-shipments.release
      x-error-codes: [WMS_INVALID_TRANSITION, WMS_ITEM_LEVEL_NOT_PUBLISHABLE, LOT_UNDER_RECALL, LOT_BLOCKED, LOT_EXPIRED, LOT_RETEST_DUE, FEFO_ORDER_VIOLATION, FEFO_BYPASS_REASON_REQUIRED, INVALID_REQUEST, INVENTORY_UNAVAILABLE, WMS_CONFLICT, IDEMPOTENCY_KEY_REUSED]
      parameters: [{ $ref: '#/components/parameters/OutboundId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseOutboundShipmentRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/OutboundView' }
        '400': { $ref: '#/components/responses/WmsError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/WmsError' }
        '409': { $ref: '#/components/responses/WmsError' }
        '422': { $ref: '#/components/responses/WmsError' }
        '503': { $ref: '#/components/responses/WmsError' }
  /outbound-shipments/{outboundId}/sync-dispatch:
    post:
      operationId: syncOutboundDispatch
      summary: >-
        The user-triggered dispatch sync (pack §8.21): MVP-6 queryShipments (sourceDocumentId = outboundId) with the caller's token through
        the Gateway (+ the caller's supplychain.shipments.read); every candidate is verified with getShipment (sourceModule MOD-0178,
        sourceType WAREHOUSE_OUTBOUND). No change -> no write.
      x-permission: warehouse.outbound-shipments.update
      x-error-codes: [WMS_DISPATCH_AMBIGUOUS, WMS_DISPATCH_READ_FORBIDDEN, WMS_DISPATCH_SOURCE_UNAVAILABLE, WMS_INVALID_TRANSITION, WMS_CONFLICT, IDEMPOTENCY_KEY_REUSED]
      parameters: [{ $ref: '#/components/parameters/OutboundId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/KeyRequest' } } }
      responses:
        '200':
          description: "{ dispatchSeen, shipmentStatus?, outbound }"
          content: { application/json: { schema: { $ref: '#/components/schemas/SyncDispatchResult' } } }
        '400': { $ref: '#/components/responses/WmsError' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/WmsError' }
        '409': { $ref: '#/components/responses/WmsError' }
        '503': { $ref: '#/components/responses/WmsError' }
  /outbound-shipments/{outboundId}/events:
    get:
      operationId: listOutboundEvents
      x-permission: warehouse.outbound-shipments.read
      x-error-codes: [UNKNOWN_OUTBOUND]
