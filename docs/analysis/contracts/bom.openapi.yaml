openapi: 3.1.0
info:
  title: BOM
  description: >
    MOD-0193 BOM & Routings — Wave-0 frozen (v1). Manufacturing malzeme/rota yapısı.
    Ürün kimliği = PRODUCT-MASTER (item SoR). MVP-4 MRP tüketir. Tenant+LegalEntity scoped.
  version: 1.1.0 # 1.0.0 → 1.1.0 (2026-10-06, MOD-0193 MVP-3): management surface added (list / draft / update / release / delete / history) + optional BomView fields; the three v1.0.0 operations and their shapes are unchanged
  x-status: FROZEN
  x-owner: MOD-0193
  x-consumes: [PRODUCT-MASTER, ChangeControl]
servers: [{ url: /api/bom }]
security: [{ bearerAuth: [] }]
paths:
  /{itemId}/current:
    get:
      operationId: getCurrentBom
      summary: Ürünün effective (yürürlükteki) BOM versiyonu
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asOfDate, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Effective BOM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BomView' }
              example:
                bomVersionId: bom-v3
                itemId: b1f2c3d4-0000-0000-0000-000000000001
                version: 3
                status: Effective
                effectiveFrom: "2026-06-01T00:00:00Z"
                components:
                  - { componentItemId: comp-1, quantity: "2.000", uomId: EA, position: 10 }
                  - { componentItemId: comp-2, quantity: "0.500", uomId: L, position: 20 }
                routing: { routingId: rt-1, steps: [ { stepNo: 10, operation: "Karıştırma", workCenter: WC-01 } ] }
                contractVersion: v1
        '404': { $ref: '#/components/responses/UnknownBom' }
  /version/{bomVersionId}:
    get:
      operationId: getBomVersion
      parameters: [{ name: bomVersionId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: BOM version, content: { application/json: { schema: { $ref: '#/components/schemas/BomView' } } } }
        '404': { $ref: '#/components/responses/UnknownBom' }
    put:
      operationId: updateBomDraft
      summary: (v1.1.0) Taslağı düzenle — yalnız Draft; rowVersion eşzamanlılık belirteci
      parameters: [{ name: bomVersionId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/BomDraftContent' }, { type: object, required: [rowVersion], properties: { rowVersion: { type: integer } } } ] } } }
      responses:
        '200': { description: Taslak, content: { application/json: { schema: { $ref: '#/components/schemas/BomView' } } } }
        '404': { $ref: '#/components/responses/UnknownBom' }
        '409': { description: 'BOM_NOT_DRAFT | CONCURRENCY_CONFLICT', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      operationId: deleteBomDraft
      summary: (v1.1.0) Taslağı sil (soft) — Effective/Superseded silinemez
      parameters:
        - { name: bomVersionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: rowVersion, in: query, required: true, schema: { type: integer } }
      responses:
        '204': { description: Silindi }
        '404': { $ref: '#/components/responses/UnknownBom' }
        '409': { description: 'BOM_NOT_DRAFT | CONCURRENCY_CONFLICT', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /versions:
    get:
      operationId: listBomVersions
      summary: (v1.1.0) BOM sürüm listesi — platform server-mode liste sözleşmesi (BL-440); Tenant+LE kapsamlı
      parameters:
        - { name: start, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: length, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: search, in: query, description: 'açıklamada (büyük/küçük harf duyarsız) ya da tam itemId', schema: { type: string, maxLength: 100 } }
        - { name: orderBy, in: query, schema: { type: string, enum: [updatedAt, itemId, version, status, description, effectiveFrom] } }
        - { name: orderDir, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: status, in: query, style: form, explode: true, schema: { type: array, items: { type: string, enum: [Draft, Effective, Superseded] } } }
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Liste, content: { application/json: { schema: { $ref: '#/components/schemas/BomListResponse' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
    post:
      operationId: createBomDraft
      summary: (v1.1.0) Yeni taslak — revizyon no item başına sıradaki numara
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BomDraftRequest' } } } }
      responses:
        '201': { description: Taslak, content: { application/json: { schema: { $ref: '#/components/schemas/BomView' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '422': { description: 'UNKNOWN_ITEM | SELF_REFERENCE', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /versions/export:
    get:
      operationId: exportBomVersions
      summary: (v1.1.0) BL-452 — listenin kendi sorgusu, eşleşen her satır (en çok 50 000), görünen sütunlar, istek dilinde başlıklar
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx], default: csv } }
        - { name: columns, in: query, style: form, explode: true, schema: { type: array, items: { type: string, enum: [itemId, version, status, description, componentCount, stepCount, effectiveFrom, effectiveTo, updatedAt] } } }
        - { name: search, in: query, schema: { type: string } }
        - { name: orderBy, in: query, schema: { type: string } }
        - { name: orderDir, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: status, in: query, style: form, explode: true, schema: { type: array, items: { type: string } } }
        - { name: itemId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Dosya, content: { text/csv: {}, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {} } }
        '400': { description: 'EXPORT_FORMAT_INVALID | EXPORT_COLUMNS_INVALID | INVALID_REQUEST', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: EXPORT_TOO_LARGE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /version/{bomVersionId}/release:
    post:
      operationId: releaseBomVersion
      summary: (v1.1.0) Taslağı yürürlüğe al — önceki Effective aynı işlemde Superseded
      parameters: [{ name: bomVersionId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [changeControlRef, rowVersion], properties: { changeControlRef: { type: string, maxLength: 64 }, rowVersion: { type: integer } } } } }
      responses:
        '200': { description: Effective sürüm, content: { application/json: { schema: { $ref: '#/components/schemas/BomView' } } } }
        '404': { $ref: '#/components/responses/UnknownBom' }
        '409': { description: 'BOM_NOT_DRAFT | CONCURRENCY_CONFLICT | BOM_CYCLE', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: CHANGE_CONTROL_REJECTED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /version/{bomVersionId}/history:
    get:
      operationId: getBomHistory
      summary: (v1.1.0) Sürüm geçmişi (AUD-001 yol c izi) — yalnız ekleme
      parameters: [{ name: bomVersionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Geçmiş, content: { application/json: { schema: { $ref: '#/components/schemas/BomHistoryResponse' } } } }
        '404': { $ref: '#/components/responses/UnknownBom' }
  /explode:
    post:
      operationId: explodeBom
      summary: BOM patlat — component ihtiyaçları (MRP için)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [itemId, quantity], properties: { itemId: { type: string, format: uuid }, quantity: { $ref: '#/components/schemas/Decimal' }, asOfDate: { type: string, format: date } } }
            example: { itemId: b1f2c3d4-0000-0000-0000-000000000001, quantity: "100.000" }
      responses:
        '200':
          description: Patlatılmış ihtiyaçlar
          content:
            application/json:
              example:
                itemId: b1f2c3d4-0000-0000-0000-000000000001
                requestedQuantity: "100.000"
                requirements:
                  - { componentItemId: comp-1, requiredQuantity: "200.000", uomId: EA }
                  - { componentItemId: comp-2, requiredQuantity: "50.000", uomId: L }
                bomVersionId: bom-v3
                contractVersion: v1
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  schemas:
    Decimal: { type: string, pattern: '^-?\d+(\.\d+)?$' }
    BomComponent:
      type: object
      properties:
        componentItemId: { type: string, format: uuid }
        quantity: { $ref: '#/components/schemas/Decimal' }
        uomId: { type: string }
        position: { type: integer }
        alternates: { type: array, items: { type: string }, nullable: true }
    RoutingStep:
      type: object
      properties:
        stepNo: { type: integer }
        operation: { type: string }
        workCenter: { type: string, nullable: true }
    BomView:
      type: object
      properties:
        bomVersionId: { type: string }
        itemId: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string, enum: [Draft, Effective, Superseded] }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        effectiveTo: { type: string, format: date-time, nullable: true }
        components: { type: array, items: { $ref: '#/components/schemas/BomComponent' } }
        routing:
          type: object
          nullable: true
          properties:
            routingId: { type: string }
            steps: { type: array, items: { $ref: '#/components/schemas/RoutingStep' } }
        contractVersion: { type: string }
        description: { type: string, nullable: true, description: '(v1.1.0, optional)' }
        changeControlRef: { type: string, nullable: true, description: '(v1.1.0, optional) MOD-0209 referansı; release ile dolar' }
        rowVersion: { type: integer, description: '(v1.1.0, optional) eşzamanlılık belirteci; update/release/delete bunu ister' }
    BomDraftContent:
      type: object
      required: [components]
      properties:
        description: { type: string, maxLength: 200, nullable: true }
        components:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [componentItemId, quantity, uomId, position]
            properties:
              componentItemId: { type: string, format: uuid }
              quantity: { $ref: '#/components/schemas/Decimal' }
              uomId: { type: string, maxLength: 32 }
              position: { type: integer, minimum: 1, maximum: 9999 }
              alternates: { type: array, maxItems: 10, items: { type: string, format: uuid }, nullable: true }
        routing:
          type: object
          nullable: true
          properties:
            steps: { type: array, items: { type: object, required: [stepNo, operation], properties: { stepNo: { type: integer }, operation: { type: string, maxLength: 120 }, workCenter: { type: string, maxLength: 32, nullable: true } } } }
    BomDraftRequest:
      allOf:
        - { $ref: '#/components/schemas/BomDraftContent' }
        - { type: object, required: [itemId], properties: { itemId: { type: string, format: uuid } } }
    BomListResponse:
      type: object
      description: platform server-mode liste sözleşmesi (BL-440) — liste fabrikası `data.items/total/filteredTotal` okur
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  bomVersionId: { type: string }
                  itemId: { type: string, format: uuid }
                  version: { type: integer }
                  status: { type: string, enum: [Draft, Effective, Superseded] }
                  description: { type: string, nullable: true }
                  componentCount: { type: integer }
                  stepCount: { type: integer }
                  effectiveFrom: { type: string, format: date-time, nullable: true }
                  effectiveTo: { type: string, format: date-time, nullable: true }
                  updatedAt: { type: string, format: date-time }
                  rowVersion: { type: integer }
            total: { type: integer, description: kapsamdaki tüm sürümler }
            filteredTotal: { type: integer, description: filtre + aramaya uyanlar }
        contractVersion: { type: string }
    BomHistoryResponse:
      type: object
      properties:
        bomVersionId: { type: string }
        entries:
          type: array
          items:
            type: object
            properties:
              operation: { type: string, enum: [Created, Updated, Released, Superseded, Deleted] }
              fromStatus: { type: string, nullable: true }
              toStatus: { type: string, nullable: true }
              changedFields: { type: array, items: { type: string } }
              changeControlRef: { type: string, nullable: true }
              actorId: { type: string, format: uuid }
              actorDisplayName: { type: string }
              correlationId: { type: string }
              occurredAtUtc: { type: string, format: date-time }
              outcome: { type: string }
        contractVersion: { type: string }
    Error: { type: object, properties: { error: { type: object, properties: { code: { type: string }, message: { type: string }, correlationId: { type: string } } }, contractVersion: { type: string } } }
  responses:
    InvalidRequest:
      description: Doğrulama hatası
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: INVALID_REQUEST, message: "quantity must be a positive decimal string.", correlationId: req-1 }, contractVersion: v1 } } }
    UnknownBom:
      description: BOM bulunamadı
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: UNKNOWN_BOM, message: "bom bulunamadı", correlationId: req-1 }, contractVersion: v1 } } }
