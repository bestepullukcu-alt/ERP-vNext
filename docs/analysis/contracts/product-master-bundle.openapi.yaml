  /skus/{skuId}/product:
    get:
      operationId: resolveSkuProduct
      summary: SKU → GlobalProduct resolve (D-SKU-LINK — kritik)
      description: "v1.1 — level=Item: Global Ürün yoktur; dönen `itemId` kalemin kendisidir (= skuId), `itemKind` Item. level=FinishedGood: Bitmiş Ürün → GSKU (D-2, üst kayıt `FinishedGood.GskuId`) → Ürün Tanımı Sürümü → Global Ürün. Cevap şeması v1.0 örneğinin biçimini yazıya döker; tek yeni alan `itemKind`."
      parameters:
        - { name: skuId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: level, in: query, required: true, schema: { $ref: '#/components/schemas/SkuLevel' } }
      responses:
        '200':
          description: SKU'nun bağlı olduğu ItemId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuProductLink' }
              examples:
                v1.0-mock:
                  summary: "v1.0 taklit örneği (v1.0-mock-only)"
                  value:
                    skuId: c3d4e5f6-0000-0000-0000-000000000002
                    skuLevel: Lsku
                    itemId: b1f2c3d4-0000-0000-0000-000000000001
                    contractVersion: v1
                item-self-link:
                  summary: "v1.1 — level=Item: kendisini döndürür"
                  value:
                    skuId: d4e5f6a7-0000-0000-0000-000000000003
                    skuLevel: Item
                    itemId: d4e5f6a7-0000-0000-0000-000000000003
                    itemKind: Item
                    contractVersion: v1.1
                fg:
                  summary: "v1.1 — level=FinishedGood → GSKU → Global Ürün"
                  value:
                    skuId: f6a7b8c9-0000-0000-0000-000000000005
                    skuLevel: FinishedGood
                    itemId: b1f2c3d4-0000-0000-0000-000000000001
                    itemKind: GlobalProduct
                    contractVersion: v1.1
        '404': { $ref: '#/components/responses/UnknownSku' }
  /skus/{skuId}/uom:
    get:
      operationId: getSkuUom
      summary: SKU/item UoM + conversion
      description: "v1.1 — Kalem için `skuId == itemId`; seviye kimlikten sunucuda çözülür. Yön: 1 `fromUom` = `numerator` / `denominator` `toUom`; çevrim girildiği yönde yayımlanır, tüketici grafı iki yönde kesin kesirle (ters yön payda / pay) yürür. Pay ve payda her zaman sıfırdan büyük ondalık metindir (v1.1 kuralı; işaret ve üs gösterimi yok), MDM yuvarlamaz, tüketici tam ayrıştırır (double yok). Yalnız kaydın kullandığı birimlerin çiftleri döner. Her birim temel birime en çok 4 adımda ulaşır; 'adım' = graftaki kenar sayısı (stok 4 adıma kadar zincirler). Aynı boyuttaki çevrimlerin (KGM ↔ GRM, LTR ↔ MLT) değeri MOD-0048 `item-uom` çarpanından türetilir ve listede açıkça döner; tüketici hesaplamaz. GSKU: kutu ↔ adet. Lsku: üst GSKU'nun çevrimleri (O-3). Bitmiş Ürün: koli ↔ kutu + üst GSKU'nun kutu ↔ adet çevrimi; temel birim ↔ kutu ↔ koli tek çağrıda okunur. `effectiveFrom` / `effectiveTo` v1.1'de null (geçerlilik aralığı yok; etkin kayıtta çevrim eklenir, değiştirilmez)."
      parameters:
        - { name: skuId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: UoM bilgisi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UomInfo' }
              examples:
                v1.0-mock:
                  summary: "v1.0 taklit örneği (v1.0-mock-only)"
                  description: "v1.0 dosyasındaki örnek, değerleri değiştirilmeden. EA, BOX, PALLET taklit değerleridir; gerçek kodlar MOD-0048 `item-uom`'dan gelir."
                  value:
                    baseUomId: EA
                    conversions:
                      - { fromUom: BOX, toUom: EA, numerator: "10", denominator: "1" }
                      - { fromUom: PALLET, toUom: BOX, numerator: "100", denominator: "1" }
                    contractVersion: v1
                item-uom:
                  summary: "v1.1 — kalem, temel birim KGM; GRM aynı boyuttan türetilir"
                  value:
                    baseUomId: KGM
                    conversions:
                      - { fromUom: GRM, toUom: KGM, numerator: "1", denominator: "1000", effectiveFrom: null, effectiveTo: null }
                    contractVersion: v1.1
                fg-uom:
                  summary: "v1.1 — Bitmiş Ürün: koli ↔ kutu + üst GSKU'nun kutu ↔ adet zinciri"
                  value:
                    baseUomId: C62
                    conversions:
                      - { fromUom: XCS, toUom: XBX, numerator: "48", denominator: "1", effectiveFrom: null, effectiveTo: null }
                      - { fromUom: XBX, toUom: C62, numerator: "16", denominator: "1", effectiveFrom: null, effectiveTo: null }
                    contractVersion: v1.1
        '404': { $ref: '#/components/responses/UnknownSku' }
  /items/{itemId}:
    get:
      operationId: getMaterialItem
      summary: "v1.1 — Malzeme kalemi okuma (kısayol; `getProduct` aynı kimlikle aynı cevabı verir)"
      description: "Yalnız `itemKind: Item` kayıtları döner; Global Ürün kimliği 404 `UNKNOWN_ITEM` alır. Bu yol mevcut v1 yollarının yerine geçmez."
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Kalem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductRef' }
              examples:
