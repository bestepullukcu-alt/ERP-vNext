openapi: 3.1.0
info:
  title: PRODUCT-MASTER-BUNDLE
  description: >
    MOD-0290 Product/Item/SKU Master — Wave-0 frozen contract (v1).
    Canonical kimlik (Model A: GlobalProduct→Gsku→Lsku→FinishedGood). Consumer'lar READ-ONLY.
    Model B (Product) bu contract'ta YOK (DEC-INV-17). Tenant+LegalEntity scoped (server-resolved).
    Mock: `prism mock product-master-bundle.openapi.yaml`.
    v1.1 (MOD-0290-FU04, 2026-10-06) — YALNIZ EKLEME: malzeme kalemleri (hammadde, ambalaj malzemesi, yarı mamul,
    sarf) `SkuLevel: Item` ile; kalemde kalem kimliği = SKU kimliği. `itemId` v1.0'da Global Ürün kimliğidir; `Item`
    seviyesinde kalemin kendi kimliğidir (skuLevel hangisi olduğunu söyler). Kalemler grup geneli ana veridir:
    kalem satırlarına tüzel kişi süzmesi uygulanmaz; ürün satırlarının kapsamı aynen kalır.
  version: 1.1.0
  x-status: "FROZEN v1.0 · DRAFT v1.1 — v1.0 parçaları dondurulmuş ve değişmez; v1.1 eklemeleri (Item seviyesi, /items, /stockable-items, yeni durumlar) G3'te stok ekibinin `skuLevel=Item` cevabından sonra dondurulur (MOD-0290-FU04 §0 Karar 2). Tüketiciler v1.1 eklemelerine o zamana kadar bağlanmaz."
  x-frozen-baseline: 1.0.0
  x-owner: MOD-0290
  x-decisions: [DEC-INV-17, 18]
servers:
  - url: /api/product-master
security:
  - bearerAuth: []
paths:
  /products/{itemId}:
    get:
      operationId: getProduct
      summary: Ürün kimliği (ItemId → GlobalProduct)
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ürün
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductRef' }
              example:
                itemId: b1f2c3d4-0000-0000-0000-000000000001
                canonicalCode: GP-000123
                name: Amoksisilin 500mg Kapsül
                lifecycleStatus: Active
                baseUomId: EA
                shelfLifeDays: 730
                minRemainingShelfLifeDays: 180
                storageCondition: "15-25C"
                retestDays: 365
                lotControlled: true
                serialControlled: false
                contractVersion: v1
        '404': { $ref: '#/components/responses/UnknownItem' }
  /skus/{skuId}:
    get:
      operationId: getSku
      summary: SKU (SkuId + SkuLevel → Gsku|Lsku|FinishedGood|Item)
      description: "v1.1 — level=Item: skuId == itemId (kalemin kendi kimliği); canonicalCode IT-…; packUomCode, packQuantity, gtin, marketCode null (kalem ambalaj / pazar seviyesi taşımaz)."
      parameters:
        - { name: skuId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: level, in: query, required: true, schema: { $ref: '#/components/schemas/SkuLevel' } }
      responses:
        '200':
          description: SKU
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuRef' }
              example:
                skuId: c3d4e5f6-0000-0000-0000-000000000002
                skuLevel: Lsku
                canonicalCode: LSKU-TR-000045
                itemId: b1f2c3d4-0000-0000-0000-000000000001
                packUomCode: BOX
                packQuantity: "10"
                gtin: "08690000000017"
                marketCode: TR
                contractVersion: v1
        '404': { $ref: '#/components/responses/UnknownSku' }
  /skus/{skuId}/product:
    get:
      operationId: resolveSkuProduct
      summary: SKU → GlobalProduct resolve (D-SKU-LINK — kritik)
      description: "v1.1 — level=Item: Global Ürün yoktur; dönen itemId kalemin kendi kimliğidir (= skuId)."
      parameters:
        - { name: skuId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: level, in: query, required: true, schema: { $ref: '#/components/schemas/SkuLevel' } }
      responses:
        '200':
          description: SKU'nun bağlı olduğu ItemId
          content:
            application/json:
              example:
                skuId: c3d4e5f6-0000-0000-0000-000000000002
                skuLevel: Lsku
                itemId: b1f2c3d4-0000-0000-0000-000000000001
                contractVersion: v1
        '404': { $ref: '#/components/responses/UnknownSku' }
  /skus/{skuId}/uom:
    get:
      operationId: getSkuUom
      summary: SKU/item UoM + conversion
      parameters:
        - { name: skuId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: UoM bilgisi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UomInfo' }
              example:
                baseUomId: EA
                conversions:
                  - { fromUom: BOX, toUom: EA, numerator: "10", denominator: "1" }
                  - { fromUom: PALLET, toUom: BOX, numerator: "100", denominator: "1" }
                contractVersion: v1
  /items/{itemId}:
    get:
      operationId: getMaterialItem
      summary: "v1.1 — Malzeme kalemi (hammadde / ambalaj / yarı mamul / sarf)"
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Kalem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaterialItemRef' }
              example:
                itemId: d4e5f6a7-0000-0000-0000-000000000003
                canonicalCode: IT-000000000001
                name: Amoksisilin trihidrat
                itemType: RAW_MATERIAL
                lifecycleStatus: Active
                baseUomId: KGM
                shelfLifeDays: null
                retestDays: 365
                minRemainingShelfLifeDays: 180
                storageCondition: AMBIENT_15_25
                lotControlled: true
                serialControlled: false
                contractVersion: v1.1
        '404': { $ref: '#/components/responses/UnknownItem' }
  /stockable-items:
    get:
      operationId: searchStockableItems
      summary: "v1.1 — Stoklanabilir kalem araması (malzeme kalemi + Bitmiş Ürün aynı biçimde)"
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 200 }, description: kod ya da ad }
        - { name: skuLevel, in: query, required: false, schema: { $ref: '#/components/schemas/SkuLevel' } }
        - { name: itemType, in: query, required: false, schema: { $ref: '#/components/schemas/ItemType' } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/LifecycleStatus' } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockableItemPage' }
  /validate:
    post:
      operationId: validateRefs
      summary: Toplu kimlik doğrulama (fail-closed consumer'lar için — bulk)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateRequest' }
            example:
              refs:
                - { itemId: b1f2c3d4-0000-0000-0000-000000000001 }
                - { skuId: c3d4e5f6-0000-0000-0000-000000000002, skuLevel: Lsku }
                - { skuId: 00000000-0000-0000-0000-000000000000, skuLevel: Gsku }
      responses:
        '200':
          description: Doğrulama sonuçları
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateResponse' }
              example:
                results:
                  - { itemId: b1f2c3d4-0000-0000-0000-000000000001, exists: true }
                  - { skuId: c3d4e5f6-0000-0000-0000-000000000002, skuLevel: Lsku, exists: true }
                  - { skuId: 00000000-0000-0000-0000-000000000000, skuLevel: Gsku, exists: false }
                contractVersion: v1
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Decimal: { type: string, pattern: '^-?\d+(\.\d+)?$' }
    SkuLevel:
      type: string
      enum: [Gsku, Lsku, FinishedGood, Item]
      description: "v1.1 `Item` ekledi — malzeme kalemi; kalem kimliği = SKU kimliği"
    LifecycleStatus:
      type: string
      enum: [Draft, Active, Archived, PendingActivation, Inactive, Retired]
      description: "v1.1 PendingActivation / Inactive / Retired ekledi (kalem yaşam döngüsü). Tüketici bilinmeyen değeri seçilemez saymalı."
    ItemType: { type: string, enum: [RAW_MATERIAL, PACKAGING_MATERIAL, SEMI_FINISHED, CONSUMABLE], description: v1.1 }
    MaterialItemRef:
      type: object
      description: v1.1 — malzeme kalemi
      properties:
        itemId: { type: string, format: uuid }
        canonicalCode: { type: string, description: "IT-{12 hane}" }
        name: { type: string }
        itemType: { $ref: '#/components/schemas/ItemType' }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        baseUomId: { type: string, description: "MOD-0048 item-uom (UN/ECE Rec 20)" }
        shelfLifeDays: { type: integer, nullable: true }
        retestDays: { type: integer, nullable: true }
        minRemainingShelfLifeDays: { type: integer, nullable: true }
        storageCondition: { type: string, nullable: true, description: "MOD-0048 storage-condition" }
        lotControlled: { type: boolean }
        serialControlled: { type: boolean }
        contractVersion: { type: string }
    StockableItemRef:
      type: object
      description: "v1.1 — kalem ve Bitmiş Ürün için tek biçim (FG'de stok alanları bugün null döner)"
      properties:
        skuId: { type: string, format: uuid }
        skuLevel: { $ref: '#/components/schemas/SkuLevel' }
        itemId: { type: string, format: uuid }
        canonicalCode: { type: string }
        name: { type: string }
        itemType: { type: string, nullable: true, description: "Item seviyesinde ItemType; FinishedGood için null" }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        baseUomId: { type: string, nullable: true }
        lotControlled: { type: boolean, nullable: true }
        serialControlled: { type: boolean, nullable: true }
    StockableItemPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StockableItemRef' } }
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
        contractVersion: { type: string }
    ProductRef:
      type: object
      properties:
        itemId: { type: string, format: uuid }
        canonicalCode: { type: string }
        name: { type: string }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        baseUomId: { type: string }
        shelfLifeDays: { type: integer, nullable: true }
        minRemainingShelfLifeDays: { type: integer, nullable: true }
        storageCondition: { type: string, nullable: true }
        retestDays: { type: integer, nullable: true }
        lotControlled: { type: boolean }
        serialControlled: { type: boolean }
        contractVersion: { type: string }
    SkuRef:
      type: object
      properties:
        skuId: { type: string, format: uuid }
        skuLevel: { $ref: '#/components/schemas/SkuLevel' }
        canonicalCode: { type: string }
        itemId: { type: string, format: uuid, description: 'resolved GlobalProduct (D-SKU-LINK); v1.1 skuLevel=Item için kalemin kendi kimliği (= skuId)' }
        packUomCode: { type: string, nullable: true }
        packQuantity: { $ref: '#/components/schemas/Decimal' }
        gtin: { type: string, nullable: true }
        marketCode: { type: string, nullable: true }
        contractVersion: { type: string }
    UomConversion:
      type: object
      properties:
        fromUom: { type: string }
        toUom: { type: string }
        numerator: { $ref: '#/components/schemas/Decimal' }
        denominator: { $ref: '#/components/schemas/Decimal' }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        effectiveTo: { type: string, format: date-time, nullable: true }
    UomInfo:
      type: object
      properties:
        baseUomId: { type: string }
        conversions: { type: array, items: { $ref: '#/components/schemas/UomConversion' } }
        contractVersion: { type: string }
    ValidateRequest:
      type: object
      required: [refs]
      properties:
        refs:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string, format: uuid, nullable: true }
              skuId: { type: string, format: uuid, nullable: true }
              skuLevel: { $ref: '#/components/schemas/SkuLevel' }
    ValidateResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string, nullable: true }
              skuId: { type: string, nullable: true }
              skuLevel: { $ref: '#/components/schemas/SkuLevel' }
              exists: { type: boolean }
        contractVersion: { type: string }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            correlationId: { type: string }
        contractVersion: { type: string }
  responses:
    UnknownItem:
      description: Item bulunamadı
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: UNKNOWN_ITEM, message: "item bulunamadı", correlationId: req-1 }, contractVersion: v1 } } }
    UnknownSku:
      description: SKU bulunamadı
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: UNKNOWN_SKU, message: "sku bulunamadı", correlationId: req-2 }, contractVersion: v1 } } }
