                  summary: "v1.1 — malzeme kalemi"
                  value:
                    itemId: d4e5f6a7-0000-0000-0000-000000000003
                    itemKind: Item
                    canonicalCode: IT-000000000003
                    name: Amoksisilin trihidrat
                    materialType: ACTIVE_INGREDIENT
                    lifecycleStatus: Active
                    baseUomId: KGM
                    shelfLifeDays: 1825
                    retestDays: 365
                    minRemainingShelfLifeDays: null
                    storageCondition: AMBIENT_15_25
                    storageConditions: [AMBIENT_15_25, PROTECT_FROM_MOISTURE]
                    lotControlled: true
                    serialControlled: false
                    stockable: true
                    contractVersion: v1.1
        '404': { $ref: '#/components/responses/UnknownItem' }
  /stockable-items:
    get:
      operationId: searchStockableItems
      summary: "v1.1 — Stoklanabilir kalem / SKU araması (sayfalı)"
      description: "Yalnız `stockable: true` kayıtlar döner; varsayılan olarak bütün seviyeler (Item, Gsku, Lsku, FinishedGood) aynı biçimde (`StockableItemRef`). `q`: kod ön eki YA DA adın içinde geçen metin; ordinal, büyük / küçük harf duyarsız, aksan katlaması yok; boş `q` serbesttir (süzme yok). `materialType` verilirse yalnız Item satırları döner. `status` verilmezse Retired dışındaki bütün durumlar döner; seçici ekranlar `status=Active` gönderir. Sıra: `canonicalCode` (ordinal, artan) — sayfalar arasında kararlı. `pageSize` > 100, `q` > 200 karakter ya da bilinmeyen enum değeri → 400. Son sayfanın ötesi → 200 ve boş `items`. Ürün satırları sunucunun çözdüğü tüzel kişi kapsamıyla, kalem satırları kiracı genelinde süzülür. Stoğun geçici 'Model A seçici' rotası (W-UI-01) bu uçla kalkar."
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 200 }, description: "kod ön eki ya da ad içinde geçen metin" }
        - { name: skuLevel, in: query, required: false, schema: { $ref: '#/components/schemas/SkuLevel' } }
        - { name: materialType, in: query, required: false, schema: { $ref: '#/components/schemas/MaterialType' }, description: "Verilirse yalnız Item satırları döner" }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/LifecycleStatus' }, description: "Verilmezse Retired dışındaki bütün durumlar" }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Sayfa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockableItemPage' }
              examples:
                page:
                  summary: "v1.1 — q=amoks: bir kalem ve bir Bitmiş Ürün"
                  value:
                    items:
                      - { skuId: f6a7b8c9-0000-0000-0000-000000000005, skuLevel: FinishedGood, itemId: b1f2c3d4-0000-0000-0000-000000000001, itemKind: GlobalProduct, canonicalCode: FG-000000000046, name: "Amoksisilin 500mg Kapsül · 16 C62", materialType: null, lifecycleStatus: Active, baseUomId: C62, lotControlled: true, serialControlled: true }
                      - { skuId: d4e5f6a7-0000-0000-0000-000000000003, skuLevel: Item, itemId: d4e5f6a7-0000-0000-0000-000000000003, itemKind: Item, canonicalCode: IT-000000000003, name: Amoksisilin trihidrat, materialType: ACTIVE_INGREDIENT, lifecycleStatus: Active, baseUomId: KGM, lotControlled: true, serialControlled: false }
                    page: 1
                    pageSize: 25
                    totalCount: 2
                    contractVersion: v1.1
                past-the-end:
                  summary: "v1.1 — son sayfanın ötesi: 200 ve boş liste"
                  value:
                    items: []
                    page: 9
                    pageSize: 25
                    totalCount: 2
                    contractVersion: v1.1
        '400': { $ref: '#/components/responses/BadRequest' }
  /skus/bulk-read:
    post:
      operationId: bulkReadSkus
      summary: "v1.1 — Toplu SKU okuma (kimlik listesi → kimlik + seviye + kod + ad + durum)"
      description: "En çok 200 kimlik (stok `/balance` varsayılan sayfasının (50) dört katı, arama sayfası üst sınırının (100) iki katı); daha büyük küme parçalanır. Seviye istenmez: kimlikler UUID'dir ve sunucu seviyeyi kendisi bulur; kalemde `skuId == itemId`. `items` istek sırasındadır; tekrarlanan kimlik ilk geçtiği yerde bir kez cevaplanır. Draft, Deactivated ve Retired kayıtlar da bulunur (`lifecycleStatus` ile döner). Global Ürün kimliği bir SKU değildir ve `notFound`'a girer. Bulunamayan, başka kiracıya ait ya da çağıranın tüzel kişi kapsamı dışındaki ürün SKU'su da aynı cevabı alır: `notFound` (ifşa yok, tüm istek reddedilmez). `name` yalnız gösterim içindir: ayrıştırılmaz, anahtar olarak kullanılmaz. Geçersiz UUID, boş liste ya da 200'den uzun liste → 400."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkSkuReadRequest' }
            examples:
              mixed:
                summary: "v1.1 — Lsku, kalem, Global Ürün kimliği ve bilinmeyen kimlik"
                value:
                  skuIds:
                    - c3d4e5f6-0000-0000-0000-000000000002
                    - d4e5f6a7-0000-0000-0000-000000000003
                    - b1f2c3d4-0000-0000-0000-000000000001
                    - 00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: Bulunanlar (istek sırasında) ve bulunamayanlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkSkuReadResponse' }
              examples:
                mixed:
                  summary: "v1.1 — Global Ürün kimliği ve bilinmeyen kimlik notFound'da"
                  value:
                    items:
                      - { skuId: c3d4e5f6-0000-0000-0000-000000000002, skuLevel: Lsku, canonicalCode: LS-000000000045, name: "Amoksisilin 500mg Kapsül · 16 C62 · TR", lifecycleStatus: Active }
                      - { skuId: d4e5f6a7-0000-0000-0000-000000000003, skuLevel: Item, canonicalCode: IT-000000000003, name: Amoksisilin trihidrat, lifecycleStatus: Active }
                    notFound: [b1f2c3d4-0000-0000-0000-000000000001, 00000000-0000-0000-0000-000000000000]
                    contractVersion: v1.1
        '400': { $ref: '#/components/responses/BadRequest' }
  /validate:
    post:
      operationId: validateRefs
      summary: Toplu kimlik doğrulama (fail-closed consumer'lar için — bulk)
      description: "v1.1 — Geçerli satır biçimleri: (a) yalnız `itemId` → Global Ürün ya da kalem var mı; (b) `skuId` + `skuLevel` → o seviyede SKU var mı (`skuLevel: Item` kabul edilir); (c) `itemId` + `skuId` + `skuLevel` → SKU o seviyede var mı VE D-SKU-LINK ile o `itemId`'ye mi çözülüyor. Seviye uyuşmazlığı (kimlik var ama başka seviyede) ya da (c)'de bağ uyuşmazlığı → `exists: false`. Başka biçim (ör. `skuLevel`'sız `skuId`, boş satır), bilinmeyen enum değeri ya da 200'den uzun `refs` → 400. `exists` = kaydın varlığı; kullanılabilirlik için `lifecycleStatus` okunur. Sonuç satırında v1.1 alanları `itemKind` ve `lifecycleStatus` döner (bulunamayan satırda yok)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateRequest' }
            examples:
              v1.0-mock:
                summary: "v1.0 taklit örneği (v1.0-mock-only)"
                value:
                  refs:
                    - { itemId: b1f2c3d4-0000-0000-0000-000000000001 }
                    - { skuId: c3d4e5f6-0000-0000-0000-000000000002, skuLevel: Lsku }
                    - { skuId: 00000000-0000-0000-0000-000000000000, skuLevel: Gsku }
              item:
                summary: "v1.1 — kalem (b biçimi) ve seviye uyuşmazlığı"
                value:
                  refs:
                    - { skuId: d4e5f6a7-0000-0000-0000-000000000003, skuLevel: Item }
                    - { skuId: d4e5f6a7-0000-0000-0000-000000000003, skuLevel: Gsku }
      responses:
        '200':
          description: Doğrulama sonuçları
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateResponse' }
              examples:
                v1.0-mock:
                  summary: "v1.0 taklit örneği (v1.0-mock-only)"
                  value:
                    results:
                      - { itemId: b1f2c3d4-0000-0000-0000-000000000001, exists: true }
                      - { skuId: c3d4e5f6-0000-0000-0000-000000000002, skuLevel: Lsku, exists: true }
                      - { skuId: 00000000-0000-0000-0000-000000000000, skuLevel: Gsku, exists: false }
                    contractVersion: v1
                item:
                  summary: "v1.1 — kalem bulundu; aynı kimlik Gsku seviyesinde yok"
                  value:
                    results:
                      - { skuId: d4e5f6a7-0000-0000-0000-000000000003, skuLevel: Item, exists: true, itemKind: Item, lifecycleStatus: Active }
                      - { skuId: d4e5f6a7-0000-0000-0000-000000000003, skuLevel: Gsku, exists: false }
                    contractVersion: v1.1
        '400': { $ref: '#/components/responses/BadRequest' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Decimal: { type: string, pattern: '^-?\d+(\.\d+)?$' }
    SkuLevel:
      type: string
      enum: [Gsku, Lsku, FinishedGood, Item]
      description: "v1.1 `Item` ekledi — malzeme kalemi; kalem kimliği = SKU kimliği (`skuId == itemId`). Gsku, Lsku, FinishedGood aynen. Yanıtta açık enum (bilinmeyen değer hata sayılmaz); istekte bilinmeyen değer 400."
    ItemKind:
      type: string
      enum: [GlobalProduct, Item]
      description: "v1.1 — `itemId`'nin türü. GlobalProduct: ilaç kimlik zinciri (mamul; SKU seviyeleri Gsku / Lsku / FinishedGood). Item: malzeme kalemi (SKU seviyesi Item). Alan yoksa GlobalProduct'tır."
    MaterialType:
      type: string
      enum: [ACTIVE_INGREDIENT, EXCIPIENT, RAW_MATERIAL, PACKAGING_PRIMARY, PACKAGING_SECONDARY, INTERMEDIATE]
      description: "v1.1 — yalnız `itemKind: Item` kayıtlarında dolu. ACTIVE_INGREDIENT etkin madde · EXCIPIENT yardımcı madde · RAW_MATERIAL diğer hammadde · PACKAGING_PRIMARY birincil ambalaj (ürünle temas eden) · PACKAGING_SECONDARY ikincil ambalaj (kutu, prospektüs, etiket) · INTERMEDIATE ara ürün / yarı mamul. Mamul bu listede yoktur: mamul = Global Ürün (`itemKind: GlobalProduct`). Değerler MOD-0048 `material-type` listesiyle birebir aynıdır; yeni değer sözleşme sürümü ister."
    LifecycleStatus:
      type: string
      enum: [Draft, Active, Archived, Deactivated, Retired]
      description: |
        v1.1 Deactivated ve Retired ekledi; v1.0 değerleri (Draft, Active, Archived) aynen. Açık enum: bilinmeyen değer =
        yeni hareket yok; ters kayıt her durumda kabul. Stok hareket kuralı STOK tarafından uygulanır; MDM yalnız durumu
        ve `stockable`'ı yayımlar:
          - Draft: hareket yok.
          - Active: hareket var.
          - Deactivated (kullanım dışı): yeni giriş yok; mevcut stok çıkabilir, hurda ve iade yapılabilir.
          - Retired (emekli): hareket yok.
          - Archived (v1.0 değeri): MDM bu değeri yayımlamaz; tüketici görürse Retired gibi davranır (CT kararı, MOD-0290-FU04 O-4).
          - Durumdan bağımsız: `stockable: false` kayıtta stok yeni hareket kabul etmez (ters kayıt hariç) — CT kararı.
          - Her durumda ters kayıt (REVERSAL) kabul edilir.
        İç durumlar sözleşmeye şöyle yayımlanır (kalem): Draft → Draft; PendingActivation (ilk etkinleştirme onayı
        beklerken) → Draft; Active → Active; PendingActivation (yeniden etkinleştirme onayı beklerken) → Deactivated;
        Deactivated → Deactivated; Retired → Retired. Ürün satırlarının iç durum eşlemesi: MOD-0290-FU04 §16.3 (O-4).
    StorageConditionCode:
      type: string
      enum: [AMBIENT_15_25, COOL_2_8, FROZEN_BELOW_MINUS_20, PROTECT_FROM_LIGHT, PROTECT_FROM_MOISTURE]
      description: "v1.1 — MOD-0048 `storage-condition` listesinin uzlaşılan beş kodu (15–25°C, 2–8°C, ≤ −20°C, ışıktan koru, nemden koru). Yanıtta açık enum: liste büyüyebilir, bilinmeyen kod olduğu gibi taşınır."
    ShelfLifeSource:
      type: string
      enum: [Own, Gsku]
      description: "v1.1 — `shelfLifeDays` değerinin kaynağı. Own: kaydın kendi değeri. Gsku: kaydın kendi değeri yok, değer okuma anında üst GSKU'dan gelir (Bitmiş Ürün — D-2; Lsku — O-3), kopyalanmaz. `shelfLifeDays` null ise kaynak Own'dur."
    StockableItemRef:
      type: object
      description: "v1.1 — stoklanabilir kalem / SKU arama satırı; bütün seviyeler için tek biçim."
      required: [skuId, skuLevel, itemId, itemKind, canonicalCode, name, lifecycleStatus]
      properties:
        skuId: { type: string, format: uuid }
        skuLevel: { $ref: '#/components/schemas/SkuLevel' }
        itemId: { type: string, format: uuid, description: "Item seviyesinde = skuId; diğerlerinde çözülmüş Global Ürün (D-SKU-LINK)" }
        itemKind: { $ref: '#/components/schemas/ItemKind' }
        canonicalCode: { type: string, description: "Opak; ayrıştırılmaz" }
        name: { type: string, description: "Yalnız gösterim içindir; ayrıştırılmaz, anahtar değildir. Item: kalemin adı. Ürün SKU'su: okuma anında türetilen görünen ad (MOD-0290-FU04 O-5)" }
        materialType: { anyOf: [{ $ref: '#/components/schemas/MaterialType' }, { type: 'null' }], description: "Item seviyesinde dolu; diğer seviyelerde null" }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        baseUomId: { type: [string, 'null'] }
        lotControlled: { type: [boolean, 'null'] }
        serialControlled: { type: [boolean, 'null'] }
    StockableItemPage:
      type: object
      description: v1.1
      required: [items, page, pageSize, totalCount, contractVersion]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StockableItemRef' } }
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
        contractVersion: { type: string }
    BulkSkuReadRequest:
      type: object
      description: v1.1
      required: [skuIds]
      properties:
        skuIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
    BulkSkuReadItem:
      type: object
      description: "v1.1 — kimlik + seviye + kod + ad + durum"
      required: [skuId, skuLevel, canonicalCode, name, lifecycleStatus]
      properties:
        skuId: { type: string, format: uuid }
        skuLevel: { $ref: '#/components/schemas/SkuLevel' }
        canonicalCode: { type: string, description: "Opak; ayrıştırılmaz" }
        name: { type: string, description: "Yalnız gösterim içindir; ayrıştırılmaz, anahtar değildir. Item: kalemin adı. Ürün SKU'su: okuma anında türetilen görünen ad: Global Ürün adı · paket miktarı + birimi, LSKU'da + pazar kodu (MOD-0290-FU04 O-5)" }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
    BulkSkuReadResponse:
      type: object
      description: v1.1
      required: [items, notFound, contractVersion]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BulkSkuReadItem' } }
        notFound: { type: array, items: { type: string, format: uuid } }
        contractVersion: { type: string }
    SkuProductLink:
      type: object
      description: "v1.1 — `resolveSkuProduct` cevabının şeması (v1.0 örneğinin biçimi + `itemKind`). v1.0 cevabını yazıya döktüğü için `required` taşımaz."
      properties:
        skuId: { type: string, format: uuid }
        skuLevel: { $ref: '#/components/schemas/SkuLevel' }
        itemId: { type: string, format: uuid, description: "Gsku / Lsku / FinishedGood: çözülmüş Global Ürün. Item: kalemin kendisi (= skuId)" }
        itemKind: { $ref: '#/components/schemas/ItemKind' }
        contractVersion: { type: string }
    ProductRef:
      type: object
      description: |
        v1.1 — `itemKind: Item` ise kayıt bir malzeme kalemidir ve stok davranışı alanları kalemin kendisinden gelir:
          - `materialType` dolu; `serialControlled` her zaman false = uygulanmaz (kalemde seri takibi yok).
          - `storageConditions` (v1.1, çoklu) kalemin saklama koşullarının tamamıdır; ambalaj dışı kalemde boş liste
            `stockable: true`'yu engeller (CT kararı).
          - `storageCondition` (v1.0, tek değer) listedeki sıcaklık koşulunu taşır; listede sıcaklık koşulu yoksa null
            (kural: kayıtta en çok bir sıcaklık koşulu — CT kararı, MOD-0290-FU04 O-2).
          - `shelfLifeDays` / `retestDays` dolu ya da null (O-9). `minRemainingShelfLifeDays` isteğe bağlı (O-7).
          - Zorunlu stok alanı dolmamış kalemde (taslak) alan yok döner ve `stockable` false'tur.
        `itemKind: GlobalProduct` (ya da alan yok) ise stok davranışı SKU düzeyindedir: v1.1 sunucusu bu türde v1.0 ve
        v1.1 stok alanlarını döndürmez (O-1, `deprecated` işaretli alanlar); yetkili okuma `getSku`.
      properties:
        itemId: { type: string, format: uuid }
        canonicalCode: { type: string }
        name: { type: string }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        baseUomId: { type: string, deprecated: true, description: "Global Ürün için stok alanları SKU düzeyinden okunur (getSku); v1.1 sunucusu Global Ürün yanıtında bu alanları döndürmez. Alan yok = bilinmiyor; false/0 varsayılmaz. Kalem (itemKind: Item) yanıtında dolu döner; `deprecated` yalnız Global Ürün kullanımını işaretler." }
        shelfLifeDays: { type: integer, nullable: true, deprecated: true, description: "Global Ürün için stok alanları SKU düzeyinden okunur (getSku); v1.1 sunucusu Global Ürün yanıtında bu alanları döndürmez. Alan yok = bilinmiyor; false/0 varsayılmaz. Kalem (itemKind: Item) yanıtında dolu ya da null döner; `deprecated` yalnız Global Ürün kullanımını işaretler." }
        minRemainingShelfLifeDays: { type: integer, nullable: true, deprecated: true, description: "Global Ürün için stok alanları SKU düzeyinden okunur (getSku); v1.1 sunucusu Global Ürün yanıtında bu alanları döndürmez. Alan yok = bilinmiyor; false/0 varsayılmaz. Kalem (itemKind: Item) yanıtında isteğe bağlıdır (O-7); `deprecated` yalnız Global Ürün kullanımını işaretler." }
        storageCondition: { type: string, nullable: true, deprecated: true, description: "Global Ürün için stok alanları SKU düzeyinden okunur (getSku); v1.1 sunucusu Global Ürün yanıtında bu alanları döndürmez. Alan yok = bilinmiyor; false/0 varsayılmaz. Kalem (itemKind: Item) yanıtında sıcaklık koşulu kodunu taşır (O-2); `deprecated` yalnız Global Ürün kullanımını işaretler." }
        retestDays: { type: integer, nullable: true, deprecated: true, description: "Global Ürün için stok alanları SKU düzeyinden okunur (getSku); v1.1 sunucusu Global Ürün yanıtında bu alanları döndürmez. Alan yok = bilinmiyor; false/0 varsayılmaz. Kalem (itemKind: Item) yanıtında dolu ya da null döner (O-9); `deprecated` yalnız Global Ürün kullanımını işaretler." }
        lotControlled: { type: boolean, deprecated: true, description: "Global Ürün için stok alanları SKU düzeyinden okunur (getSku); v1.1 sunucusu Global Ürün yanıtında bu alanları döndürmez. Alan yok = bilinmiyor; false/0 varsayılmaz. Kalem (itemKind: Item) yanıtında dolu döner; `deprecated` yalnız Global Ürün kullanımını işaretler." }
        serialControlled: { type: boolean, deprecated: true, description: "Global Ürün için stok alanları SKU düzeyinden okunur (getSku); v1.1 sunucusu Global Ürün yanıtında bu alanları döndürmez. Alan yok = bilinmiyor; false/0 varsayılmaz. Kalem (itemKind: Item) yanıtında her zaman false = uygulanmaz; `deprecated` yalnız Global Ürün kullanımını işaretler." }
        contractVersion: { type: string }
        itemKind: { $ref: '#/components/schemas/ItemKind' }
        materialType: { anyOf: [{ $ref: '#/components/schemas/MaterialType' }, { type: 'null' }], description: "v1.1 — Item'da dolu; GlobalProduct yanıtında yok" }
        storageConditions: { type: array, items: { $ref: '#/components/schemas/StorageConditionCode' }, description: "v1.1 — çoklu seçim; boş liste = koşul yok. GlobalProduct yanıtında yok" }
        stockable: { type: [boolean, 'null'], description: "v1.1 — Item'da dolu; GlobalProduct yanıtında yok (stoklanabilirlik SKU düzeyinde)" }
    SkuRef:
      type: object
      description: |
        v1.1 — stok davranışı için yetkili okuma bu şemadır (`getSku`). Item seviyesinde `itemId` kalemin kendi
        kimliğidir (= skuId). Stok davranışı alanlarının seviyeye göre dolumu (ürün ana verisi planı §4a, "Alanlar (S3)"
        tablosu; "dolu" = zorunlu alan, eksikse null ve `stockable` false):
          | alan               | Item            | Gsku              | Lsku           | FinishedGood                            |
          |--------------------|-----------------|-------------------|----------------|-----------------------------------------|
          | materialType       | dolu            | null              | null           | null                                    |
          | baseUomId          | dolu            | dolu              | GSKU'dan (O-3) | dolu (= üst GSKU'nunki, O-14)           |
          | shelfLifeDays      | dolu ya da null | dolu (ruhsatlı)   | GSKU'dan (O-3) | kendi değeri (≤ GSKU); boşsa üst GSKU'dan |
          | shelfLifeDaysSource| Own             | Own               | Gsku (O-3)     | Own ya da Gsku                          |
          | retestDays         | dolu ya da null | null              | null           | null                                    |
          | storageConditions  | dolu            | dolu              | GSKU'dan (O-3) | dolu                                    |
          | lotControlled      | dolu            | dolu              | GSKU'dan (O-3) | dolu                                    |
          | serialControlled   | false (uyg. değil) | null (sonra)   | dolu           | dolu                                    |
          | stockable          | dolu            | dolu              | GSKU'dan (O-3) | dolu                                    |
          | gtin (v1.0 alanı)  | null (sonra)    | null (gereksiz)   | null (O-6)     | satış kutusu GTIN-14, İTS (01) (D-1)    |
        Kalemde `shelfLifeDays` / `retestDays` dolu ya da null olabilir (O-9). Ambalaj dışı kalemde boş `storageConditions`
        `stockable: true`'yu engeller (CT kararı). `stockable: false` kayıtta stok yeni hareket kabul etmez (ters kayıt
        hariç). Birim çevrimleri `getSkuUom`'dan okunur.
      properties:
        skuId: { type: string, format: uuid }
        skuLevel: { $ref: '#/components/schemas/SkuLevel' }
        canonicalCode: { type: string }
        itemId: { type: string, format: uuid, description: 'resolved GlobalProduct (D-SKU-LINK)' }
        packUomCode: { type: string, nullable: true }
        packQuantity: { $ref: '#/components/schemas/Decimal' }
        gtin: { type: string, nullable: true }
        marketCode: { type: string, nullable: true }
        contractVersion: { type: string }
        itemKind: { $ref: '#/components/schemas/ItemKind' }
        name: { type: string, description: "v1.1 — yalnız gösterim içindir; ayrıştırılmaz, anahtar değildir. Item: kalemin adı. Ürün SKU'su: okuma anında türetilen görünen ad (MOD-0290-FU04 O-5)" }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        materialType: { anyOf: [{ $ref: '#/components/schemas/MaterialType' }, { type: 'null' }], description: "v1.1 — yalnız Item seviyesinde dolu" }
        baseUomId: { type: [string, 'null'], description: "v1.1 — MOD-0048 `item-uom` kodu (UN/ECE Rec 20; veridir, sabit kodlanmaz); stok her zaman temel birimde tutulur" }
        shelfLifeDays: { type: [integer, 'null'], description: "v1.1 — etkin değer (kaynak `shelfLifeDaysSource`)" }
        shelfLifeDaysSource: { $ref: '#/components/schemas/ShelfLifeSource' }
        retestDays: { type: [integer, 'null'], description: "v1.1 — yalnız Item seviyesinde" }
        storageConditions: { type: array, items: { $ref: '#/components/schemas/StorageConditionCode' }, description: "v1.1 — çoklu seçim" }
        lotControlled: { type: [boolean, 'null'], description: v1.1 }
        serialControlled: { type: [boolean, 'null'], description: "v1.1 — SKU düzeyi seri takibi (pazara bağlı, İTS): Lsku ve FinishedGood'da dolu; Item'da false = uygulanmaz; Gsku'da null (sonra)" }
        stockable: { type: [boolean, 'null'], description: "v1.1 — false ise stok yeni hareket kabul etmez (ters kayıt hariç)" }
    UomConversion:
      type: object
      properties:
        fromUom: { type: string }
        toUom: { type: string }
        numerator: { $ref: '#/components/schemas/Decimal' }
        denominator: { $ref: '#/components/schemas/Decimal' }
        effectiveFrom: { type: string, format: date-time, nullable: true }
        effectiveTo: { type: string, format: date-time, nullable: true }
    UomInfo:
      type: object
      description: "v1.1 — yalnız kaydın kullandığı birimlerin çiftleri döner; her birim temel birime en çok 4 kenarda ulaşır. Birim kodları MOD-0048 `item-uom` verisidir; tüketici sabit kodlamaz."
      properties:
        baseUomId: { type: string }
        conversions: { type: array, items: { $ref: '#/components/schemas/UomConversion' } }
        contractVersion: { type: string }
    ValidateRequest:
      type: object
      description: "v1.1 — geçerli satır biçimleri `validateRefs` açıklamasında; en çok 200 satır."
      required: [refs]
      properties:
        refs:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              itemId: { type: string, format: uuid, nullable: true }
              skuId: { type: string, format: uuid, nullable: true }
              skuLevel: { $ref: '#/components/schemas/SkuLevel' }
    ValidateResponse:
      type: object
      description: "v1.1 — `exists` = kaydın varlığı; kullanılabilirlik için `lifecycleStatus` okunur. Seviye ya da bağ uyuşmazlığı `exists: false`."
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string, nullable: true }
              skuId: { type: string, nullable: true }
              skuLevel: { $ref: '#/components/schemas/SkuLevel' }
              exists: { type: boolean }
              itemKind: { $ref: '#/components/schemas/ItemKind' }
              lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        contractVersion: { type: string }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            correlationId: { type: string }
        contractVersion: { type: string }
  responses:
    UnknownItem:
      description: Item bulunamadı
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: UNKNOWN_ITEM, message: "item bulunamadı", correlationId: req-1 }, contractVersion: v1 } } }
    UnknownSku:
      description: SKU bulunamadı
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: UNKNOWN_SKU, message: "sku bulunamadı", correlationId: req-2 }, contractVersion: v1 } } }
    BadRequest:
      description: "v1.1 — geçersiz istek: sınır dışı sayfa boyutu, uzun `q`, bilinmeyen enum değeri, geçersiz UUID, boş ya da 200'den uzun liste, geçersiz doğrulama satırı"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            batch-limit-exceeded:
              value: { error: { code: BATCH_LIMIT_EXCEEDED, message: "en çok 200 kimlik", details: { maxItems: 200 }, correlationId: req-3 }, contractVersion: v1.1 }
            invalid-uuid:
              value: { error: { code: INVALID_UUID, message: "geçersiz kimlik", details: { index: 2 }, correlationId: req-4 }, contractVersion: v1.1 }
            invalid-parameter:
              value: { error: { code: INVALID_PARAMETER, message: "pageSize en çok 100", details: { parameter: pageSize, maximum: 100 }, correlationId: req-5 }, contractVersion: v1.1 }
            invalid-ref:
              value: { error: { code: INVALID_REF, message: "geçersiz doğrulama satırı", details: { index: 0, reason: "skuId skuLevel olmadan" }, correlationId: req-6 }, contractVersion: v1.1 }
