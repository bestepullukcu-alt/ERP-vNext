openapi: 3.1.0
info:
  title: PRODUCT-MASTER-BUNDLE
  description: >
    MOD-0290 Product/Item/SKU Master — Wave-0 frozen contract (v1).
    Canonical kimlik (Model A: GlobalProduct→Gsku→Lsku→FinishedGood). Consumer'lar READ-ONLY.
    Model B (Product) bu contract'ta YOK (DEC-INV-17). Tenant+LegalEntity scoped (server-resolved).
    Mock: `prism mock product-master-bundle.openapi.yaml`.
    v1.1 (MOD-0290-FU04 Kalem / Malzeme Ana Kaydı; stok ekibiyle uzlaşma 2026-10-07, ürün ana verisi planı §4a) —
    YALNIZ EKLEME, tek bilinçli istisna O-1 davranış daralmasıdır (aşağıda). Dışarıya TEK okuma sözleşmesi vardır:
    mevcut v1 yolları (`getProduct`, `getSku`, `resolveSkuProduct`, `getSkuUom`, `validateRefs`) malzeme kalemini de
    (`itemKind: Item`) cevaplar. Yeni yollar (`/items/{itemId}`, `/stockable-items`, `/skus/bulk-read`) eklenir ama
    eskilerin yerine geçmez. Kalemde kalem kimliği = SKU kimliği (`skuId == itemId`, `skuLevel: Item`); SKU → kalem
    çözümlemesi (D-SKU-LINK) kalem için kendisini döndürür. `itemId` v1.0'da Global Ürün kimliğidir; v1.1'de
    `itemKind` hangisi olduğunu söyler (kimlikler UUID'dir, çakışmaz). Kalemler kiracı geneli ana veridir: kalem
    satırlarına tüzel kişi süzmesi uygulanmaz; ürün satırlarının kapsamı aynen kalır. Yanıt enum'ları AÇIKTIR:
    tüketici bilinmeyen değeri hata saymaz (kural `x-notes` içinde). v1.0'ın dondurulmuş kopyası ve Prism taklidinin
    kullandığı dosya `product-master-bundle.v1.0.openapi.yaml`'dır; bu dosya v1.1 taslağıdır.
  version: 1.1.0-draft.4
  x-status: "FROZEN v1.0 (`product-master-bundle.v1.0.openapi.yaml`; v1.0 Prism taklidi bunu kullanır) · DRAFT v1.1 (bu dosya) — v1.0 parçaları dondurulmuş ve değişmez; bu dosyadaki bilinçli istisnalar changelog'un draft.4 satırında sayılıdır. v1.1 eklemeleri stok ekibinin 2026-10-07 kabulüne göre yazıldı (plan §4a); Control Tower dondurana kadar DRAFT kalır ve değişebilir. Tüketiciler v1.1'e Prism taklidiyle karşı geliştirebilir; canlı bağ dondurmadan sonra kurulur."
  x-frozen-baseline: 1.0.0
  x-owner: MOD-0290
  x-decisions: [DEC-INV-17, 18]
  x-notes:
    - "Açık enum kuralı: Yanıt enum'ları AÇIKTIR. Tüketici bilinmeyen değeri hata saymaz: LifecycleStatus'ta 'yeni hareket yok' (ters kayıt yine kabul), diğerlerinde değeri olduğu gibi taşır. Kesin enum üreten istemci kullanılmaz. İstek parametresinde bilinmeyen değer 400."
    - "Yetkili okuma: stok davranışı için yetkili okuma `getSku`'dur (kalem için `getSku(level=Item)`); `getProduct`'taki kalem alanları aynı değerleri taşır. Kalemde `serialControlled: false` 'uygulanmaz' demektir (kalemde seri takibi yoktur)."
    - "Davranış daralması (O-1): v1.1 sunucusu Global Ürün (`itemKind: GlobalProduct`) yanıtında ProductRef'in v1.0 stok alanlarını döndürmez; bu alanlar SKU düzeyinden (`getSku`) okunur. Alan yok = bilinmiyor; false / 0 varsayılmaz. Stok ekibinin yazılı onayı bekleniyor."
    - "`itemKind` yoksa GlobalProduct'tır (v1.0 sunucusu ve v1.0 örnekleri bu alanı taşımaz)."
    - "`canonicalCode` opaktır, ayrıştırılmaz. Gerçek biçim RCS-001 §4: `GP-` / `GS-` / `LS-` / `FG-` / `IT-` + 12 hane. v1.0 örneklerindeki `GP-000123` ve `LSKU-TR-000045` eski taklit değerleridir."
    - "`contractVersion`: sunucu her yanıtta yayımlanan sürümü döner; tüketici bu alanla dallanmaz."
    - "Birim kodları veridir (MOD-0048 Referans Veri Yönetimi, `item-uom` listesi, UN/ECE Rec 20); tüketici sabit kodlamaz. v1.0 örneklerindeki EA, BOX, PALLET yalnız örnektir. Kutu / koli için kesin kodlar S1'de tohumdan önce doğrulanır (O-21); örneklerdeki XBX / XCS bu doğrulamaya tabidir."
    - "Ondalık metinler (Decimal) tam (exact) ayrıştırılır; double / float kullanılmaz. Birim çevriminde pay ve payda her zaman sıfırdan büyüktür (v1.1 kuralı, açıklama olarak; dondurulmuş v1.0 `UomConversion` şeması değiştirilmedi)."
    - "Taslak ve eksik kayıtlar: zorunlu stok alanı henüz dolmamış kayıtta (taslak ya da ilk doldurmadan önce) SkuRef'te alan null, ProductRef'te alan yok döner ve `stockable` false'tur. Kalemde `shelfLifeDays` / `retestDays` dolu ya da null olabilir (O-9). Ambalaj dışı kalemde boş `storageConditions` listesi `stockable: true`'yu engeller (CT kararı)."
    - "Stok hareket kuralı stok tarafından uygulanır; MDM yalnız durumu ve `stockable`'ı yayımlar. `stockable: false` kayıtta stok yeni hareket kabul etmez (ters kayıt hariç) — CT kararı (LifecycleStatus açıklaması)."
    - "Olay (event) MVP-1'de yoktur: stok her harekette bu sözleşmeyi canlı okur; MDM'ye ulaşamazsa hareketi reddeder (kapalı-başarısız)."
    - "İstek başlığı boyutu (v1.1): MDM 64 KB'a kadar istek başlığını kabul eder. Gelen kimlik belirteçleri ~35 KB'tır; ASP.NET Core Kestrel'in varsayılan toplam başlık sınırı (32 KB) yetmez. Ölçüldü 2026-10-07 (bu dal): MDM `Program.cs` ve ağ geçidi `Program.cs` `MaxRequestHeadersTotalSize = 64 * 1024` taşıyor (commit 9dfe859f2). Sınır sözleşmenin parçasıdır: düşürülmesi bu sözleşmeyi kırar; S4 dilimi bunu ~35 KB belirteçli bir HTTP testiyle ölçer."
    - "Prism ile büyük başlık: Node'un varsayılan başlık sınırı küçüktür; taklidi `NODE_OPTIONS=--max-http-header-size=65536 npx @stoplight/prism-cli mock <dosya>` ile çalıştırın (DOĞRULANMADI)."
    - "Sözdizimi: v1.0 alanları OpenAPI 3.0 tarzı `nullable: true` taşır ve değiştirilmez; v1.1'de eklenen alanlar 3.1 sözdizimini (`type: [x, 'null']`, `anyOf: [$ref, {type: 'null'}]`) kullanır. Anlam aynıdır."
    - "Örnekler: her işlem adlı örnekler (`examples`) taşır; ilk örnek v1.0 dosyasındaki örnektir (Prism varsayılan cevabı değişmez) ve 'v1.0-mock-only' işaretlidir."
    - "v1.1'de OLMAYAN (sonra): kalem GTIN'i; GSKU seri takibi; koli / palet GTIN'i ve ambalaj hiyerarşisi (MOD-0178 Yerleştirme / Toplama / Paketleme, P9); tehlike sınıfı, CoA zorunlu mu, girişte varsayılan karantina (MOD-0175 Karantina / Bloke Stok)."
    - "Açık maddeler ve CT kararları (2026-10-07): execution/domains/master-data-management/module-packs/MOD-0290-FU04-item-material-master.md §25.1."
  x-changelog:
    - date: "2026-10-06"
      version: 1.1.0-draft.1
      note: "G0 (WP-MDM-ITEM-MASTER-G0): SkuLevel Item; PendingActivation / Inactive / Retired durumları; /items/{itemId}; /stockable-items; ItemType."
    - date: "2026-10-07"
      version: 1.1.0-draft.2
      note: "S0 (WP-MDM-ITEM-MASTER-S0) — stok ekibiyle uzlaşmaya hizalandı: ItemKind eklendi; G0 ItemType / itemType → MaterialType / materialType (altı değer); G0 Inactive → Deactivated; PendingActivation sözleşmeden çıkarıldı (iç durumdur, Draft ya da Deactivated olarak yayımlanır); mevcut beş v1 yolunun kalemi cevaplaması yazıldı; MaterialItemRef kaldırıldı, alanları ProductRef / SkuRef v1.1 eklerine taşındı; stok davranışı alanları (storageConditions çoklu, stockable, shelfLifeDaysSource, SKU düzeyi serialControlled, satış kutusu GTIN'i); /stockable-items hizalandı; /skus/bulk-read eklendi; resolveSkuProduct cevabına şema; 64 KB başlık notu. v1.0 parçalarında değişiklik yok."
    - date: "2026-10-07"
      version: 1.1.0-draft.3
      note: "CT kararları işlendi (MOD-0290-FU04 §25.1): O-1 Global Ürün türünde v1.0 stok alanları dönmez; O-2 en çok bir sıcaklık koşulu; O-3 LSKU stok alanları GSKU'dan miras; O-4 Archived yayımlanmaz; O-5 ürün SKU adı okuma anında türetilir; O-6 LSKU gtin null; O-7 minRemainingShelfLifeDays isteğe bağlı. Yalnız v1.1 açıklamaları değişti; şema ve v1.0 parçaları aynı."
    - date: "2026-10-07"
      version: 1.1.0-draft.4
      note: "S0-FIX1 (bağımsız inceleme, 945fee37c): davranış daralması (O-1) — stok ekibinin yazılı onayı bekleniyor; ProductRef'in v1.0 stok alanlarına `deprecated: true` + açıklama; açık enum kuralı; bütün işlemlerde adlı örnekler (ilk örnek v1.0 örneği, 'v1.0-mock-only'); materialType yanıt alanları MaterialType'a bağlandı; StorageConditionCode beş kodla enum; getSkuUom'a 404, /stockable-items · /skus/bulk-read · /validate'e 400; validateRefs `refs` en çok 200; çevrim pay / paydasının sıfırdan büyük olması v1.1 açıklaması olarak (dondurulmuş UomConversion şemasına dokunulmadı — CT kararı); yalnız yeni v1.1 şemalarına `required`; v1.1 alanlarında 3.1 sözdizimi; BulkSkuReadItem'a lifecycleStatus; arama / toplu okuma / doğrulama anlamları; v1.0 kopyası ayrı dosyada. v1.0'da bilinçli değişen satırlar: `example` → `examples` (değerler aynı), ProductRef stok alanlarının açıklaması, getSkuUom 404, /validate 400, `refs` maxItems, UomInfo / ValidateRequest / ValidateResponse'a eklenen açıklama."
servers:
  - url: /api/product-master
security:
  - bearerAuth: []
paths:
  /products/{itemId}:
    get:
      operationId: getProduct
      summary: Ürün kimliği (ItemId → GlobalProduct)
      description: "v1.1 — `itemId` bir Global Ürün ya da bir malzeme kalemi olabilir; `itemKind` hangisi olduğunu söyler (yoksa GlobalProduct). Kalem için: `canonicalCode` IT-…, `materialType` dolu, stok davranışı alanları kalemin kendisinden gelir, `serialControlled` false = uygulanmaz. Global Ürün için stok davranışı SKU düzeyindedir: v1.1 sunucusu Global Ürün yanıtında ProductRef'in v1.0 stok alanlarını ve v1.1 stok alanlarını döndürmez; yetkili okuma `getSku` (davranış daralması O-1 — stok ekibinin yazılı onayı bekleniyor)."
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ürün
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductRef' }
              examples:
                v1.0-mock:
                  summary: "v1.0 taklit örneği (v1.0-mock-only)"
                  description: "v1.0 dosyasındaki örnek, değerleri değiştirilmeden. Yalnız v1.0 Prism taklidi içindir; v1.1 sunucusu bu cevabı vermez: Global Ürün yanıtında stok alanları yok (O-1), kod GP- + 12 hane, saklama koşulu MOD-0048 kodu, birim `item-uom` kodu."
                  value:
                    itemId: b1f2c3d4-0000-0000-0000-000000000001
                    canonicalCode: GP-000123
                    name: Amoksisilin 500mg Kapsül
                    lifecycleStatus: Active
                    baseUomId: EA
                    shelfLifeDays: 730
                    minRemainingShelfLifeDays: 180
                    storageCondition: "15-25C"
                    retestDays: 365
                    lotControlled: true
                    serialControlled: false
                    contractVersion: v1
                global-product:
                  summary: "v1.1 — Global Ürün (stok alanları yok; getSku'dan okunur)"
                  value:
                    itemId: b1f2c3d4-0000-0000-0000-000000000001
                    itemKind: GlobalProduct
                    canonicalCode: GP-000000000001
                    name: Amoksisilin 500mg Kapsül
                    lifecycleStatus: Active
                    contractVersion: v1.1
                item:
                  summary: "v1.1 — malzeme kalemi /products/{itemId} üzerinden"
                  value:
                    itemId: d4e5f6a7-0000-0000-0000-000000000003
                    itemKind: Item
                    canonicalCode: IT-000000000003
                    name: Amoksisilin trihidrat
                    materialType: ACTIVE_INGREDIENT
                    lifecycleStatus: Active
                    baseUomId: KGM
                    shelfLifeDays: 1825
                    retestDays: 365
                    minRemainingShelfLifeDays: null
                    storageCondition: AMBIENT_15_25
                    storageConditions: [AMBIENT_15_25, PROTECT_FROM_MOISTURE]
                    lotControlled: true
                    serialControlled: false
                    stockable: true
                    contractVersion: v1.1
        '404': { $ref: '#/components/responses/UnknownItem' }
  /skus/{skuId}:
    get:
      operationId: getSku
      summary: SKU (SkuId + SkuLevel → Gsku|Lsku|FinishedGood)
      description: "v1.1 — stok davranışı için YETKİLİ okuma. `level` `Item` da alır. level=Item: `skuId == itemId`, `canonicalCode` IT-…, `itemKind` Item; `packUomCode`, `marketCode`, `gtin` null, `packQuantity` dönmez (kalem ambalaj / pazar seviyesi taşımaz; kalem GTIN'i sonra). level=Lsku: seri takibi kendi alanı, diğer stok alanları okuma anında üst GSKU'dan (O-3), `gtin` null (O-6). level=FinishedGood: `gtin` satış kutusu GTIN'idir (İTS karekodundaki (01), D-1). Var olan ama başka seviyedeki kimlik 404 alır. Seviyeye göre dolum SkuRef açıklamasındaki tablodadır."
      parameters:
        - { name: skuId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: level, in: query, required: true, schema: { $ref: '#/components/schemas/SkuLevel' } }
      responses:
        '200':
          description: SKU
          content:
