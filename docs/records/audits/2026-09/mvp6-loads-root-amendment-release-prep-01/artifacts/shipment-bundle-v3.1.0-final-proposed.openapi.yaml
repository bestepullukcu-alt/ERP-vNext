      description: ' Normative Loads candidate: loads-semantics-v3.1.0.md. Publication HELD; D185-01..05 approved
        design only.'
    post:
      tags:
      - Loads
      operationId: createLoadPlan
      summary: Route ve load plan olustur
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: X-Tenant-Id
        in: header
        required: true
        description: 'Validation only: must match validated JWT claim; never selects scope.'
        schema:
          type: string
          format: uuid
      - name: X-Legal-Entity-Id
        in: header
        required: true
        description: 'Validation only: must match validated JWT claim; never selects scope.'
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLoadCommand'
            example:
              carrierId: 18400000-0000-0000-0000-000000000001
              shipmentIds:
              - 18300000-0000-0000-0000-000000000001
              mode: Road
              plannedDepartAt: '2026-09-20T08:00:00Z'
              stops:
              - sequence: 1
                locationReferenceId: wh-01
                action: Pickup
              - sequence: 2
                locationReferenceId: CUST-100/ADDR-2
                action: Delivery
      responses:
        '201':
          description: Load Draft durumunda olusturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadResponse'
              example:
                loadId: 18500000-0000-0000-0000-000000000001
                loadNumber: LOAD-18500000000000000000000000000001
                status: Draft
                idempotentReplay: false
                contractVersion: v1
          headers:
            X-Correlation-Id:
              required: true
              description: Current request correlation UUID; one fallback UUID for absent/invalid/ambiguous input.
                Success body remains unchanged.
              schema:
                type: string
                format: uuid
        '404':
          description: Loads-local application rejection. First failing phase in approved annex wins.
          headers:
            X-Correlation-Id:
              required: true
              description: Current request correlation UUID; one fallback UUID for absent/invalid/ambiguous input.
                Success body remains unchanged.
