openapi: 3.1.0
info:
  title: SHIPMENT-BUNDLE
  description: >
    MOD-0183 Shipment Tracking & POD, MOD-0184 Carrier Management, MOD-0185 Routing &
    Load Planning, MOD-0186 Reverse Logistics ve MOD-0187 Claims Management icin MVP-6
    owned, mock-ready frozen contract (v1). TenantId ve LegalEntityId sunucuda JWT
    baglamindan resolve edilir; request body icinde kabul edilmez. INVENTORY yalniz
    frozen INVENTORY contract'indan reference/availability olarak okunur; bu bundle
    shadow stock balance tutmaz. ASSUMPTION: lifecycle gecisleri optimistic concurrency
    yerine idempotent command + mevcut durum kontroluyle korunur. CONSUMES:
    WAREHOUSE-SHIPMENT-TRIGGER (merkez üretecek)
  version: 3.1.0
  x-status: FROZEN
  x-shipment-root-semantics: shipment-root-semantics-v3.0.0.md
  x-owner: [MOD-0183, MOD-0184, MOD-0185, MOD-0186, MOD-0187]
  x-consumes:
    - INVENTORY
    - "CONSUMES: WAREHOUSE-SHIPMENT-TRIGGER (merkez üretecek)"
  x-contract-version: v1
servers:
  - url: /api/shipment-bundle
security:
  - bearerAuth: []
tags:
  - { name: Shipments, description: MOD-0183 Shipment/POD SoR }
  - { name: Carriers, description: MOD-0184 Carrier SoR }
  - { name: Loads, description: MOD-0185 Routing/Load SoR }
  - { name: Returns, description: MOD-0186 Reverse Logistics SoR }
  - { name: Claims, description: MOD-0187 Claims SoR }
paths:
  /shipments:
    get:
      tags: [Shipments]
      operationId: queryShipments
      summary: Shipment listesi sorgula
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ShipmentStatus' } }
        - { name: sourceDocumentId, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Shipment listesi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentListResponse' }
              example:
                items:
                  - shipmentId: 18300000-0000-0000-0000-000000000001
                    shipmentNumber: SHP-2026-000001
                    sourceDocumentId: SO-900
                    status: Dispatched
                    carrierId: 18400000-0000-0000-0000-000000000001
                    loadId: 18500000-0000-0000-0000-000000000001
                    plannedShipAt: '2026-09-20T08:00:00Z'
                    plannedDeliverAt: '2026-09-21T16:00:00Z'
                    actualDeliverAt: null
                page: 1
                pageSize: 50
                total: 1
                contractVersion: v1
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Shipments]
      operationId: createShipment
      summary: Shipment olustur
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShipmentCommand' }
            example:
              sourceModule: MOD-0141
              sourceType: SALES_ORDER
              sourceDocumentId: SO-900
              warehouseReferenceId: wh-01
              shipToReference: CUST-100/ADDR-2
              plannedShipAt: '2026-09-20T08:00:00Z'
              plannedDeliverAt: '2026-09-21T16:00:00Z'
              lines:
                - lineNumber: '1'
                  itemId: b1f2c3d4-0000-0000-0000-000000000001
                  skuId: c3d4e5f6-0000-0000-0000-000000000002
                  quantity: '30.000'
                  uomId: EA
                  inventoryReferenceId: rsv-4001
      responses:
        '201':
          description: Shipment Draft durumunda olusturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentResponse' }
              example:
                shipmentId: 18300000-0000-0000-0000-000000000001
                shipmentNumber: SHP-2026-000001
                status: Draft
                idempotentReplay: false
                contractVersion: v1
        '200':
          description: Ayni Idempotency-Key icin orijinal sonuc
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentResponse' }
              example: { shipmentId: 18300000-0000-0000-0000-000000000001, shipmentNumber: SHP-2026-000001, status: Draft, idempotentReplay: true, contractVersion: v1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /shipments/{shipmentId}:
    get:
      tags: [Shipments]
      operationId: getShipment
      summary: Shipment ve POD gorunumunu getir
      parameters:
        - { $ref: '#/components/parameters/ShipmentId' }
        - { $ref: '#/components/parameters/CorrelationId' }
      responses:
        '200':
          description: Shipment detayi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentDetail' }
              example:
                shipmentId: 18300000-0000-0000-0000-000000000001
                shipmentNumber: SHP-2026-000001
                sourceModule: MOD-0141
                sourceType: SALES_ORDER
                sourceDocumentId: SO-900
                warehouseReferenceId: wh-01
                shipToReference: CUST-100/ADDR-2
                carrierId: 18400000-0000-0000-0000-000000000001
                loadId: 18500000-0000-0000-0000-000000000001
                status: Delivered
                plannedShipAt: '2026-09-20T08:00:00Z'
                plannedDeliverAt: '2026-09-21T16:00:00Z'
                actualDeliverAt: '2026-09-21T15:42:00Z'
                lifecycleCorrelationId: 18300000-0000-0000-0000-000000000001
                lines:
                  - { lineNumber: '1', itemId: b1f2c3d4-0000-0000-0000-000000000001, skuId: c3d4e5f6-0000-0000-0000-000000000002, quantity: '30.000', uomId: EA, inventoryReferenceId: rsv-4001 }
                pod: { recipientName: Ada Yilmaz, receivedAt: '2026-09-21T15:42:00Z', evidenceReferenceIds: [doc-pod-9001], note: Eksiksiz teslim }
                contractVersion: v1
        '404': { $ref: '#/components/responses/NotFound' }
  /shipments/{shipmentId}/transition:
    post:
      tags: [Shipments]
      operationId: transitionShipment
      summary: Shipment lifecycle durumunu ilerlet
      description: >
        Izinli gecisler: Draft->Planned|Cancelled; Planned->Dispatched|Cancelled;
        Dispatched->InTransit|Delivered|Exception; InTransit->Delivered|Exception;
        Exception->InTransit|Cancelled; Delivered->Closed. Diger gecisler
        INVALID_SHIPMENT_TRANSITION ile deterministik reddedilir.
      parameters:
        - { $ref: '#/components/parameters/ShipmentId' }
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionShipmentCommand' }
            example: { targetStatus: Dispatched, occurredAt: '2026-09-20T08:15:00Z', reasonCode: CARRIER_HANDOFF, note: Carrier scan alindi }
      responses:
        '200':
          description: Lifecycle gecisi uygulandi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentResponse' }
              example: { shipmentId: 18300000-0000-0000-0000-000000000001, shipmentNumber: SHP-2026-000001, status: Dispatched, idempotentReplay: false, contractVersion: v1 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /shipments/{shipmentId}/pod:
    post:
      tags: [Shipments]
      operationId: captureProofOfDelivery
      summary: Teslim kanitini kaydet ve shipment'i Delivered yap
      description: Yalniz Dispatched veya InTransit durumundan kabul edilir.
      parameters:
        - { $ref: '#/components/parameters/ShipmentId' }
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapturePodCommand' }
            example: { recipientName: Ada Yilmaz, receivedAt: '2026-09-21T15:42:00Z', evidenceReferenceIds: [doc-pod-9001], note: Eksiksiz teslim }
      responses:
        '201':
          description: POD kaydedildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PodResponse' }
              example: { podId: 18300000-0000-0000-0000-000000000099, shipmentId: 18300000-0000-0000-0000-000000000001, shipmentStatus: Delivered, receivedAt: '2026-09-21T15:42:00Z', idempotentReplay: false, contractVersion: v1 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /carriers:
    get:
      tags:
      - Carriers
      operationId: queryCarriers
      summary: Carrier listesi sorgula
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/CarrierStatus'
      responses:
        '200':
          description: Carrier listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierListResponse'
              example:
                items:
                - carrierId: 18400000-0000-0000-0000-000000000001
                  carrierCode: CARR-01
                  displayName: North Star Logistics
                  status: Active
                  supportedModes:
                  - Road
                total: 1
                contractVersion: v1
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CarrierResponseCorrelation'
        '400':
          $ref: '#/components/responses/CarrierQError400'
        '401':
          $ref: '#/components/responses/CarrierQError401'
        '403':
          $ref: '#/components/responses/CarrierQError403'
        '404':
          $ref: '#/components/responses/CarrierQError404'
        '500':
          $ref: '#/components/responses/CarrierQError500'
        '503':
          $ref: '#/components/responses/CarrierQError503'
      description: 'Carrier-only normative semantics: carrier-semantics-v1.1.0.md (CO-184-04-01 §§3–5 and CO-184-05-01
        §§6–7). Apply the annex first-failing-stage precedence, signed tenant/LE/actor context and exact operation
        permission. All application responses MUST include X-Correlation-Id: current valid request UUID (lowercase
        hyphenated), or one generated rejection trace UUID when missing/invalid/ambiguous. Nil UUID is valid. Transport/router/startup
        failures outside this operation are excluded; errors use Error, never an outer envelope.'
      x-normative-annex: carrier-semantics-v1.1.0.md
    post:
      tags:
      - Carriers
      operationId: createCarrier
      summary: Carrier olustur
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCarrierCommand'
            example:
              carrierCode: CARR-01
              displayName: North Star Logistics
              supportedModes:
              - Road
              externalReference: EXT-CARR-88
      responses:
        '201':
          description: Carrier olusturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierResponse'
              examples:
                first:
                  value:
                    carrierId: 18400000-0000-0000-0000-000000000001
                    carrierCode: CARR-01
                    status: Active
                    idempotentReplay: false
                    contractVersion: v1
                replay:
                  summary: Current response correlation is in header; original audit remains unchanged.
                  value:
                    carrierId: 18400000-0000-0000-0000-000000000001
                    carrierCode: CARR-01
                    status: Active
                    idempotentReplay: true
                    contractVersion: v1
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CarrierResponseCorrelation'
        '409':
          $ref: '#/components/responses/CarrierCError409'
        '422':
          $ref: '#/components/responses/CarrierCreateUnprocessable'
        '400':
          $ref: '#/components/responses/CarrierCError400'
        '401':
          $ref: '#/components/responses/CarrierCError401'
        '403':
          $ref: '#/components/responses/CarrierCError403'
        '404':
          $ref: '#/components/responses/CarrierCError404'
        '415':
          $ref: '#/components/responses/CarrierCError415'
        '500':
          $ref: '#/components/responses/CarrierCError500'
        '503':
          $ref: '#/components/responses/CarrierCError503'
      description: 'Carrier-only normative semantics: carrier-semantics-v1.1.0.md (CO-184-04-01 §§3–5 and CO-184-05-01
        §§6–7). Apply the annex first-failing-stage precedence, signed tenant/LE/actor context and exact operation
        permission. All application responses MUST include X-Correlation-Id: current valid request UUID (lowercase
        hyphenated), or one generated rejection trace UUID when missing/invalid/ambiguous. Nil UUID is valid. Transport/router/startup
        failures outside this operation are excluded; errors use Error, never an outer envelope. Durable replay is
        scoped by tenant, LE, operationId, target and exact parsed key; authorize and validate before lookup. The
        response header carries CURRENT request correlation; ORIGINAL committed correlation/actor remain in audit.
        Replay returns the original success snapshot with idempotentReplay=true and original HTTP status (create 201,
        status 200). No success-body fields are added. Different valid payload under a committed key returns 409 IDEMPOTENCY_KEY_REUSED.
        No receipt for failed requests, no TTL, no new mutation/audit on replay. Unknown commit uses 503 and same-key
        recovery.'
      x-normative-annex: carrier-semantics-v1.1.0.md
  /carriers/{carrierId}/status:
    post:
      tags:
      - Carriers
      operationId: changeCarrierStatus
      summary: Carrier durumunu degistir
      description: 'Active<->Suspended; Retired terminal durumdur. Carrier-only normative semantics: carrier-semantics-v1.1.0.md
        (CO-184-04-01 §§3–5 and CO-184-05-01 §§6–7). Apply the annex first-failing-stage precedence, signed tenant/LE/actor
        context and exact operation permission. All application responses MUST include X-Correlation-Id: current valid
        request UUID (lowercase hyphenated), or one generated rejection trace UUID when missing/invalid/ambiguous.
        Nil UUID is valid. Transport/router/startup failures outside this operation are excluded; errors use Error,
        never an outer envelope. Durable replay is scoped by tenant, LE, operationId, target and exact parsed key;
        authorize and validate before lookup. The response header carries CURRENT request correlation; ORIGINAL committed
        correlation/actor remain in audit. Replay returns the original success snapshot with idempotentReplay=true
        and original HTTP status (create 201, status 200). No success-body fields are added. Different valid payload
        under a committed key returns 409 IDEMPOTENCY_KEY_REUSED. No receipt for failed requests, no TTL, no new mutation/audit
        on replay. Unknown commit uses 503 and same-key recovery.'
      parameters:
      - name: carrierId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCarrierStatusCommand'
            example:
              targetStatus: Suspended
              reasonCode: COMPLIANCE_HOLD
      responses:
        '200':
          description: Carrier durumu degisti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierResponse'
              examples:
                first:
                  value:
                    carrierId: 18400000-0000-0000-0000-000000000001
                    carrierCode: CARR-01
                    status: Suspended
                    idempotentReplay: false
                    contractVersion: v1
                replay:
                  summary: Current response correlation is in header; original audit remains unchanged.
                  value:
                    carrierId: 18400000-0000-0000-0000-000000000001
                    carrierCode: CARR-01
                    status: Suspended
                    idempotentReplay: true
                    contractVersion: v1
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CarrierResponseCorrelation'
        '404':
          $ref: '#/components/responses/CarrierSError404'
        '422':
          $ref: '#/components/responses/CarrierSError422'
        '400':
          $ref: '#/components/responses/CarrierSError400'
        '401':
          $ref: '#/components/responses/CarrierSError401'
        '403':
          $ref: '#/components/responses/CarrierSError403'
        '409':
          $ref: '#/components/responses/CarrierSError409'
        '415':
          $ref: '#/components/responses/CarrierSError415'
        '500':
          $ref: '#/components/responses/CarrierSError500'
        '503':
          $ref: '#/components/responses/CarrierSError503'
      x-normative-annex: carrier-semantics-v1.1.0.md
  /loads:
    get:
      tags:
      - Loads
      operationId: queryLoads
      summary: Load planlarini sorgula
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/LoadStatus'
      - name: carrierId
        in: query
        schema:
          type: string
          format: uuid
      - name: X-Tenant-Id
        in: header
        required: true
        description: 'Validation only: must match validated JWT claim; never selects scope.'
        schema:
          type: string
          format: uuid
      - name: X-Legal-Entity-Id
        in: header
        required: true
        description: 'Validation only: must match validated JWT claim; never selects scope.'
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Load listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadListResponse'
              example:
                items:
                - loadId: 18500000-0000-0000-0000-000000000001
                  loadNumber: LOAD-18500000000000000000000000000001
                  carrierId: 18400000-0000-0000-0000-000000000001
                  shipmentIds:
                  - 18300000-0000-0000-0000-000000000001
                  status: Planned
                  lifecycleCorrelationId: 18500000-0000-0000-0000-0000000000aa
                total: 1
                contractVersion: v1
          headers:
            X-Correlation-Id:
              required: true
              description: Current request correlation UUID; one fallback UUID for absent/invalid/ambiguous input.
                Success body remains unchanged.
              schema:
                type: string
                format: uuid
        '400':
          description: Loads-local application rejection. First failing phase in approved annex wins.
          headers:
            X-Correlation-Id:
              required: true
              description: Current request correlation UUID; one fallback UUID for absent/invalid/ambiguous input.
                Success body remains unchanged.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_REQUEST:
                  summary: INVALID_REQUEST
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: Request rejected.
                      correlationId: aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa
                    contractVersion: v1
        '401':
          description: Loads-local application rejection. First failing phase in approved annex wins.
          headers:
            X-Correlation-Id:
              required: true
              description: Current request correlation UUID; one fallback UUID for absent/invalid/ambiguous input.
                Success body remains unchanged.
              schema:
                type: string
                format: uuid
            WWW-Authenticate:
              required: true
              schema:
                type: string
                const: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_REQUEST:
                  summary: INVALID_REQUEST
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: Request rejected.
                      correlationId: aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa
                    contractVersion: v1
        '403':
          description: Loads-local application rejection. First failing phase in approved annex wins.
          headers:
            X-Correlation-Id:
              required: true
              description: Current request correlation UUID; one fallback UUID for absent/invalid/ambiguous input.
                Success body remains unchanged.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_REQUEST:
                  summary: INVALID_REQUEST
                  value:
                    error:
                      code: INVALID_REQUEST
                      message: Request rejected.
                      correlationId: aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa
                    contractVersion: v1
        '404':
          description: Loads-local application rejection. First failing phase in approved annex wins.
          headers:
            X-Correlation-Id:
              required: true
              description: Current request correlation UUID; one fallback UUID for absent/invalid/ambiguous input.
                Success body remains unchanged.
