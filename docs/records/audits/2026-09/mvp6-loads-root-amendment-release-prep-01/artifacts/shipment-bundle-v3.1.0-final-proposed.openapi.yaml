                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INTERNAL_ERROR:
                  summary: INTERNAL_ERROR
                  value:
                    error:
                      code: INTERNAL_ERROR
                      message: Request rejected.
                      correlationId: aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa
                    contractVersion: v1
        '503':
          description: Loads-local application rejection. First failing phase in approved annex wins.
          headers:
            X-Correlation-Id:
              required: true
              description: Current request correlation UUID; one fallback UUID for absent/invalid/ambiguous input.
                Success body remains unchanged.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PERSISTENCE_UNAVAILABLE:
                  summary: PERSISTENCE_UNAVAILABLE
                  value:
                    error:
                      code: PERSISTENCE_UNAVAILABLE
                      message: Request rejected.
                      correlationId: aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa
                    contractVersion: v1
