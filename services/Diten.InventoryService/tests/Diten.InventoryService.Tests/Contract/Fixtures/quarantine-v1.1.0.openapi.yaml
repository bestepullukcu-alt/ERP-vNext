    SkuLevel: { type: string, enum: [Gsku, Lsku, FinishedGood, Item] }
    HoldSource: { type: string, enum: [GoodsReceipt, Production, CustomerReturn, Manual, Retest, Rework, OtherInbound] }
    HoldStatus: { type: string, enum: [Open, DecisionPending, Decided] }
    ReviewState: { type: string, enum: [Waiting, InReview] }
    DecisionKind: { type: string, enum: [HoldDecision, Disposition, Unblock, LotRelease] }
    LineDecision: { type: string, enum: [Release, Reject, Block] }
    DispositionKind: { type: string, enum: [Destroy, ReturnToSupplier, Rework, Sample] }
