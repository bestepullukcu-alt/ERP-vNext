openapi: 3.1.0
info:
  title: QUARANTINE-BUNDLE
  description: >
    MOD-0175 Quarantine / Blocked Stock — quality decision layer on top of the MOD-0173 ledger (quarantine states, release
    approvals, audit hooks; Blueprint 8.1 row 176). Frozen from the CT-accepted proposal drafts/quarantine-bundle-v1-proposal.md
    (WP-0175-Q1). MOD-0175 keeps no balance and defines no stock status and no movement type: every stock change is an
    INVENTORY-BUNDLE 1.0.1 movement (STATUS_TRANSFER, SCRAP, SUPPLIER_RETURN, LOCATION_TRANSFER) posted by the owner service after
    Workflow approval (DEC-INV-08, KQ-F); "Numune / Referans" is BLOCKED stock at a sample location (KQ-E). Tenant from the token,
    company from the W-0173-02 scope (X-Legal-Entity-Id validated against MDM); another company → 403 CROSS_LE_FORBIDDEN,
    another tenant → 404. Success bodies are the schemas below; failures are the INVENTORY Error schema.
  version: 1.1.0
  x-status: FROZEN
  x-owner: MOD-0175
  x-owner-service: Diten.InventoryService (MOD-0175, in-process with MOD-0173 / MOD-0174)
  x-changelog:
    - "1.0.0 — frozen by WP-0175-Q1 from the accepted proposal (2026-10-08). Reconciliations of the freeze (evidence §2): R-1 the envelope is the measured INVENTORY / TRACE wire (unwrapped success body, Error on failure) — proposal rule 3 names 'the shape used by INVENTORY / TRACE'; R-2 a bucket carries an optional lotId (a lot-controlled stock row cannot be addressed otherwise; quarantineStock keeps the top-level lotId for mode Retest); R-3 settings are the scope company's (contract rule 2; the scope middleware refuses a legalEntityId query member) — no legalEntityId request member; R-4 Decision.disposition shows the resolved sampleLocationId."
    - "1.1.0 — additive (WP-0174-ITEM; MOD-0173 PM1 CT acceptance O-PM1-1): SkuLevel gains Item (a material item that is its own SKU, skuId == itemId) — the same four values as INVENTORY-BUNDLE / TRACE-BUNDLE SkuLevel, so an Item-level bucket can be quarantined, blocked and decided and every hold / blocked / decision body carrying it stays valid. Nothing else changed: no path, parameter, property, type, required list, status code or other enum value; the qd-v1 signable field list is unchanged."
  x-decisions: [DEC-INV-08, KQ-A, KQ-B, KQ-C, KQ-D, KQ-E, KQ-F, KQ-G, KQ-H, KQ-I, CT-Q6, CT-Q8, CT-Q9]
servers: [{ url: /api/quarantine }]
security: [{ bearerAuth: [] }]
x-rules:
  - "Every write takes the Idempotency-Key header equal to body idempotencyKey (8–100). Same key + same body → the first result (200); same key + different body → 400 IDEMPOTENCY_KEY_REUSED."
  - "Mutable records (hold, blocked stock, settings, block reason) need If-Match W/\"<version>\" where stated; stale → 409 QUARANTINE_CONFLICT."
  - "No call moves stock directly except the no-workflow safety actions quarantineStock and blockStock. Every release / reject / block decision, disposition, unblock and lot release moves stock only after Workflow approval."
  - "Every command writes an audit row and a history entry. Signatures are MOD-0022 references only (signatureId)."
  - "Stock statuses and movement types are INVENTORY-BUNDLE values; this contract defines no new value of either."
x-permissions:
  owned: [quarantine.holds.read, quarantine.holds.create, quarantine.holds.review, quarantine.decisions.create, quarantine.decisions.withdraw, quarantine.decisions.apply, quarantine.blocked.dispose, quarantine.blocked.unblock, quarantine.blocked.block, quarantine.settings.manage]
  external: [platform.workflow.instances.start, platform.workflow.instances.view, platform.workflow.tasks.cancel, platform.workflow.definitions.manage, platform.workflow.definitions.publish, esign.signatures.sign, trace.lots.change-status]
paths:
  /holds:
    get:
      operationId: listHolds
      x-permission: quarantine.holds.read
      summary: "Quarantine queue — page + KPI cards. Side effect: read-time reconciliation of pending decisions (best effort, never fails the read)."
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: stockStatus, in: query, schema: { type: string, enum: [QUARANTINE, QUALITY_INSPECTION] } }
        - { name: source, in: query, schema: { $ref: '#/components/schemas/HoldSource' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/HoldStatus' } }
        - { name: reviewState, in: query, schema: { $ref: '#/components/schemas/ReviewState' } }
        - { name: lateOnly, in: query, schema: { type: boolean } }
        - { name: lotId, in: query, schema: { type: string } }
        - { name: sourceDocumentId, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: sort, in: query, schema: { type: string } }
      responses:
        '200': { description: Holds, content: { application/json: { schema: { $ref: '#/components/schemas/HoldList' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: quarantineStock
      x-permission: quarantine.holds.create
      summary: "Karantinaya Al (no workflow — safety direction). Posts STATUS_TRANSFER AVAILABLE→QUARANTINE per bucket (sourceType QUARANTINE_HOLD). mode Retest takes lotId and quarantines every AVAILABLE bucket of the lot; mode Manual takes explicit buckets."
      x-error-codes: [INVALID_REQUEST, REASON_REQUIRED, IDEMPOTENCY_KEY_REUSED, QUARANTINE_STOCK_RESERVED, QUARANTINE_NOTHING_AVAILABLE, QUARANTINE_SIGNATURE_REQUIRED, INSUFFICIENT_STOCK, LOT_BLOCKED, LOT_EXPIRED, LOT_RETEST_DUE, POSTING_PERIOD_CLOSED, UNKNOWN_LOCATION]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuarantineStockRequest' } } } }
      responses:
        '201': { description: Holds created, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HoldRef' } } } } }
        '200': { description: Replay, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HoldRef' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /holds/by-source:
    get:
      operationId: listHoldsBySource
      x-permission: quarantine.holds.read
      summary: "Holds of a source document (MOD-0142 GRN, MOD-0194), ≤ 200."
      parameters:
        - { name: sourceModule, in: query, required: true, schema: { type: string } }
        - { name: sourceDocumentId, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Holds, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/HoldRef' } } } } }
  /holds/{holdId}:
    get:
      operationId: getHold
      x-permission: quarantine.holds.read
      summary: "Hold detail (reconciles the active decision, best effort)."
      x-error-codes: [QUARANTINE_HOLD_NOT_FOUND]
      parameters: [{ $ref: '#/components/parameters/HoldId' }]
      responses:
        '200': { description: Hold, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/HoldDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateHold
      x-permission: quarantine.holds.review
      summary: "Analysis note / attachment references while the hold is open."
      x-error-codes: [QUARANTINE_HOLD_CLOSED, QUARANTINE_CONFLICT]
      parameters: [{ $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateHoldRequest' } } } }
      responses:
        '200': { description: Hold, content: { application/json: { schema: { $ref: '#/components/schemas/HoldDetail' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /holds/{holdId}/review:
    post:
      operationId: startReview
      x-permission: quarantine.holds.review
      summary: "İncelemeye al (no stock movement)."
      x-error-codes: [QUARANTINE_HOLD_CLOSED, QUARANTINE_CONFLICT, QUARANTINE_HOLD_NOT_FOUND]
      parameters: [{ $ref: '#/components/parameters/HoldId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewRequest' } } } }
      responses:
        '200': { description: Hold in review, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/HoldRef' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /decisions:
    post:
      operationId: createDecision
      x-permission: "quarantine.decisions.create (HoldDecision) | quarantine.blocked.dispose (Disposition) | quarantine.blocked.unblock (Unblock)"
      summary: "Draft decision — nothing moves. lines only for HoldDecision (1, or 2 when partial, KQ-A); disposition only for Disposition; Unblock uses reason only. LotRelease decisions are created by the lot gate only."
      x-error-codes: [INVALID_REQUEST, IDEMPOTENCY_KEY_REUSED, QUARANTINE_DECISION_INVALID, QUARANTINE_PARTIAL_SUM_MISMATCH, REASON_REQUIRED, QUARANTINE_COA_NOT_CONFIRMED, QUARANTINE_BLOCK_REASON_REQUIRED, QUARANTINE_RETEST_DATE_REQUIRED, LOT_DATES_INVALID, QUARANTINE_QUANTITY_INVALID, QUARANTINE_SUPPLIER_REQUIRED, QUARANTINE_DESTRUCTION_METHOD_REQUIRED, QUARANTINE_HOLD_NOT_FOUND, QUARANTINE_BLOCKED_NOT_FOUND, QUARANTINE_DECISION_ALREADY_PENDING, QUARANTINE_HOLD_CLOSED, QUARANTINE_BLOCKED_CLOSED, QUARANTINE_LOT_HELD, QUARANTINE_SAMPLE_LOCATION_NOT_SET, QUARANTINE_SAMPLE_LOCATION_INVALID, QUARANTINE_REVIEW_NOT_COMPLETED, QUARANTINE_STOCK_CHANGED]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DecisionRequest' } } } }
      responses:
        '201': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
        '200': { description: Replay, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /decisions/{decisionId}:
    get:
      operationId: getDecision
      x-permission: quarantine.holds.read
      x-error-codes: [QUARANTINE_DECISION_NOT_FOUND]
      parameters: [{ $ref: '#/components/parameters/DecisionId' }]
      responses:
        '200': { description: Decision, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /decisions/{decisionId}/submit:
    post:
      operationId: submitDecision
      x-permission: "the kind's key (as createDecision); caller = the decider"
      summary: "Starts the Workflow (template INV-QUARANTINE-RELEASE, objectType quarantine.decision, idempotencyKey quarantine:quarantine.decision:{decisionId}:r1). 202 PendingApproval; replay → same result. Nothing moves before approval."
      x-error-codes: [QUARANTINE_SIGNATURE_REQUIRED, QUARANTINE_SIGNATURE_MISMATCH, QUARANTINE_APPROVERS_NOT_CONFIGURED, QUARANTINE_WORKFLOW_TEMPLATE_MISSING, QUARANTINE_DECISION_NOT_DRAFT, QUARANTINE_STOCK_CHANGED, QUARANTINE_WORKFLOW_FORBIDDEN, QUARANTINE_WORKFLOW_REJECTED, QUARANTINE_WORKFLOW_UNAVAILABLE, QUARANTINE_NOT_DECIDER, QUARANTINE_DECISION_NOT_FOUND]
      parameters: [{ $ref: '#/components/parameters/DecisionId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubmitRequest' } } } }
      responses:
        '202': { description: Pending approval, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /decisions/{decisionId}/refresh:
    post:
      operationId: refreshDecision
      x-permission: quarantine.holds.read
      summary: "Durumu yenile — workflow instances/by-objects (+ history for the approver); a terminal outcome is applied. Idempotent."
      x-error-codes: [QUARANTINE_WORKFLOW_UNAVAILABLE, QUARANTINE_DECISION_NOT_FOUND]
      parameters: [{ $ref: '#/components/parameters/DecisionId' }]
      responses:
        '200': { description: Decision, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /decisions/{decisionId}/withdraw:
    post:
      operationId: withdrawDecision
      x-permission: quarantine.decisions.withdraw
      summary: "Kararı geri çek — decider only; cancels the open workflow task with the caller's token."
      x-error-codes: [QUARANTINE_NOT_DECIDER, QUARANTINE_DECISION_NOT_PENDING, REASON_REQUIRED]
      parameters: [{ $ref: '#/components/parameters/DecisionId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses:
        '200': { description: Withdrawn, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /decisions/{decisionId}/apply:
    post:
      operationId: reapplyDecision
      x-permission: quarantine.decisions.apply
      summary: "Yeniden uygula — only an ApplyFailed decision; re-runs the apply engine with the same ledger idempotency keys (quarantine:{decisionId}:{lineNo}), so a posted line is never posted twice."
      x-error-codes: [QUARANTINE_DECISION_NOT_APPLICABLE, QUARANTINE_DECISION_NOT_FOUND, INSUFFICIENT_STOCK, LOT_BLOCKED, LOT_EXPIRED, POSTING_PERIOD_CLOSED, UNKNOWN_LOCATION]
      parameters: [{ $ref: '#/components/parameters/DecisionId' }]
      responses:
        '200': { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /blocked:
    get:
      operationId: listBlocked
      x-permission: quarantine.holds.read
      summary: "Blocked stock. Includes virtual LotBlocked rows (blockedId null, allowedActions [Dispose:Destroy], CT-D4)."
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: blockReasonCode, in: query, schema: { type: string } }
        - { name: pendingOnly, in: query, schema: { type: boolean } }
        - { name: origin, in: query, schema: { $ref: '#/components/schemas/BlockedOrigin' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/BlockedStatus' } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Blocked stock, content: { application/json: { schema: { $ref: '#/components/schemas/BlockedList' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: blockStock
      x-permission: quarantine.blocked.block
      summary: "Stoğu bloke et (manual block, no workflow — safety direction). Posts STATUS_TRANSFER AVAILABLE→BLOCKED per bucket (sourceType QUARANTINE_BLOCK); origin ManualBlock, reviewed false."
      x-error-codes: [INVALID_REQUEST, REASON_REQUIRED, IDEMPOTENCY_KEY_REUSED, QUARANTINE_BLOCK_REASON_REQUIRED, QUARANTINE_STOCK_RESERVED, QUARANTINE_NOTHING_AVAILABLE, QUARANTINE_SIGNATURE_REQUIRED, INSUFFICIENT_STOCK, LOT_BLOCKED, LOT_EXPIRED, POSTING_PERIOD_CLOSED, UNKNOWN_LOCATION]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BlockStockRequest' } } } }
      responses:
        '201': { description: Blocked records created, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BlockedStockRef' } } } } }
        '200': { description: Replay, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BlockedStockRef' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /blocked/{blockedId}:
    get:
      operationId: getBlocked
      x-permission: quarantine.holds.read
      x-error-codes: [QUARANTINE_BLOCKED_NOT_FOUND]
      parameters: [{ $ref: '#/components/parameters/BlockedId' }]
      responses:
        '200': { description: Blocked record, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BlockedStockDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /blocked/{blockedId}/review-complete:
    post:
      operationId: completeBlockedReview
      x-permission: quarantine.holds.review
      summary: "İncelemeyi tamamla — reviewed = true (opens Unblock, V14)."
      x-error-codes: [QUARANTINE_BLOCKED_CLOSED, QUARANTINE_CONFLICT, REASON_REQUIRED, QUARANTINE_BLOCKED_NOT_FOUND]
      parameters: [{ $ref: '#/components/parameters/BlockedId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses:
        '200': { description: Reviewed, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BlockedStockRef' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /retest:
    get:
      operationId: listRetest
      x-permission: quarantine.holds.read
      summary: "Retest queue (KQ-H): lots with RetestDate < today + horizonDays and AVAILABLE stock."
      parameters:
        - { name: horizonDays, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
        - { name: state, in: query, schema: { type: string, enum: [Upcoming, DueClosed, Quarantined] } }
        - { name: warehouseId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Retest items, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RetestItem' } } } } }
  /settings:
    get:
      operationId: getSettings
      x-permission: quarantine.holds.read
      summary: "The scope company's settings (defaults at version 0 before the first save)."
      responses:
        '200': { description: Settings, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
    put:
      operationId: saveSettings
      x-permission: quarantine.settings.manage
      summary: "If-Match W/\"<version>\" (W/\"0\" before the first save). A member left out keeps its value."
      x-error-codes: [INVALID_REQUEST, QUARANTINE_SAMPLE_LOCATION_INVALID, QUARANTINE_CONFLICT]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SettingsRequest' } } } }
      responses:
        '200': { description: Settings, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/workflow-template:
    post:
      operationId: prepareWorkflowTemplate
      x-permission: "quarantine.settings.manage (+ the caller's platform.workflow.definitions.manage / publish)"
      summary: "Creates (DUPLICATE_TEMPLATE_CODE = already exists) and publishes the shipped INV-QUARANTINE-RELEASE JSON with the caller's token."
      x-error-codes: [QUARANTINE_WORKFLOW_FORBIDDEN, QUARANTINE_WORKFLOW_UNAVAILABLE]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KeyRequest' } } } }
      responses:
        '200': { description: Template, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowTemplateResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /block-reasons:
    get:
      operationId: listBlockReasons
      x-permission: quarantine.holds.read
      parameters: [{ name: activeOnly, in: query, schema: { type: boolean } }]
      responses:
        '200': { description: Block reasons, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BlockReason' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createBlockReason
      x-permission: quarantine.settings.manage
      x-error-codes: [INVALID_REQUEST, QUARANTINE_BLOCK_REASON_LANGUAGE_MISSING, QUARANTINE_BLOCK_REASON_EXISTS]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BlockReasonRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/BlockReason' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /block-reasons/{code}:
    put:
      operationId: updateBlockReason
      x-permission: quarantine.settings.manage
      summary: "Names / active flag; the code never changes. Deactivating a used code → 409 QUARANTINE_BLOCK_REASON_IN_USE."
      x-error-codes: [INVALID_REQUEST, QUARANTINE_BLOCK_REASON_LANGUAGE_MISSING, QUARANTINE_BLOCK_REASON_IN_USE, QUARANTINE_CONFLICT]
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BlockReasonRequest' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/BlockReason' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /lots/{lotId}/quality-status:
    get:
      operationId: getLotQualityStatus
      x-permission: quarantine.holds.read
      summary: "Consumers 0142 / 0176 / 0177 and the Lot pages."
      x-error-codes: [UNKNOWN_LOT]
      parameters: [{ name: lotId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Lot quality status, content: { application/json: { schema: { $ref: '#/components/schemas/LotQualityStatus' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /esign-subjects/{subjectType}/{subjectId}:
    get:
      operationId: getSignableSubject
      x-permission: "quarantine.holds.read (the signer's JWT; the company must match the decision's)"
      summary: "Called by Platform (MOD-0022 ESIGN §6). subjectType ∈ {quarantine.decision}; field list qd-v1."
      parameters:
        - { name: subjectType, in: path, required: true, schema: { type: string, enum: [quarantine.decision] } }
        - { name: subjectId, in: path, required: true, schema: { type: string } }
      responses:
