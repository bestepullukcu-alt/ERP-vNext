x-lot-release-gate: "KQ-I has no path here: TRACE POST /api/trace/lots/{lotId}/status answers 202 PendingApproval { lotId, pendingRequestId, contractVersion } (TRACE 1.2.0); pendingRequestId = the QUARANTINE decisionId (kind LotRelease, state Draft); the requester then calls submitDecision."
x-state-machine:
  - "Draft --submit--> Submitted --workflow accepted--> PendingApproval"
  - "Submitted --start error--> StartFailed --submit (same key)--> Submitted"
  - "PendingApproval --approved--> Approved --apply ok--> Applied | --apply error--> ApplyFailed --apply--> Applied | --approver == decider & fourEyes--> FourEyesViolation"
  - "PendingApproval --rejected / cancelled / timed-out--> Rejected / Cancelled / TimedOut; --withdraw--> Withdrawn; Draft --24 h--> Withdrawn"
  - "Terminal: Applied, Rejected, Cancelled, TimedOut, Withdrawn, FourEyesViolation. On every terminal state except Applied the hold / blocked record is reopened. No movement is posted before Approved."
x-events:
  consumed: "platform.workflow.instance.completed.v1 (MOD-0023), objectType quarantine.decision; inbox quarantine_event_inbox (_id = eventId); applied only if the instance id equals the decision's; transport only when Eventing:Transport = RabbitMQ; read-time reconciliation is the guaranteed path."
  published: "none in v1 (consumers read getLotQualityStatus / listHoldsBySource)."
