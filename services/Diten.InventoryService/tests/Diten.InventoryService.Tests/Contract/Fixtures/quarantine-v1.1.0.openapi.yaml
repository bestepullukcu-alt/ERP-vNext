        blockedAtUtc: { type: string, format: date-time }
        origin: { $ref: '#/components/schemas/BlockedOrigin' }
        originRef: { $ref: '#/components/schemas/OriginRef' }
        pendingDisposition: { type: boolean }
        reviewed: { type: boolean }
        status: { $ref: '#/components/schemas/BlockedStatus' }
        allowedActions: { type: array, items: { $ref: '#/components/schemas/AllowedAction' } }
        activeDecision: { $ref: '#/components/schemas/ActiveDecision' }
        version: { type: integer, minimum: 0 }
        history: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
        movements: { type: array, items: { $ref: '#/components/schemas/MovementLink' } }
        decisions: { type: array, items: { $ref: '#/components/schemas/DecisionRef' } }
    BlockedList:
      type: object
      required: [items, total]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/BlockedStockRef' } }, total: { type: integer, minimum: 0 } }
    RetestItem:
      type: object
      required: [lotId, item, retestDate, daysRelative, state, availableQuantity, baseUom, buckets, holdIds]
      properties:
        lotId: { type: string }
        lotNumber: { type: string }
        item: { $ref: '#/components/schemas/ItemRef' }
        retestDate: { type: string, format: date-time }
        daysRelative: { type: integer }
        state: { type: string, enum: [Upcoming, DueClosed, Quarantined] }
        availableQuantity: { type: number, minimum: 0 }
        baseUom: { $ref: '#/components/schemas/UomRef' }
        buckets:
          type: array
          items: { type: object, required: [warehouseId, locationId, quantity], properties: { warehouseId: { type: string }, locationId: { type: string }, quantity: { type: number } } }
        holdIds: { type: array, items: { type: string, format: uuid } }
    WorkflowTemplate:
      type: object
      required: [code, status]
      properties: { code: { type: string, enum: [INV-QUARANTINE-RELEASE] }, publishedVersion: { type: integer }, status: { type: string, enum: [Published, Missing] } }
    Settings:
      type: object
      required: [waitTargetDays, fourEyes, approverCandidates, sampleLocations, lotReleaseRequiresApproval, reconcileAfterSeconds, version]
      properties:
        legalEntityId: { type: string, format: uuid }
        waitTargetDays: { type: integer, minimum: 1, maximum: 60 }
        fourEyes: { type: boolean }
        approverCandidates: { type: array, maxItems: 10, items: { type: string, pattern: '^(position|user):' } }
        sampleLocations: { type: object, description: "warehouseId → sample locationId (KQ-E)", additionalProperties: { type: string } }
        lotReleaseRequiresApproval: { type: boolean }
        reconcileAfterSeconds: { type: integer, minimum: 0 }
        workflowTemplate: { $ref: '#/components/schemas/WorkflowTemplate' }
        version: { type: integer, minimum: 0 }
    SettingsRequest:
      type: object
      description: "Settings without workflowTemplate / version / legalEntityId (R-3: the scope company). A member left out keeps its value."
      properties:
        waitTargetDays: { type: integer, minimum: 1, maximum: 60 }
        fourEyes: { type: boolean }
        approverCandidates: { type: array, minItems: 1, maxItems: 10, items: { type: string, pattern: '^(position|user):' } }
        sampleLocations: { type: object, additionalProperties: { type: string, format: uuid } }
        lotReleaseRequiresApproval: { type: boolean }
        reconcileAfterSeconds: { type: integer, minimum: 0 }
    WorkflowTemplateResult:
      type: object
      required: [code, templateId, publishedVersion, created]
      properties: { code: { type: string }, templateId: { type: string }, publishedVersion: { type: integer }, created: { type: boolean } }
    LanguageNames:
      type: object
      description: "The seven tenant languages (CT-Q8)."
      required: [en, tr, fr, es, zh, ar, ru]
      properties: { en: { type: string }, tr: { type: string }, fr: { type: string }, es: { type: string }, zh: { type: string }, ar: { type: string }, ru: { type: string } }
    BlockReason:
      type: object
      required: [code, names, isActive, isLocked]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        names: { $ref: '#/components/schemas/LanguageNames' }
        isActive: { type: boolean }
        isLocked: { type: boolean }
    BlockReasonRequest:
      type: object
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        names: { $ref: '#/components/schemas/LanguageNames' }
        isActive: { type: boolean }
    LotQualityStatus:
      type: object
      required: [lotId, retestDue, quarantinedQuantity, qualityInspectionQuantity, blockedQuantity, openHolds, openBlocked]
      properties:
        lotId: { type: string }
        retestDue: { type: boolean }
        quarantinedQuantity: { type: number }
        qualityInspectionQuantity: { type: number }
        blockedQuantity: { type: number }
        openHolds: { type: array, items: { $ref: '#/components/schemas/HoldRef' } }
        openBlocked: { type: array, items: { $ref: '#/components/schemas/BlockedStockRef' } }
        pendingLotRelease: { type: object, required: [decisionId, decisionNumber], properties: { decisionId: { type: string, format: uuid }, decisionNumber: { type: string } } }
    SignableSubject:
      type: object
      description: "ESIGN-BUNDLE §6 subject, subjectType quarantine.decision, field list qd-v1. Every fields key is always present (null when not applicable); values are strings (decimals invariant culture, dates UTC 'O', booleans true/false). Field names are frozen; a change is a new subjectVersion."
      required: [display, summary, legalEntityId, fields]
      properties:
        display: { type: string }
        summary: { type: array, maxItems: 20, items: { type: object, required: [label, value], properties: { label: { type: string }, value: { type: string } } } }
        legalEntityId: { type: string, format: uuid }
        fields:
          type: object
          required: [subjectVersion, decisionNumber, decisionKind, holdNumber, blockedNumber, legalEntityId, itemId, skuId, skuCode, lotId, lotNumber, warehouseCode, locationCode, fromStockStatus, line1.decision, line1.quantity, line1.toStockStatus, line2.decision, line2.quantity, line2.toStockStatus, baseUom, blockReasonCode, reason, coaChecked, coaReference, dispositionKind, dispositionQuantity, supplierId, returnDocumentNo, destructionMethod, destructionDate, sampleLocationCode, newRetestDate, lotStatusTarget, deciderUserId]
          additionalProperties: false
          properties:
            subjectVersion: { type: string, enum: [qd-v1] }
            decisionNumber: { type: [string, 'null'] }
            decisionKind: { type: [string, 'null'] }
            holdNumber: { type: [string, 'null'] }
            blockedNumber: { type: [string, 'null'] }
            legalEntityId: { type: [string, 'null'] }
            itemId: { type: [string, 'null'] }
            skuId: { type: [string, 'null'] }
            skuCode: { type: [string, 'null'] }
            lotId: { type: [string, 'null'] }
            lotNumber: { type: [string, 'null'] }
            warehouseCode: { type: [string, 'null'] }
            locationCode: { type: [string, 'null'] }
            fromStockStatus: { type: [string, 'null'] }
            line1.decision: { type: [string, 'null'] }
            line1.quantity: { type: [string, 'null'] }
            line1.toStockStatus: { type: [string, 'null'] }
            line2.decision: { type: [string, 'null'] }
            line2.quantity: { type: [string, 'null'] }
            line2.toStockStatus: { type: [string, 'null'] }
            baseUom: { type: [string, 'null'] }
            blockReasonCode: { type: [string, 'null'] }
            reason: { type: [string, 'null'] }
            coaChecked: { type: [string, 'null'] }
            coaReference: { type: [string, 'null'] }
            dispositionKind: { type: [string, 'null'] }
            dispositionQuantity: { type: [string, 'null'] }
            supplierId: { type: [string, 'null'] }
            returnDocumentNo: { type: [string, 'null'] }
            destructionMethod: { type: [string, 'null'] }
            destructionDate: { type: [string, 'null'] }
            sampleLocationCode: { type: [string, 'null'] }
            newRetestDate: { type: [string, 'null'] }
            lotStatusTarget: { type: [string, 'null'] }
            deciderUserId: { type: [string, 'null'] }
    ReservationLine:
      type: object
      description: "One entry of QUARANTINE_STOCK_RESERVED error.details.reservations (CT-Q6)."
      required: [reservationId, sourceModule, remainingQuantity]
      properties: { reservationId: { type: string, format: uuid }, sourceModule: { type: string }, sourceDocumentId: { type: string }, remainingQuantity: { type: number } }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            correlationId: { type: string }
        contractVersion: { type: string }
  responses:
    BadRequest: { description: Malformed request or a shape / rule code, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Missing key / other company (CROSS_LE_FORBIDDEN) / not the decider, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Unknown or another tenant's record, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: A state / version / stock rule refused (see x-error-codes), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable: { description: A ledger rule refused the movement (INVENTORY code passed through), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unavailable: { description: Platform workflow unreachable (QUARANTINE_WORKFLOW_UNAVAILABLE), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
