        '200': { description: History, content: { application/json: { schema: { $ref: '#/components/schemas/SettingsHistoryPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /settings/pending-change:
    post:
      operationId: prepareSettingsChange
      summary: "R4 — prepares a signed settings change when the tenant's policy requires a signature (CT-R16)."
      x-permission: recall.settings.manage
      x-error-codes: [INVALID_REQUEST, REASON_REQUIRED, IDEMPOTENCY_KEY_REUSED, RECALL_SETTINGS_INVALID, RECALL_NO_CHANGES, RECALL_CONFLICT, CROSS_LE_FORBIDDEN]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotencyKey, drillTargetHours, drillFrequencyWarningDays, effectivenessTargetPercent, traceMaxDepth, traceMaxNodes, reason]
              properties:
                idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
                drillTargetHours: { type: integer, minimum: 1, maximum: 72 }
                drillFrequencyWarningDays: { type: integer, minimum: 30, maximum: 730 }
                effectivenessTargetPercent: { $ref: '#/components/schemas/EffectivenessTargets' }
                traceMaxDepth: { type: integer, minimum: 2, maximum: 50 }
                traceMaxNodes: { type: integer, minimum: 100, maximum: 20000 }
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '200': { description: Prepared, content: { application/json: { schema: { $ref: '#/components/schemas/PendingActionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /esign-subjects/{subjectType}/{subjectId}:
    get:
      operationId: getSignableSubject
      summary: "MOD-0022 subject provider (R4) — recall.case (rc-v1), recall.drill-run (dr-v1), recall.settings-change (rs-v1); every refusal is 404."
      description: "1.4.0 (O-R5-2, CT decision 2026-10-14) — the key depends on the subject type (x-permission-by-subject-type): recall.case and recall.settings-change need recall.cases.read; recall.drill-run needs recall.cases.read OR recall.drills.read. x-permission keeps the 1.3.0 value (recall.cases.read always suffices). A missing key is the same 404 RECALL_SUBJECT_NOT_FOUND as every refusal."
      x-permission: recall.cases.read
      x-permission-by-subject-type:
        recall.case: [recall.cases.read]
        recall.settings-change: [recall.cases.read]
        recall.drill-run: [recall.cases.read, recall.drills.read]
      x-error-codes: [RECALL_SUBJECT_NOT_FOUND]
      parameters:
        - { name: subjectType, in: path, required: true, schema: { type: string, enum: [recall.case, recall.drill-run, recall.settings-change] } }
        - { name: subjectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Subject, content: { application/json: { schema: { $ref: '#/components/schemas/SignableSubject' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
x-error-codes:
  RECALL_SETTINGS_INVALID: 400
  RECALL_SCOPE_EXCLUSION_REASON_REQUIRED: 400
  RECALL_SCOPE_ITEM_NOT_MARKABLE: 400
  RECALL_SIGNATURE_REQUIRED: 400
  RECALL_OPEN_QUANTITY_ACCEPTANCE_REQUIRED: 400
  RECALL_EVIDENCE_RANGE_INVALID: 400
  RECALL_UNKNOWN_CUSTOMER: 404
  RECALL_CASE_NOT_FOUND: 404
  RECALL_SUBJECT_NOT_FOUND: 404
  RECALL_DRILL_NOT_FOUND: 404
  RECALL_EVIDENCE_EXPORT_NOT_FOUND: 404
  RECALL_CONFLICT: 409
  RECALL_INVALID_TRANSITION: 409
  RECALL_CASE_ALREADY_OPEN: 409
  RECALL_SCOPE_CHANGED: 409
  RECALL_SOD_VIOLATION: 409
  RECALL_SIGNATURE_MISMATCH: 409
  RECALL_PENDING_ACTION_MISMATCH: 409
  RECALL_NO_CHANGES: 409
  RECALL_SCOPE_ITEM_EXISTS: 409
  RECALL_QUARANTINE_REQUEST_EXISTS: 409
  RECALL_QUARANTINE_REQUEST_NOT_RETRYABLE: 409
  RECALL_RETURN_ALREADY_LINKED: 409
  RECALL_DRILL_ALREADY_RUNNING: 409
  RECALL_DRILL_STEP_ORDER: 409
  RECALL_RETURN_NOT_ELIGIBLE: 422
  RECALL_RETURN_NOT_QUARANTINED: 422
  RECALL_SEGREGATION_NOT_HELD: 422
  RECALL_QUANTITY_EXCEEDS_SHIPPED: 422
  RECALL_DRILL_NO_CANDIDATE: 422
  shared: [INVALID_REQUEST, REASON_REQUIRED, IDEMPOTENCY_KEY_REUSED, UNKNOWN_LOT, UNKNOWN_LOCATION, CROSS_LE_FORBIDDEN]
  owned-by-INVENTORY-1.4.0: [LOT_UNDER_RECALL]
x-state-machine:
  - "Draft ──submitScope──▶ PendingScopeApproval ──approveScope(+sig)──▶ Active ──startEffectivenessCheck──▶ EffectivenessCheck"
  - "PendingScopeApproval ──returnScope──▶ Draft"
  - "EffectivenessCheck ──completeEffectivenessCheck(+sig)──▶ (completed) ──closeCase(+sig)──▶ Closed"
  - "Draft | PendingScopeApproval ──cancelCase──▶ Cancelled"
  - "Active ──reviseScope──▶ revision r+1 pending approval (case stays Active; R3 per 1.1.0 R2-4, CT-R5)"
  - "Four-eyes (CT-R1): approver ≠ scope submitter; closer ≠ effectiveness completer."
  - "Active + pendingRevision ──approveScope(+sig)──▶ Active (1.2.0: the delta approved; its blocks and quarantine requests added, no block removed)"
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string }, description: 'W/"<version>" or "<version>"' }
    CaseId: { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 25 } }
  headers:
    ETag: { schema: { type: string, pattern: '^W/"\d+"$' } }
  schemas:
    SkuLevel: { type: string, enum: [Gsku, Lsku, FinishedGood, Item] }
    StockStatus: { type: string, enum: [AVAILABLE, QUALITY_INSPECTION, QUARANTINE, BLOCKED, IN_TRANSIT, DAMAGED, EXPIRED] }
    CaseStatus: { type: string, enum: [Draft, PendingScopeApproval, Active, EffectivenessCheck, Closed, Cancelled] }
    RecallLevel: { type: string, enum: [Wholesale, Pharmacy, Patient] }
    TraceDirection: { type: string, enum: [Backward, Forward, Both] }
    ScopeItemKind: { type: string, enum: [Lot, Stock, Shipment] }
    NotificationChannel: { type: string, enum: [Phone, ExternalEmail, Fax, InPerson, Other] }
    PendingActionKind: { type: string, enum: [ApproveScope, CompleteEffectiveness, Close] }
    CaseEventKind: { type: string, enum: [Opened, ScopeItemsAdded, ScopeMarked, ScopeSubmitted, ScopeReturned, ScopeApproved, SegregationConfirmed, CustomerNotified, ConsumptionDeclared, EffectivenessStarted, EffectivenessCompleted, Closed, Cancelled, TraceRun, OutOfScopeFinding, QuarantineRequested, QuarantineFailed, QuarantineRetried, ExitRefused, ReturnLinked, ScopeRevised], description: "R1 kinds + R2 (TraceRun, OutOfScopeFinding) + R3 (QuarantineRequested … ScopeRevised); later slices add kinds (additive)." }
    DrillRunStatus: { type: string, enum: [Running, Completed, Cancelled] }
    DrillStep: { type: string, enum: [Trace, Scope, CustomerList] }
    UserRef:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string, description: "1.8.0 (additive, optional) — the name at the time of the action for the person who did it (stored ActorName, else the central audit queue name of the same correlation and user); absent when not recorded, and for an assigned person (DrillPlan.owner)" }
    UserAt:
      type: object
      required: [userId, atUtc]
      properties:
        userId: { type: string, format: uuid }
        atUtc: { type: string, format: date-time }
        name: { type: string, description: "1.8.0 (additive, optional) — the name at the time of the action (stored ActorName, else the central audit queue name of the same correlation and user); absent when not recorded" }
    LotRef:
      type: object
      required: [lotId, lotNumber]
      properties:
        lotId: { type: string }
        lotNumber: { type: string }
    ItemRef:
      type: object
      required: [itemId, skuId, skuLevel]
      properties:
        itemId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        skuLevel: { $ref: '#/components/schemas/SkuLevel' }
    Quantity:
      type: object
      required: [skuId, baseUomId, quantity]
      properties:
        skuId: { type: string, format: uuid }
        baseUomId: { type: string }
        quantity: { type: number }
    Progress:
      type: object
      required: [skuId, baseUomId, returned, shipped, percent]
      properties:
        skuId: { type: string, format: uuid }
        baseUomId: { type: string }
        returned: { type: number }
        shipped: { type: number }
        percent: { type: number }
    EffectivenessTargets:
      type: object
      additionalProperties: false
      required: ['1', '2', '3']
      properties:
        '1': { type: number, minimum: 0, maximum: 100 }
        '2': { type: number, minimum: 0, maximum: 100 }
        '3': { type: number, minimum: 0, maximum: 100 }
    RecallSettings:
      type: object
      required: [legalEntityId, isDefault, drillTargetHours, drillFrequencyWarningDays, effectivenessTargetPercent, traceMaxDepth, traceMaxNodes, version]
      properties:
        legalEntityId: { type: string, format: uuid }
        isDefault: { type: boolean }
        drillTargetHours: { type: integer }
        drillFrequencyWarningDays: { type: integer }
        effectivenessTargetPercent: { $ref: '#/components/schemas/EffectivenessTargets' }
        traceMaxDepth: { type: integer }
        traceMaxNodes: { type: integer }
        updatedAtUtc: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/UserRef' }
        version: { type: integer }
    SettingsHistoryEntry:
      type: object
      required: [field, reason, changedBy, changedAtUtc, settingsVersion]
      properties:
        field: { type: string }
        oldValue: { type: string }
        newValue: { type: string }
        reason: { type: string }
        changedBy: { $ref: '#/components/schemas/UserRef' }
        changedAtUtc: { type: string, format: date-time }
        settingsVersion: { type: integer }
        signatureId: { type: string }
    SettingsHistoryPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SettingsHistoryEntry' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    DrillResult:
      type: object
      required: [passed, durationMinutes]
      properties:
        passed: { type: boolean }
        durationMinutes: { type: integer }
    CaseRef:
      type: object
      required: [caseId, number, type, status, class, level, item, rootLot, openedAtUtc, owner, affectedQuantity, progress, version]
      properties:
        caseId: { type: string, format: uuid }
        number: { type: string, pattern: '^RC-\d{4}-(\d{4}|D\d{3})$' }
        type: { type: string, enum: [Real, Drill] }
        status: { $ref: '#/components/schemas/CaseStatus' }
        class: { type: integer, minimum: 1, maximum: 3 }
        level: { $ref: '#/components/schemas/RecallLevel' }
        item: { $ref: '#/components/schemas/ItemRef' }
        rootLot: { $ref: '#/components/schemas/LotRef' }
        openedAtUtc: { type: string, format: date-time }
        owner: { $ref: '#/components/schemas/UserRef' }
        affectedQuantity: { type: array, items: { $ref: '#/components/schemas/Quantity' } }
        progress: { type: array, items: { $ref: '#/components/schemas/Progress' } }
        drillResult: { $ref: '#/components/schemas/DrillResult' }
        version: { type: integer }
        sortAt: { type: string, format: date-time, description: "1.5.0 — the row's sort time (openedAtUtc) in the union page" }
        position: { type: integer, minimum: 0, description: "1.5.0 — the row's 0-based place in the merged page (cases + drill rows)" }
    CasePage:
      type: object
      required: [items, total, page, pageSize, statusCounts]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CaseRef' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        statusCounts: { type: object, additionalProperties: { type: integer } }
        drillRows: { type: array, items: { $ref: '#/components/schemas/DrillCaseRow' }, description: "1.5.0 — the drill runs of this page (a drill run is not a case)" }
        drillStatusCounts: { type: object, additionalProperties: { type: integer }, description: "1.5.0 — DrillRunStatus chip counts under the other filters" }
    DrillCaseRow:
      type: object
      description: "1.5.0 (R6, CT decision A, pack §8.10) — a drill run as a Vakalar row. Not a case: no class, no level (mockup difference D-25)."
      required: [runId, number, type, status, lot, startedAtUtc, owner, targetHours, sortAt, position, version]
      additionalProperties: false
      properties:
        runId: { type: string, format: uuid }
        number: { type: string, pattern: '^RC-\d{4}-D\d{3}$' }
        type: { type: string, enum: [Drill] }
        status: { $ref: '#/components/schemas/DrillRunStatus' }
        lot: { $ref: '#/components/schemas/LotRef' }
        item: { $ref: '#/components/schemas/ItemRef' }
        startedAtUtc: { type: string, format: date-time }
        endedAtUtc: { type: string, format: date-time }
        owner: { $ref: '#/components/schemas/UserRef' }
        durationMinutes: { type: integer }
        targetHours: { type: integer }
        passed: { type: boolean }
        sortAt: { type: string, format: date-time }
        position: { type: integer, minimum: 0 }
        version: { type: integer }
    PendingRevision:
      type: object
      description: "1.2.0 (CT-R5) — a revision r+1 whose delta waits for its signed approval; the case stays Active."
      required: [revision, reason, addedNodeKeys, revisedBy]
      properties:
        revision: { type: integer }
        reason: { type: string }
        addedNodeKeys: { type: array, items: { type: string } }
        revisedBy: { $ref: '#/components/schemas/UserAt' }
    ScopeSeal:
      type: object
      required: [revision, sha256, canonicalVersion, itemCount, computedAtUtc]
      properties:
        revision: { type: integer }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        canonicalVersion: { type: string }
        itemCount: { type: integer }
        computedAtUtc: { type: string, format: date-time }
    PendingAction:
      type: object
      required: [action, setBy, expiresAtUtc]
      properties:
        action: { $ref: '#/components/schemas/PendingActionKind' }
        setBy: { $ref: '#/components/schemas/UserRef' }
        expiresAtUtc: { type: string, format: date-time }
    EffectivenessRow:
      type: object
      required: [skuId, baseUomId, shipped, returned, consumed, open, percent, met, notified]
      properties:
        customerRef: { type: string, description: "absent on a total row" }
        skuId: { type: string, format: uuid }
        baseUomId: { type: string }
        shipped: { type: number }
        returned: { type: number }
        consumed: { type: number }
        open: { type: number }
        percent: { type: number }
        met: { type: boolean }
        notified: { type: boolean }
    Effectiveness:
      type: object
      required: [class, targetPercent, rows, totals, computedAtUtc]
      properties:
        class: { type: integer }
        targetPercent: { type: number }
        rows: { type: array, items: { $ref: '#/components/schemas/EffectivenessRow' } }
        totals: { type: array, items: { $ref: '#/components/schemas/EffectivenessRow' } }
        computedAtUtc: { type: string, format: date-time }
        source: { type: string, enum: [Live, Stored], description: "1.6.0 — getCaseEffectiveness: Live until completed, then Stored" }
    Closure:
      type: object
      required: [summary, closedBy]
      properties:
        summary: { type: string }
        openQuantityAcceptance: { type: string }
        closedBy: { $ref: '#/components/schemas/UserAt' }
        signatureId: { type: string }
    Cancellation:
      type: object
      required: [reason, cancelledBy]
      properties:
        reason: { type: string }
        cancelledBy: { $ref: '#/components/schemas/UserAt' }
    CaseCounts:
      type: object
      required: [scopeItems, excludedItems, customers, notified, consumptionDeclarations, segregations]
      properties:
        scopeItems: { type: integer }
        excludedItems: { type: integer }
        customers: { type: integer }
        notified: { type: integer }
        consumptionDeclarations: { type: integer }
        segregations: { type: integer }
    CaseDetail:
      type: object
      required: [caseId, number, type, status, class, level, item, rootLot, openedAtUtc, owner, affectedQuantity, progress, version, reason, direction, scopeRevision, counts]
      properties:
        caseId: { type: string, format: uuid }
        number: { type: string, pattern: '^RC-\d{4}-\d{4}$' }
        type: { type: string, enum: [Real] }
        status: { $ref: '#/components/schemas/CaseStatus' }
        class: { type: integer, minimum: 1, maximum: 3 }
        level: { $ref: '#/components/schemas/RecallLevel' }
        item: { $ref: '#/components/schemas/ItemRef' }
        rootLot: { $ref: '#/components/schemas/LotRef' }
        openedAtUtc: { type: string, format: date-time }
        owner: { $ref: '#/components/schemas/UserRef' }
        affectedQuantity: { type: array, items: { $ref: '#/components/schemas/Quantity' } }
        progress: { type: array, items: { $ref: '#/components/schemas/Progress' } }
        version: { type: integer }
        reason: { type: string }
        reasonReference: { type: string }
        direction: { $ref: '#/components/schemas/TraceDirection' }
        scopeRevision: { type: integer }
        submittedScope: { $ref: '#/components/schemas/ScopeSeal' }
        approvedScope: { $ref: '#/components/schemas/ScopeSeal' }
        submittedSnapshot: { $ref: '#/components/schemas/SnapshotRef' }
        approvedSnapshot: { $ref: '#/components/schemas/SnapshotRef' }
        pendingRevision: { $ref: '#/components/schemas/PendingRevision' }
        scopeSubmittedBy: { $ref: '#/components/schemas/UserAt' }
        scopeApprovedBy: { $ref: '#/components/schemas/UserAt' }
        scopeApprovalSignatureId: { type: string }
        effectivenessStartedAtUtc: { type: string, format: date-time }
        effectiveness: { $ref: '#/components/schemas/Effectiveness' }
        effectivenessCompletedBy: { $ref: '#/components/schemas/UserAt' }
        effectivenessSignatureId: { type: string }
        closure: { $ref: '#/components/schemas/Closure' }
        cancellation: { $ref: '#/components/schemas/Cancellation' }
        pendingAction: { $ref: '#/components/schemas/PendingAction' }
        counts: { $ref: '#/components/schemas/CaseCounts' }
    ScopeItemInput:
      type: object
      additionalProperties: false
      required: [kind, lotId]
      properties:
        kind: { $ref: '#/components/schemas/ScopeItemKind' }
        lotId: { type: string, format: uuid }
        parentKey: { type: string, description: "Lot items only (default: the root)" }
        warehouseId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        stockStatus: { $ref: '#/components/schemas/StockStatus' }
        sourceDocumentId: { type: string, maxLength: 100 }
        customerRef: { type: string, maxLength: 200 }
        quantity: { type: number, exclusiveMinimum: 0 }
        baseUomId: { type: string, maxLength: 50 }
    ScopeItem:
      type: object
      required: [nodeKey, kind, isRoot, lot, item, included, effectivelyIncluded]
      properties:
        nodeKey: { type: string }
        parentKey: { type: string }
        kind: { $ref: '#/components/schemas/ScopeItemKind' }
        isRoot: { type: boolean }
        lot: { $ref: '#/components/schemas/LotRef' }
        item: { $ref: '#/components/schemas/ItemRef' }
        warehouseId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        stockStatus: { $ref: '#/components/schemas/StockStatus' }
        sourceDocumentId: { type: string }
        customerRef: { type: string }
        quantity: { type: number }
        baseUomId: { type: string }
        included: { type: boolean, description: "the item's own mark" }
        effectivelyIncluded: { type: boolean, description: "false when the item or an ancestor is excluded (CT-R6)" }
        exclusionReason: { type: string }
        origin: { type: string, enum: [Manual, Trace], description: "R2 — Trace items are reconciled by every re-trace; Manual items never" }
        new: { type: boolean, description: "R2 — found by a re-trace after the case was opened" }
    ScopeView:
      type: object
      required: [caseId, revision, editable, excludedCount, sha256, items, version]
      properties:
        caseId: { type: string, format: uuid }
        revision: { type: integer }
        editable: { type: boolean }
        excludedCount: { type: integer }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        items: { type: array, items: { $ref: '#/components/schemas/ScopeItem' } }
        version: { type: integer }
        snapshot: { $ref: '#/components/schemas/SnapshotRef', description: "R2 — the governing trace snapshot (approved, else submitted)" }
    SnapshotRef:
      type: object
      required: [snapshotId, revision, purpose, sha256, canonicalVersion, nodeCount, gapCount, truncated, computedAtUtc]
      properties:
        snapshotId: { type: string, format: uuid }
        revision: { type: integer }
        purpose: { type: string, enum: [Submitted, Approved] }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        canonicalVersion: { type: string, enum: [rt-v1] }
        nodeCount: { type: integer }
        gapCount: { type: integer }
        truncated: { type: boolean }
        computedAtUtc: { type: string, format: date-time }
    TimelineEntry:
      type: object
      required: [seq, kind, atUtc, refs]
      properties:
        seq: { type: integer }
        kind: { $ref: '#/components/schemas/CaseEventKind' }
        actor: { $ref: '#/components/schemas/UserRef' }
        atUtc: { type: string, format: date-time }
        text: { type: string }
        refs: { type: object, additionalProperties: { type: string } }
        signatureId: { type: string }
    TimelinePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    SubjectRef:
      type: object
      required: [module, subjectType, subjectId]
      properties:
        module: { type: string }
        subjectType: { type: string }
        subjectId: { type: string, format: uuid }
    PendingActionResponse:
      type: object
      required: [caseId, action, signatureRequired, actionCode, meaningCode, visualMode, subject, expiresAtUtc, version]
      properties:
        caseId: { type: string, format: uuid }
        action: { type: string }
        signatureRequired: { type: boolean }
        actionCode: { type: string }
        meaningCode: { type: string }
        visualMode: { type: string }
        subject: { $ref: '#/components/schemas/SubjectRef' }
        expiresAtUtc: { type: string, format: date-time }
        version: { type: integer }
    Notification:
      type: object
      required: [notificationId, caseId, customerRef, notifiedOn, channel, recordedBy]
      properties:
        notificationId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        customerRef: { type: string }
        notifiedOn: { type: string, format: date }
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        note: { type: string }
        supersedesId: { type: string, format: uuid }
        recordedBy: { $ref: '#/components/schemas/UserAt' }
    ConsumptionDeclaration:
      type: object
      required: [declarationId, caseId, customerRef, skuId, skuLevel, baseUomId, quantity, declaredOn, evidence, recordedBy]
      properties:
        declarationId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        customerRef: { type: string }
        skuId: { type: string, format: uuid }
        skuLevel: { $ref: '#/components/schemas/SkuLevel' }
        baseUomId: { type: string }
        quantity: { type: number }
        declaredOn: { type: string, format: date }
        evidence: { type: string }
        supersedesId: { type: string, format: uuid }
        recordedBy: { $ref: '#/components/schemas/UserAt' }
    Segregation:
      type: object
      required: [segregationId, caseId, nodeKey, locationId, quantity, confirmedBy]
      properties:
        segregationId: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        nodeKey: { type: string }
        warehouseId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        quantity: { type: number }
        note: { type: string }
        confirmedBy: { $ref: '#/components/schemas/UserAt' }
    LotRecallCase:
      type: object
      required: [number, sameCompany]
      properties:
        caseId: { type: string, format: uuid, description: "only for a case of the caller's company" }
        number: { type: string }
        status: { $ref: '#/components/schemas/CaseStatus' }
        sameCompany: { type: boolean }
    LotRecallStatus:
      type: object
      required: [lotId, underRecall, cases]
      properties:
        lotId: { type: string, format: uuid }
        underRecall: { type: boolean }
        cases: { type: array, items: { $ref: '#/components/schemas/LotRecallCase' } }
    NoteBody:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
        note: { type: string, maxLength: 1000 }
    ReasonBody:
      type: object
      additionalProperties: false
      required: [idempotencyKey, reason]
      properties:
        idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
        reason: { type: string, minLength: 10, maxLength: 1000 }
    KeyBody:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
    SignedNoteBody:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
        note: { type: string, maxLength: 1000 }
        signatureId: { type: string, maxLength: 100 }
    TraceNode:
      type: object
      required: [nodeKey, level, kind]
      additionalProperties: true
      description: "Pack §8.2 node (R2): lot, item, warehouse, stockStatus, holdId, quantity, baseUomId, movement, shipment {shipmentId, read: Ok|Forbidden|NotFound|Unavailable|NotApplicable, status, actualDeliverAt, shipToReference}, customerRef, serials, badges, untracked (Takip dışı — never a gap), scope {included, exclusionReason, new, outOfScopeFinding}."
      properties:
        nodeKey: { type: string }
        parentKey: { type: string }
        level: { type: integer }
        kind: { type: string, enum: [RawMaterialLot, FinishedGoodLot, Lot, Input, Stock, Shipment, Customer, Gap, Disposal] }
        untracked: { type: boolean }
    TraceGap:
      type: object
      required: [code, nodeKey, text]
      additionalProperties: true
      properties:
        code: { type: string, enum: [LOTLESS_OUTBOUND, UNRESOLVED_TYPED_LOT, MISSING_GENEALOGY_LINK, CONSUMED_WITHOUT_OUTPUT_LINK, NO_CUSTOMER_REFERENCE, LIMIT_REACHED, OTHER_COMPANY_ACTIVITY] }
        nodeKey: { type: string }
        text: { type: string }
    TraceResult:
      type: object
      required: [rootLotId, direction, computedAtUtc, durationMs, truncated, nodes, edges, gaps, summary, canonicalVersion, sha256]
      additionalProperties: true
      properties:
        rootLotId: { type: string, format: uuid }
        rootLotNumber: { type: string }
        direction: { $ref: '#/components/schemas/TraceDirection' }
        asOfUtc: { type: string, format: date-time }
        computedAtUtc: { type: string, format: date-time }
        durationMs: { type: integer }
        truncated: { type: boolean }
        nodes: { type: array, items: { $ref: '#/components/schemas/TraceNode' } }
        edges: { type: array, items: { type: object, additionalProperties: true } }
        gaps: { type: array, items: { $ref: '#/components/schemas/TraceGap' } }
        summary: { type: object, additionalProperties: true }
        canonicalVersion: { type: string }
        sha256: { type: string }
    ScopeDiff:
      type: object
      required: [approvedSha256, liveSha256, added, removed, computedAtUtc]
      properties:
        approvedSha256: { type: string }
        liveSha256: { type: string }
        added: { type: array, items: { $ref: '#/components/schemas/TraceNode' } }
        removed: { type: array, items: { type: string } }
        computedAtUtc: { type: string, format: date-time }
    QuarantineRequest:
      type: object
      required: [requestId, status, holdIds, attempts]
      additionalProperties: true
      properties:
        requestId: { type: string, format: uuid }
        status: { type: string, enum: [Pending, Held, PartiallyHeld, BlockedByReservation, NothingAvailable, Failed, NotNeeded] }
        notNeededReason: { type: string, enum: [AlreadyQuarantined, AlreadyBlocked, LotBlocked, LotExpired, Excluded] }
        holdIds: { type: array, items: { type: string } }
        attempts: { type: integer }
    StockLine:
      type: object
      required: [nodeKey, lot, quantity, baseUomId]
      additionalProperties: true
      properties:
        nodeKey: { type: string }
        lot: { $ref: '#/components/schemas/LotRef' }
        quantity: { type: number }
        baseUomId: { type: string }
        request: { $ref: '#/components/schemas/QuarantineRequest' }
    CustomerRow:
      type: object
      required: [customerRef, shipments]
      additionalProperties: true
      properties:
        customerRef: { type: string }
        label: { type: string }
        shipments: { type: array, items: { type: object, additionalProperties: true } }
        notification: { $ref: '#/components/schemas/Notification' }
        notifications: { type: array, items: { $ref: '#/components/schemas/Notification' }, description: "1.6.0 — every notification of the customer, oldest first (superseded ones included)" }
        consumptions: { type: array, items: { $ref: '#/components/schemas/ConsumptionDeclaration' }, description: "1.6.0 — the effective (not superseded) consumption declarations of the customer" }
    CaseCustomerShipment:
      type: object
      description: "1.6.0 — one Shipment item of the scope as getCaseCustomers shows it"
      required: [nodeKey, lot, item, quantity, baseUomId, movements, read]
      additionalProperties: false
      properties:
        nodeKey: { type: string }
        lot: { $ref: '#/components/schemas/LotRef' }
        item: { $ref: '#/components/schemas/ItemRef' }
        sourceDocumentId: { type: string }
        quantity: { type: number }
        baseUomId: { type: string }
        movements: { type: array, items: { type: object, additionalProperties: false, required: [transactionId, quantity, postingDate], properties: { transactionId: { type: string }, number: { type: string }, quantity: { type: number }, postingDate: { type: string, format: date-time } } } }
        read: { type: string, enum: [NotApplicable, Ok, Forbidden, NotFound, Unavailable] }
        status: { type: string }
        actualDeliverAt: { type: string, format: date-time }
        shipToReference: { type: string }
    ReturnLink:
      type: object
      required: [linkId, source, transactionId, quantity, baseUomId, customerRef]
      additionalProperties: true
      properties:
        linkId: { type: string, format: uuid }
        source: { type: string, enum: [Mod0186Return, ManualCustomerReturn] }
        transactionId: { type: string }
        quantity: { type: number }
        baseUomId: { type: string }
        customerRef: { type: string }
        holdId: { type: string, format: uuid, description: "1.7.0 (D-28) — the MOD-0175 hold the return went into (its intake movement = transactionId); absent when none" }
        holdNumber: { type: string, description: "1.7.0 (D-28) — that hold's number (KRN-…)" }
    ReturnCandidate:
      type: object
      required: [transactionId, quantity, baseUomId, eligible]
      additionalProperties: true
      properties:
        transactionId: { type: string }
        quantity: { type: number }
        baseUomId: { type: string }
        eligible: { type: boolean }
        ineligibleReason: { type: string, enum: [NotQuarantined, NotInScope, BeforeApproval, AlreadyLinked] }
    DashboardView:
      type: object
      required: [openCases]
      additionalProperties: true
      properties:
        openCases: { type: object, additionalProperties: true }
        asOfUtc: { type: string, format: date-time }
        legalEntityId: { type: string, format: uuid }
        lastDrill: { $ref: '#/components/schemas/DashboardDrillPoint' }
        drillChart: { $ref: '#/components/schemas/DashboardDrillChart' }
        lotCoverage: { $ref: '#/components/schemas/DashboardLotCoverage' }
        traceGaps: { $ref: '#/components/schemas/DashboardTraceGaps' }
        returnedOpenCases: { type: array, items: { $ref: '#/components/schemas/DashboardReturned' } }
        frequencyWarning: { $ref: '#/components/schemas/DrillFrequencyWarning' }
        openCaseRows: { type: array, items: { $ref: '#/components/schemas/CaseRef' } }
    DashboardDrillPoint:
      type: object
      description: "1.5.0 — one Completed drill run: duration vs the CURRENT DrillTargetHours (onTarget = durationMinutes ≤ targetHours × 60)."
      required: [runId, number, lot, endedAtUtc, durationMinutes, targetHours, onTarget]
      additionalProperties: false
      properties:
        runId: { type: string, format: uuid }
        number: { type: string }
        lot: { $ref: '#/components/schemas/LotRef' }
        endedAtUtc: { type: string, format: date-time }
        durationMinutes: { type: integer }
        targetHours: { type: integer }
        onTarget: { type: boolean }
    DashboardDrillChart:
      type: object
      description: "1.5.0 — the last 12 Completed drill runs, oldest first, and the target line (DrillTargetHours now)."
      required: [targetHours, runs]
      additionalProperties: false
      properties:
        targetHours: { type: integer }
        runs: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/DashboardDrillPoint' } }
    DashboardLotCoverage:
      type: object
      description: "1.5.0 — outbound movements of lot-controlled SKUs (reversals netted) in the last windowDays: with a lot ÷ all; percent null when there is none."
      required: [windowDays, fromUtc, toUtc, withLot, total]
      additionalProperties: false
      properties:
        windowDays: { type: integer }
        fromUtc: { type: string, format: date-time }
        toUtc: { type: string, format: date-time }
        withLot: { type: integer }
        total: { type: integer }
        percent: { type: number }
    DashboardTraceGaps:
      type: object
      description: "1.5.0 — the LOTLESS_OUTBOUND movements of the window (lot-controlled SKU, no lot), newest first; movements lists at most 20."
      required: [windowDays, count, movements]
      additionalProperties: false
      properties:
        windowDays: { type: integer }
        count: { type: integer }
        movements:
          type: array
          maxItems: 20
          items:
            type: object
            required: [transactionId, postingDate, skuId, quantity, baseUomId]
            additionalProperties: false
            properties:
              transactionId: { type: string }
              number: { type: string }
              postingDate: { type: string, format: date-time }
              skuId: { type: string, format: uuid }
              quantity: { type: number }
              baseUomId: { type: string }
    DashboardReturned:
      type: object
      description: "1.5.0 — the linked return quantity of one open case per SKU + base unit (never summed across units)."
      required: [caseId, number, skuId, baseUomId, quantity]
      additionalProperties: false
      properties:
        caseId: { type: string, format: uuid }
        number: { type: string }
        skuId: { type: string, format: uuid }
        baseUomId: { type: string }
        quantity: { type: number }
    DrillPlanInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey, name, frequency, scopeKind, nextDueOn, ownerUserId]
      properties:
        idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 200 }
        frequency: { type: string, enum: [Yearly1, Yearly2, Quarterly, CustomDays] }
        customDays: { type: integer, minimum: 1, maximum: 730 }
        scopeKind: { type: string, enum: [RandomFinishedGoodLot, RawMaterialLot, SelectedLot] }
        nextDueOn: { type: string, format: date }
        ownerUserId: { type: string, format: uuid }
        active: { type: boolean }
    DrillPlan:
      type: object
      required: [planId, code, name, frequency, scopeKind, nextDueOn, owner, active, version]
      additionalProperties: true
      properties:
        planId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        frequency: { type: string }
        scopeKind: { type: string }
        nextDueOn: { type: string, format: date }
        owner: { $ref: '#/components/schemas/UserRef' }
        active: { type: boolean }
        version: { type: integer }
    DrillRun:
      type: object
      required: [runId, number, planId, status, selectionMode, lot, startedAtUtc, steps, targetHours, version]
      additionalProperties: true
      properties:
        runId: { type: string, format: uuid }
        number: { type: string, pattern: '^RC-\d{4}-D\d{3}$' }
        planId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DrillRunStatus' }
        selectionMode: { type: string, enum: [Auto, Manual] }
        lot: { $ref: '#/components/schemas/LotRef' }
        startedAtUtc: { type: string, format: date-time }
        steps: { type: array, items: { type: object, additionalProperties: true } }
        targetHours: { type: integer }
        version: { type: integer }
    DrillRunPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DrillRun' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        frequencyWarning: { $ref: '#/components/schemas/DrillFrequencyWarning' }
    DrillFrequencyWarning:
      type: object
      required: [warning, warningDays]
      additionalProperties: true
      properties:
        warning: { type: boolean }
        daysSinceLastCompleted: { type: integer }
        lastCompletedAtUtc: { type: string, format: date-time }
        warningDays: { type: integer }
    EvidencePreview:
      type: object
      required: [subject, generatedAtUtc, sections]
      additionalProperties: true
      properties:
        subject: { type: object, additionalProperties: true }
        generatedAtUtc: { type: string, format: date-time }
        sections: { type: object, additionalProperties: true, description: "1_summary, 2_trace, 3_quarantine, 4_customers, 5_returnsAndEffectiveness, 6_timeline, 7_signatures" }
    EvidenceExport:
      type: object
      required: [exportId, subject, format, fileName, sha256, sizeBytes, exportedBy]
      additionalProperties: true
      properties:
        exportId: { type: string, format: uuid }
        subject: { type: object, additionalProperties: true }
        format: { type: string, enum: [Pdf, Csv] }
        fileName: { type: string }
        sha256: { type: string, description: "of the produced file bytes" }
        sizeBytes: { type: integer }
        exportedBy: { $ref: '#/components/schemas/UserAt' }
        sections: { type: array, items: { type: string }, description: "1.7.0 — the section keys in the file (a drill run: 1_summary, 2_trace, 7_signatures; a period: 1_summary)" }
        dmsRef: { type: string, description: "1.7.0 — the DMS reference; absent (null) until MOD-0029 (FU-0177-EVID-01)" }
    EvidenceExportPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EvidenceExport' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    SignableSubject:
      type: object
      required: [display, legalEntityId, fields]
      additionalProperties: true
      properties:
        display: { type: string, maxLength: 300 }
        summary: { type: array, maxItems: 20, items: { type: object, additionalProperties: true } }
        legalEntityId: { type: string, format: uuid }
        fields: { type: object, additionalProperties: true }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            correlationId: { type: string }
        contractVersion: { type: string }
  responses:
    BadRequest: { description: Malformed request or a shape / rule code (see x-error-codes), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Missing key / other company (CROSS_LE_FORBIDDEN), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Unknown or another tenant's record, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: A state / version / SoD / scope / signature rule refused (see x-error-codes), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable: { description: A business rule refused (see x-error-codes), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
