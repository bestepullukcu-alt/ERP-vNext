openapi: 3.1.0
info:
  title: RECALL-BUNDLE
  description: >
    MOD-0177 Recall Readiness — full forward / backward trace, recall cases with a sealed scope, automatic quarantine requests, the exit
    block, customer / shipment follow-up, effectiveness check, read-only drills and the evidence pack, on top of the MOD-0173 ledger, the
    MOD-0174 lots / genealogy and the MOD-0175 quarantine (Blueprint W-4; report :189 RecallCase · RecallDrillPlan · TraceForwardQuery ·
    TraceBackwardQuery · EvidencePack). Frozen from the CT-accepted proposal drafts/recall-bundle-v1-proposal.md (WP-0177-P0 CT-ACCEPTED
    49aca0bbd) by WP-0177-R1, with the CT decisions of pack §19.7. MOD-0177 keeps no balance, creates no lot or genealogy link, makes no
    quarantine decision and writes no shipment, return or movement; it defines no stock status and no movement type. Tenant from the token,
    company from the W-0173-02 scope (X-Legal-Entity-Id validated against MDM); another company → 403 CROSS_LE_FORBIDDEN, another tenant →
    404 — except getLotRecallStatus, which answers for the lot in every company of the tenant (CT-R7). Success bodies are the schemas below
    (unwrapped); failures are the INVENTORY Error schema.
  version: 1.8.0
  x-status: FROZEN
  x-owner: MOD-0177
  x-owner-service: Diten.InventoryService (MOD-0177, in-process with MOD-0173 / MOD-0174 / MOD-0175 / MOD-0176)
  x-changelog:
    - "1.8.0 — additive, optional (WP-MVP1-NAMES1, owner decision A 2026-10-19: FU-0177-HEAD-NAMES + O-CLEAN1-1): UserRef and UserAt gain the optional member name. For a person who DID the action (opened, submitted, approved, completed, closed, cancelled, recorded, confirmed, prepared, revised, started, exported, changed the settings, the timeline actor) name is the name AT THE TIME of the action — the action record's own ActorName, else the central audit queue ActorDisplayName of the same correlation id and the same user (same tenant and company); absent when neither exists. For an ASSIGNED person (DrillPlan.owner) the service sends no name (a client shows the current account label). A client shows a localized \"unknown user\" when name is absent — never the id as a name. Names of a list are read in one batch. No existing member, type, enum, required list or status code changed."
    - "1.7.0 — WP-0177-R7b (additive only; pack §4.13, §8.6, §11.1 Kanıt Paketi; CT decisions 2026-10-15: D-28 option A, MOD-0175 owner step read-only): the evidence pack is served — previewEvidence (7 sections: 1_summary, 2_trace, 3_quarantine, 4_customers, 5_returnsAndEffectiveness, 6_timeline, 7_signatures for a case; a drill run fills 1, 2 and 7 and marks 3–5 not applicable (read-only rehearsal); a period [from, to] ≤ 366 days lists the drill runs of the company in it), createEvidenceExport (Pdf through PDFsharp-MigraDoc — labels tr / en, the FU-0176-PDF-L10N limit — or Csv; sha256 is the hex SHA-256 of the PRODUCED BYTES, which are stored: the same key answers the same file and hash; the export log row records file name, size, hash, sections, who, when, dmsRef null until MOD-0029), listEvidenceExports, getEvidenceFile (the stored bytes; their SHA-256 equals the logged one; an unknown export → 404 RECALL_EVIDENCE_EXPORT_NOT_FOUND, a new code). Section 7 reads every signatureId of the subject from MOD-0022 at generation time; an unreadable signature is reported as unreadable, never filled in. EvidenceExport gains the optional sections and dmsRef. D-28: ReturnLink gains the optional holdId / holdNumber — the MOD-0175 hold whose intake movement is the linked return (read through the recall port, absent when the movement opened no hold)."
    - "1.6.0 — WP-0177-R7a (additive only; pack §8.6, §11.1 Vaka Detayı; CT decision A 2026-10-15 — D-26, D-27): getCaseCustomers and getCaseEffectiveness are served. getCaseCustomers: one row per customer of the case's effectively included Shipment items (customerRef = shipToReference read at trace time, else DOC:<document>, D-18), each shipment with its ledger movements (net of reversals, the caller's company only) and — for MOD-0183 documents — the shipment re-read live (KR-E degrade NotApplicable / Ok / Forbidden / NotFound / Unavailable; delivered = actualDeliverAt, D-19); the current notification, the notification history and the effective consumption declarations of the customer. New schema CaseCustomerShipment (the shape of CustomerRow.shipments[]); CustomerRow gains the optional notifications and consumptions. getCaseEffectiveness: the LIVE result (the same function prepareCaseAction / completeEffectivenessCheck use) until the check is completed, then the stored result; per (customer, SKU, base unit), totals per SKU + base unit — never summed across units (D-20). Effectiveness gains the optional source (Live | Stored)."
    - "1.5.0 — WP-0177-R6 (additive only; pack §8.9, §8.10, §11.1; CT decision A 2026-10-15): getDashboard is served — DashboardView gains its members (asOfUtc, legalEntityId, openCases {total, byClass}, lastDrill, drillChart, lotCoverage, traceGaps, returnedOpenCases, frequencyWarning, openCaseRows), all optional, the 1.4.0 required list unchanged. listCases is the UNION read of Vakalar: a drill run is NOT a case (pack §4.11 / §4.12 give it no class or level, CaseRef keeps its required list), so drill runs travel in the new optional CasePage.drillRows (schema DrillCaseRow: runId, number, type Drill, status DrillRunStatus, lot, item, startedAtUtc, endedAtUtc, owner, durationMinutes, targetHours, passed); items still carries ONLY real cases. ONE page is cut on the server over both kinds (sort -openedAtUtc: case openedAtUtc / drill startedAtUtc descending, then number descending, cases before drills on a tie; sort number: number ascending), every row of the page carries sortAt (its sort time) and position (0-based place in the merged page), total counts both kinds. Filters: type Real → cases only, Drill → drills only, absent → both; status filters cases and the new repeatable drillStatus filters drills — a status of only one kind excludes the other kind; class excludes the drill rows (a drill has no class); skuId, openedFrom (drill startedAtUtc) and q (number / lot number) apply to both. CasePage gains the optional drillStatusCounts. Mockup difference D-25 (pack §21.3): the drill row carries no class or level (mockup cls:1, lvl)."
    - "1.4.0 — WP-0177-R5 (additive only; pack §4.11, §4.12, §8.8 dr-v1, §8.10 KR-G, CT-R17): the drills are served — listDrillPlans, createDrillPlan, updateDrillPlan (DP-NN per company, If-Match), listDrillRuns, startDrill, getDrillRun, completeDrillStep, prepareDrillResult, signDrillResult, cancelDrill. startDrill: StartedAtUtc and EndedAtUtc are SERVER times (no body takes a time member), TargetHours = the settings at start, Auto = a server random pick (audited) from the plan's candidates (finished-good lots with GOODS_ISSUE_SALES in the last 365 days / raw-material lots with genealogy children), Manual = the user's lot, one Running run per company (409 RECALL_DRILL_ALREADY_RUNNING). Steps strictly Trace → Scope → CustomerList (409 RECALL_DRILL_STEP_ORDER): Trace runs the R2 engine both ways at the company's full depth and stores a trace snapshot of purpose Drill; Scope writes no case scope; CustomerList stops the timer (DurationMinutes = ceil((End − Start) / 1 min), Passed = Duration ≤ TargetHours × 60). The result is prepared (resultNote 10–2000, 15 minutes) and signed as recall.drill.result on recall.drill-run (dr-v1, computed from the stored run; getSignableSubject now answers it, tenant + company bound); policy not required → completes unsigned. cancelDrill keeps the run as Cancelled (CT-R17); a Completed / Cancelled run never changes. A drill writes only the drill records, a Drill snapshot, the counter and audit rows. New code RECALL_DRILL_NOT_FOUND (404, registry) on the drill operations with a plan / run id. Reconciliations (R5 evidence §2): R5-1 prepareDrillResult reuses PendingActionResponse — caseId carries the run id, action SignDrillResult (the R4-1 pattern); R5-2 DrillRunPage gains the optional member frequencyWarning (DrillFrequencyWarning: days since the last Completed run > drillFrequencyWarningDays, or no completed run); R5-3 cancelDrill takes a mandatory reason (10–1000): x-error-codes gains INVALID_REQUEST, REASON_REQUIRED and the 400 response; R5-4 completeDrillStep gains INVALID_REQUEST + the 400 response (key / If-Match missing) and UNKNOWN_LOT (the drill lot vanished before the trace); R5-5 signDrillResult gains REASON_REQUIRED and RECALL_INVALID_TRANSITION (a closed run / steps not done). O-R5-2 (CT decision 2026-10-14): getSignableSubject gains a description and x-permission-by-subject-type — recall.drill-run is also readable with recall.drills.read (recall.case / recall.settings-change still recall.cases.read only); x-permission unchanged."
    - "1.3.0 — WP-0177-R4 (additive only; pack §8.8, CT-R1 / CT-R16, CT decision F3-A): getSignableSubject (the MOD-0022 subject provider — recall.case rc-v1, recall.settings-change rs-v1; recall.drill-run dr-v1 answers 404 until R5) and prepareSettingsChange (the proposal kept 15 minutes as the subject recall.settings-change) are served; getSignableSubject x-error-codes gains RECALL_SUBJECT_NOT_FOUND (404, new in the registry). Signatures bind with getSignature + the provider's own hash (not verifySignature): same tenant, signer = actor, action, meaning = the effective policy's, current subject hash, not invalidated, signed after the preparation, never used before; updateSettings accepts a signature only for the caller's prepared change of the same proposal on the same version (else 409 RECALL_SIGNATURE_MISMATCH). Reconciliations R4-1 the prepareSettingsChange answer reuses PendingActionResponse — caseId carries the change id, action UpdateSettings; R4-2 the effectiveness.* fields of rc-v1 are effectiveness.targetPercent + effectiveness.{skuId}.{baseUomId}.{shipped|returned|consumed|open|percent|met}."
    - "1.2.0 — WP-0177-R3 (additive only; pack §8.3 step 5, §8.4, §8.5, §8.6; CT-R2 / CT-R4 / CT-R5 / CT-R7 / CT-R10 / CT-R11 / CT-R12): getCaseStock, requestQuarantine, retryQuarantineRequest, getCaseReturns, linkReturn and reviseScope are served. KR-B: approveScope writes, in its transaction, the lot blocks (root + included forward lots) and one QuarantineRequest per Stock item of the approved revision (Pending, or NotNeeded with notNeededReason AlreadyQuarantined / AlreadyBlocked / LotBlocked / LotExpired / Excluded); after the commit each Pending request is ONE MOD-0175 quarantineStock call (mode Manual, one bucket, key recall:{caseId}:r{revision}:{nodeKey}, the approver as actor — QUARANTINE 1.3.0 origin MOD-0177 / RECALL_CASE); 409 QUARANTINE_STOCK_RESERVED → BlockedByReservation with the reservation lines (never cancelled), 409 QUARANTINE_NOTHING_AVAILABLE → NothingAvailable, other refusals → Failed; a hosted sweeper retries Pending older than 2 minutes every 60 s; retryQuarantineRequest moves to the key :a{n}. Hold status is read from MOD-0175 at display time. KR-C: the exit block is INVENTORY 1.4.0 LOT_UNDER_RECALL (GOODS_ISSUE_SALES, GOODS_ISSUE_PROD, WAREHOUSE_TRANSFER refused; by movement type only; tenant-wide by lot id; typed lots by number + SKU; checked before the FEFO hook, re-checked in the posting transaction); each refusal is a timeline row ExitRefused. KR-H: returns = CUSTOMER_RETURNs of the lots the case blocks; linkReturn needs a return posted after the approval into a held status (422 RECALL_RETURN_NOT_QUARANTINED otherwise), one case per return (409 RECALL_RETURN_ALREADY_LINKED), a customer of the approved scope; returned joins the effectiveness. CT-R5: reviseScope opens revision r+1 from out-of-scope findings of the live trace (the approved items copied unchanged, only the delta marked), CaseDetail.pendingRevision; the delta is approved by prepareCaseAction(ApproveScope) + approveScope on the Active case (same signature rule, the reviser cannot approve); the approval adds the delta lots' blocks and requests, never removes a block. New optional member CaseDetail.pendingRevision (PendingRevision); CaseEventKind + QuarantineRequested, QuarantineFailed, QuarantineRetried, ExitRefused, ReturnLinked, ScopeRevised; x-error-codes appended on retryQuarantineRequest (RECALL_CONFLICT) and reviseScope (RECALL_SCOPE_ITEM_NOT_MARKABLE, RECALL_SCOPE_EXCLUSION_REASON_REQUIRED, UNKNOWN_LOT). Reconciliations (R3 evidence §2): R3-1 a refusal in another company of the tenant carries recallCaseNumber but no recallCaseId (CT-R7, the getLotRecallStatus rule); R3-2 a request whose stock line names no location is Failed (INVALID_REQUEST) — 0175 needs a bucket; R3-3 the extra members of QuarantineRequest / StockLine / ReturnLink / ReturnCandidate (lot, warehouse, quantities, reservations, live holds) ride additionalProperties: true; R3-4 the segregation 'request held' rule (RECALL_SEGREGATION_NOT_HELD) stays open (R7)."
    - "1.1.0 — WP-0177-R2 (additive only; pack §8.2 / §8.3 / §8.6): runTrace, exportTrace and getCaseScopeDiff are served. The trace seal is canonical form rt-v1 (SHA-256 over the rule-10 ordered nodes and edges; shipment reads, customerRef derived from them and timing are excluded, so an MVP-6 outage never changes a seal). submitScope freezes a trace snapshot (Purpose Submitted, insert-only); prepareCaseAction(ApproveScope) / approveScope re-trace live and answer 409 RECALL_SCOPE_CHANGED with details {submittedSha256, currentSha256, added, removed} (node keys) when the seal differs; approveScope freezes the Approved snapshot and the scope reads show it from then on. New optional members: CaseDetail.submittedSnapshot / approvedSnapshot, ScopeView.snapshot (SnapshotRef), ScopeItem.origin (Manual | Trace) / new; CaseEventKind + TraceRun, OutOfScopeFinding. openCase fills the scope from the trace (root + forward Lot / Stock / Shipment nodes; Manual items are never touched by a re-trace). Reconciliations (R2 evidence §2): R2-1 WAREHOUSE_TRANSFER is internal to the company and is not an outbound node; R2-2 rule-10 orders by warehouse id (not code — no MDM read in the hash path); R2-3 the customer is carried on the Shipment node (customerRef), no separate Customer node is emitted; R2-4 reviseScope (CT-R5) moves to R3 with the lot blocks it changes; R2-5 holdId on Stock nodes joins with the R3 quarantine requests; R2-6 an unknown lot-control flag of a SKU is treated as lot-controlled (UNRESOLVED_TYPED_LOT stays visible); R2-7 OTHER_COMPANY_ACTIVITY carries a count only (CT-R8)."
    - "1.0.0 — frozen by WP-0177-R1 from the accepted proposal (2026-10-13) + pack §19.7: CT-R1 four-eyes both ways adds 409 RECALL_SOD_VIOLATION to prepareCaseAction / approveScope (the scope submitter cannot approve) and to prepareCaseAction / closeCase (the effectiveness completer cannot close); 409 RECALL_SCOPE_CHANGED on prepareCaseAction / approveScope (the scope is re-sealed at approval and compared with the submitted seal); CT-R5 reviseScope is a revision r+1 with its own signed approval of the delta; CT-R6 excluding a derived item excludes its subtree (reason ≥ 10); CT-R7 getLotRecallStatus is tenant-wide; CT-R16 recall.settings.update is signable with defaultRequired=false (reason mandatory); CT-R17 a cancelled drill run is kept (Cancelled); CT-R18 serial-level recall is out of v1 (scope and block are lot-level). Reconciliations of the freeze (R1 evidence §2): R-1 the envelope is the measured INVENTORY / FEFO wire (unwrapped success body, Error on failure); R-2 R1 enters the scope by hand — new operation addScopeItems (POST /cases/{caseId}/scope/items; Lot / Stock / Shipment items, node keys computed by the server) and new code 409 RECALL_SCOPE_ITEM_EXISTS; R2 fills the same items from the trace; R-3 ScopeView is {caseId, revision, editable, excludedCount, sha256, items, version} — the scope seal is the SHA-256 of the canonical scope (form rs-scope-v1); the trace snapshot (TraceResult) joins as an optional member in R2 (additive); R-4 CaseDetail carries submittedScope / approvedScope as ScopeSeal {revision, sha256, canonicalVersion, itemCount, computedAtUtc} instead of SnapshotRef; R-5 a case id that is not found answers 404 RECALL_CASE_NOT_FOUND (owned code, FEFO pattern); R-6 prepareCaseAction answers version (the If-Match of the decision) and is gated per action (approve / complete / close key) inside the handler, the route carries recall.cases.read; R-7 quantities and percents are JSON numbers, effectivenessTargetPercent is {\"1\",\"2\",\"3\"} → number; R-8 CaseRef.openedAtUtc (date-time) replaces openedOn; listCases sort is -openedAtUtc | number and the Drill filter answers an empty page until R5; R-9 confirmSegregation takes nodeKey in R1 (requestId with the R3 quarantine requests; RECALL_SEGREGATION_NOT_HELD from R3); R-10 declareConsumption requires evidence (1–1000); R-11 the audit actions of R1 are pack §8.12 plus recall.scope.items-added and recall.case.action-prepared (they change the scope / the case head). R-12 CaseRef / CaseDetail / ScopeItem carry item {itemId, skuId, skuLevel} (the FEFO R-2 shape) instead of product — the service guard forbids a Model-B Product type."
  x-decisions: [KR-A, KR-B, KR-C, KR-D, KR-E, KR-F, KR-G, KR-H, CT-R1, CT-R5, CT-R6, CT-R7, CT-R16, CT-R17, CT-R18]
  x-implemented-by-slice:
    R7b: [previewEvidence, listEvidenceExports, getEvidenceFile, createEvidenceExport]
    R7a: [getCaseCustomers, getCaseEffectiveness]
    R6: [getDashboard]
    R5: [listDrillPlans, createDrillPlan, updateDrillPlan, listDrillRuns, startDrill, getDrillRun, completeDrillStep, prepareDrillResult, signDrillResult, cancelDrill]
    R4: [prepareSettingsChange, getSignableSubject]
    R3: [getCaseStock, requestQuarantine, retryQuarantineRequest, getCaseReturns, linkReturn, reviseScope]
    R2: [runTrace, exportTrace, getCaseScopeDiff]
    R1: [getSettings, getSettingsHistory, updateSettings, listCases, getCase, getCaseScope, getCaseTimeline, getLotRecallStatus, openCase, addScopeItems, markScopeItems, submitScope, returnScope, prepareCaseAction, approveScope, cancelCase, confirmSegregation, recordNotification, declareConsumption, startEffectivenessCheck, completeEffectivenessCheck, closeCase]
    not-yet-implemented: []
servers: [{ url: /api/recall }]
security: [{ bearerAuth: [] }]
x-rules:
  - "Every write takes the Idempotency-Key header equal to body idempotencyKey (8–100). Same key + same body → the first result (200); same key + different body → 400 IDEMPOTENCY_KEY_REUSED."
  - "Mutable records (case, settings, drill plan, drill run) need If-Match W/\"<version>\" or \"<version>\" where stated; stale → 409 RECALL_CONFLICT. updateSettings takes If-Match \"0\" before the company's first save. Append-only records (notification, consumption, segregation, return link) take no If-Match."
  - "This contract moves no stock, writes no lot, genealogy link, hold decision, shipment, return or signature. Quarantine requests go through MOD-0175's own command in-process (pack §8.4); the exit block runs inside INVENTORY postMovement (422 LOT_UNDER_RECALL, INVENTORY 1.4.0 — R3)."
  - "Every command writes an audit row (inventory_audit, pack §8.12) in the transaction of its change; case events are insert-only. Signatures are MOD-0022 references only (signatureId) — this module keeps no signature record."
  - "Scope approval, effectiveness completion and closure need a prepared decision of the same user (15 minutes) and, when the MOD-0022 effective policy of the action says required, a verified signatureId (default: required). CT-R1: the scope submitter cannot approve; the effectiveness completer cannot close."
  - "The scope is sealed at submit (SHA-256 of its canonical form) and re-sealed at approval; a different seal refuses the approval (409 RECALL_SCOPE_CHANGED). The approved scope never changes afterwards; additions are a revision (CT-R5)."
  - "Quantities of different SKUs or base units are never summed."
  - "No new stock status and no new movement type is defined."
x-permissions:
  owned: [recall.dashboard.read, recall.trace.run, recall.trace.export, recall.cases.read, recall.cases.create, recall.cases.update, recall.cases.approve, recall.cases.cancel, recall.cases.close, recall.effectiveness.complete, recall.quarantine-requests.create, recall.segregations.confirm, recall.notifications.create, recall.consumptions.create, recall.returns.link, recall.drills.read, recall.drills.manage, recall.drills.run, recall.evidence.export, recall.settings.read, recall.settings.manage, recall.lots.status.read]
  api-only: [recall.lots.status.read]
  external-used-not-declared: [esign.signatures.sign, trace.lots.read, quarantine.holds.read, inventory.movements.create]
x-signable-actions:
  module: recall
  defaultMeaningCode: APPROVE
  defaultVisualMode: savedAccepted
  actions:
    - { actionCode: recall.scope.approve, defaultRequired: true, subject: recall.case }
    - { actionCode: recall.effectiveness.complete, defaultRequired: true, subject: recall.case }
    - { actionCode: recall.case.close, defaultRequired: true, subject: recall.case }
    - { actionCode: recall.drill.result, defaultRequired: true, subject: recall.drill-run }
    - { actionCode: recall.settings.update, defaultRequired: false, subject: recall.settings-change }
  subjects:
    recall.case: { fieldListVersion: rc-v1, fields: [number, status, class, level, legalEntityId, rootLotId, rootLotNumber, skuId, direction, reason, reasonReference, scopeRevision, submittedSnapshotSha256, approvedSnapshotSha256, excludedCount, includedStockCount, includedShipmentCount, pendingAction, pendingActionPayloadSha256, "effectiveness.*", closureSummary, openQuantityAcceptance, version] }
    recall.drill-run: { fieldListVersion: dr-v1, fields: [number, planCode, lotId, lotNumber, startedAtUtc, endedAtUtc, durationMinutes, targetHours, passed, gapCount, snapshotSha256, resultNote, version] }
    recall.settings-change: { fieldListVersion: rs-v1, fields: [legalEntityId, settingsVersion, "changes.*", reason] }
  note: "Registration (POST /api/internal/esign/actions/register) and the golden vectors of the canonical subjects come with R4; until then the production gate is fail-closed (no approval, completion or closure passes)."
paths:
  /dashboard:
    get:
      operationId: getDashboard
      summary: "Hazırlık Paneli (R6) — open cases by class, last drill vs target, 90-day lot coverage and gaps, returned quantity of open cases, last 12 drills, frequency warning (pack §8.9)."
      x-permission: recall.dashboard.read
      x-error-codes: [CROSS_LE_FORBIDDEN]
      responses:
        '200': { description: Panel, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /trace:
    get:
      operationId: runTrace
      summary: "İzleme (R2) — full genealogy backward / forward (KR-D), stock, outbound movements, shipments read at read time (KR-E), gaps as rows, 'Takip dışı' inputs. Writes nothing but the audit row recall.trace.run."
      x-permission: recall.trace.run
      x-error-codes: [INVALID_REQUEST, UNKNOWN_LOT, CROSS_LE_FORBIDDEN]
      parameters:
        - { name: rootLotId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: direction, in: query, schema: { $ref: '#/components/schemas/TraceDirection' } }
        - { name: asOfUtc, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Trace, content: { application/json: { schema: { $ref: '#/components/schemas/TraceResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /trace/export:
    get:
      operationId: exportTrace
      summary: "Trace CSV (R2) — UTF-8 BOM, ';' separated; not logged as evidence."
      x-permission: recall.trace.export
      x-error-codes: [INVALID_REQUEST, UNKNOWN_LOT, CROSS_LE_FORBIDDEN]
      parameters:
        - { name: rootLotId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: direction, in: query, schema: { $ref: '#/components/schemas/TraceDirection' } }
        - { name: format, in: query, schema: { type: string, enum: [csv] } }
      responses:
        '200': { description: CSV, content: { text/csv: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cases:
    get:
      operationId: listCases
      summary: "Vakalar — filters type (Real | Drill; Drill rows from R5), status (repeatable), class, skuId, openedFrom, q (number / root lot number); sort -openedAtUtc (default) | number; status chip counts."
      description: "1.5.0 (R6, CT decision A) — the union read: real cases in items (CaseRef), drill runs in drillRows (DrillCaseRow); one page cut on the server over both kinds, every row with sortAt + position. type Real / Drill / absent; status (CaseStatus) filters cases, drillStatus (DrillRunStatus) filters drills, a status of only one kind excludes the other kind; class excludes drill rows; skuId, openedFrom, q apply to both."
      x-permission: recall.cases.read
      x-error-codes: [INVALID_REQUEST, CROSS_LE_FORBIDDEN]
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [Real, Drill] } }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/CaseStatus' } }, style: form, explode: true }
        - { name: class, in: query, schema: { type: integer, minimum: 1, maximum: 3 } }
        - { name: skuId, in: query, schema: { type: string, format: uuid } }
        - { name: openedFrom, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [-openedAtUtc, number], default: -openedAtUtc } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: drillStatus, in: query, schema: { type: array, items: { $ref: '#/components/schemas/DrillRunStatus' } }, style: form, explode: true }
      responses:
        '200': { description: Cases, content: { application/json: { schema: { $ref: '#/components/schemas/CasePage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: openCase
      summary: "Vaka aç — R1 by hand from a root lot (from a trace in R2). One non-terminal case per company + root lot (409 RECALL_CASE_ALREADY_OPEN, details.caseId). Creates the root Lot item of the scope."
      x-permission: recall.cases.create
      x-error-codes: [INVALID_REQUEST, REASON_REQUIRED, IDEMPOTENCY_KEY_REUSED, UNKNOWN_LOT, RECALL_CASE_ALREADY_OPEN, CROSS_LE_FORBIDDEN]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotencyKey, rootLotId, direction, class, level, reason]
              properties:
                idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
                rootLotId: { type: string, format: uuid }
                direction: { $ref: '#/components/schemas/TraceDirection' }
                class: { type: integer, minimum: 1, maximum: 3 }
                level: { $ref: '#/components/schemas/RecallLevel' }
                reason: { type: string, minLength: 10, maxLength: 1000 }
