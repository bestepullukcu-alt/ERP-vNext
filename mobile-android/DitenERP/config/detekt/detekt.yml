# Diten ERP mobile - Detekt configuration.
# Built on top of Detekt's default rule set (buildUponDefaultConfig = true);
# only intentional deviations for this skeleton are declared here.

style:
  MagicNumber:
    # Brand color literals and Compose dp/sp values are intentional here.
    active: false
  MaxLineLength:
    maxLineLength: 140
  FunctionOnlyReturningConstant:
    # Hilt @Provides methods that supply a constant binding are idiomatic.
    ignoreAnnotated: ['Provides']

naming:
  FunctionNaming:
    # Jetpack Compose @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # Compose brand color vals (e.g. DitenIndigo) use UpperCamelCase by convention.
    propertyPattern: '[A-Za-z][A-Za-z0-9]*'
